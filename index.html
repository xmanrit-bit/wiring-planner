<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; color: #222; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; background: #fff; border-bottom: 1px solid #ccd; }
  .topbar-title { font-weight: 600; margin-right: 12px; }
  .status { margin-left: auto; color: #667; font-size: 12px; }
  .app-version { color: #99a; font-size: 12px; margin-left: 12px; }
  .main { flex: 1; display: flex; min-height: 0; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1f2937; color: #ffffff; padding: 10px 20px; border-radius: 6px; font-size: 15px; z-index: 30; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); }
  .splitter { flex: none; width: 5px; cursor: col-resize; background: #dfe3ea; }
  .splitter:hover { background: #b8c4dc; }
  .more-select { width: 100%; }
  .circuit-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--dot, #999999); }
  .palette-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
  .toolbar { flex: none; width: var(--toolbar-width, 150px); padding: 8px; background: #f7f8fa; border-right: 1px solid #ccd; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .toolbar-separator { height: 1px; background: #ccd; margin: 6px 0; }
  .stage { flex: 1; position: relative; overflow: hidden; background: #e9edf2; }
  .stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
  .sidebar { flex: none; width: var(--sidebar-width, 240px); padding: 10px; background: #fff; border-left: 1px solid #ccd; overflow-y: auto; }
  button { font: inherit; padding: 5px 9px; border: 1px solid #b8bfcc; background: #fff; border-radius: 4px; cursor: pointer; text-align: left; }
  button:hover { background: #eef2f8; }
  button.active { background: #dbe8ff; border-color: #4a7bd8; }
  .side-title { margin: 12px 0 6px; font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
  .field-input { font: inherit; padding: 4px 6px; border: 1px solid #b8bfcc; border-radius: 4px; }
  .hint { margin-top: 12px; color: #667; font-size: 12px; line-height: 1.4; }
  .totals-row { display: flex; justify-content: space-between; padding: 2px 0; }
  .totals-row.total { font-weight: 600; border-top: 1px solid #ccd; margin-top: 2px; padding-top: 4px; }
  .full-button { width: 100%; margin-top: 6px; }
  .keep-tool { display: flex; align-items: center; gap: 4px; margin-left: 12px; cursor: pointer; }
  .modal { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: #fff; padding: 16px; border-radius: 6px; width: min(760px, 94vw); max-height: 86vh; overflow: auto; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
  .modal-close { margin-left: auto; }
  .custom-type-row { display: flex; gap: 6px; margin: 6px 0 10px; }
  .type-row { display: grid; grid-template-columns: 1fr 70px 100px 110px 80px; gap: 6px; margin: 6px 0; align-items: center; }
  .type-head { font-size: 12px; color: #667; }
  .circuit-row { display: grid; grid-template-columns: minmax(160px, 1fr) 100px 150px 70px 100px 190px 90px; gap: 8px; margin: 6px 0; align-items: center; }
  .circuit-row > * { min-width: 0; width: 100%; box-sizing: border-box; }
  #circuitsModal .modal-box { width: min(1100px, 96vw); }
  .material-row { display: grid; grid-template-columns: 1fr 110px 40px; gap: 6px; padding: 3px 0; border-bottom: 1px solid #eef0f4; }
  .material-qty { text-align: right; }
  @media print {
    .print-material .app, .print-material .modal:not(#materialModal) { display: none; }
    .print-material #materialModal { position: static; background: none; display: block; }
    .print-material .modal-actions { display: none; }
  }
  .hidden { display: none; }
.label3d-box { position: absolute; z-index: 20; padding: 6px; background: #fff; border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
.label3d-info { margin-top: 4px; font: 12px Segoe UI, Arial, sans-serif; color: #374151; }
.label3d-input { width: 240px; padding: 4px 8px; font: 14px Segoe UI, Arial, sans-serif; border: 1px solid #2563eb; border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }

// Default wire colors by core count (yellow-green, blue, brown, black, grey).
function defaultColors(cores) {
  var all = ['#8fbf2a', '#1e6bd6', '#7a4a1e', '#111111', '#8a8f98'];

  if (cores === 2) {
    return ['#1e6bd6', '#7a4a1e'];
  }

  var colors = [];

  for (var i = 0; i < cores; i++) {
    colors.push(all[i % all.length]);
  }

  return colors;
}

function makeCableType(id, name, cores, section, shape) {
  return { id: id, name: name, cores: cores, section: section, shape: shape, colors: defaultColors(cores) };
}

function createDefaultCableTypes() {
  return [
    makeCableType('cable-d1', 'CYKY-J 3×1,5', 3, 1.5, 'round'),
    makeCableType('cable-d2', 'CYKY-J 3×2,5', 3, 2.5, 'round'),
    makeCableType('cable-d3', 'CYKY-J 5×1,5', 5, 1.5, 'round'),
    makeCableType('cable-d4', 'CYKY-J 5×2,5', 5, 2.5, 'round'),
    makeCableType('cable-d5', 'CYKY-O 2×1,5', 2, 1.5, 'round')
  ];
}

// Makes sure the loaded data has cable types and converts the old fixed types.
function ensureCableTypes(data) {
  if (Array.isArray(data.cableTypes) && data.cableTypes.length > 0) {
    for (var t = 0; t < data.cableTypes.length; t++) {
      var type = data.cableTypes[t];
      type.cores = type.cores || 3;
      type.section = type.section || 0;
      type.shape = type.shape || 'round';
      type.colors = type.colors || defaultColors(type.cores);
    }

    return;
  }

  data.cableTypes = createDefaultCableTypes();
  var surfaces = data.walls.concat([data.ceiling]);
  var used = {};

  for (var s = 0; s < surfaces.length; s++) {
    for (var c = 0; c < surfaces[s].cables.length; c++) {
      used[surfaces[s].cables[c].typeId] = true;
    }
  }

  if (used.c3) {
    data.cableTypes.push({ id: 'c3', name: '3-žilový kábel', cores: 3, section: 0, shape: 'round', colors: ['#2e9e3e', '#1e6bd6', '#111111'] });
  }

  if (used.c2) {
    data.cableTypes.push({ id: 'c2', name: '2-žilový kábel', cores: 2, section: 0, shape: 'round', colors: ['#1e6bd6', '#111111'] });
  }
}

var canvas = null;
var ctx = null;
var canvasWidth = 0;
var canvasHeight = 0;
var fileHandle = null;
var saveTimer = null;

// ---------- Helpers ----------

function createEmptyState() {
  return { version: 1, wallHeight: 260, nextId: 1, wallCounter: 0, nodes: [], walls: [], ceiling: { openings: [], symbols: [], cables: [] }, cableTypes: createDefaultCableTypes(), circuits: [], customTypes: [] };
}

function newId() {
  var id = state.nextId;
  state.nextId = state.nextId + 1;
  return id;
}

function dist(ax, ay, bx, by) {
  return Math.sqrt((ax - bx) * (ax - bx) + (ay - by) * (ay - by));
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function snapValue(value, step) {
  return Math.round(value / step) * step;
}

function roundTo(value, decimals) {
  var k = Math.pow(10, decimals);
  return Math.round(value * k) / k;
}

function distToSegment(px, py, ax, ay, bx, by) {
  var dx = bx - ax;
  var dy = by - ay;
  var lengthSq = dx * dx + dy * dy;

  if (lengthSq === 0) {
    return dist(px, py, ax, ay);
  }

  var t = clamp(((px - ax) * dx + (py - ay) * dy) / lengthSq, 0, 1);
  return dist(px, py, ax + t * dx, ay + t * dy);
}

function formatText(key, params) {
  var text = TEXTS[key];

  for (var name in params) {
    text = text.split('{' + name + '}').join(params[name]);
  }

  return text;
}

function createElement(tag, className, text) {
  var node = document.createElement(tag);

  if (className) {
    node.className = className;
  }

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

function getNode(id) {
  for (var i = 0; i < state.nodes.length; i++) {
    if (state.nodes[i].id === id) {
      return state.nodes[i];
    }
  }

  return null;
}

function getWall(id) {
  for (var i = 0; i < state.walls.length; i++) {
    if (state.walls[i].id === id) {
      return state.walls[i];
    }
  }

  return null;
}

function getActiveWall() {
  return getWall(ui.activeWallId);
}

// The surface that holds the items being edited: a wall or the ceiling.
function getActiveSurface() {
  if (ui.mode === 'ceiling') {
    return state.ceiling;
  }

  var wall = getActiveWall();

  if (ui.activeSide === 'back' && wall) {
    return getBackFace(wall);
  }

  return wall;
}

// The other side of a wall: own symbols and cables, mirrored edges (a and b swapped).
function getBackFace(wall) {
  if (!wall.back) {
    wall.back = { symbols: [], cables: [] };
  }

  wall.back.openings = wall.back.openings || [];

  return { id: wall.id, number: wall.number, a: wall.b, b: wall.a, isBack: true, openings: wall.back.openings, symbols: wall.back.symbols, cables: wall.back.cables };
}

// Passages of the active wall, with x converted to the side that is shown.
function getSidePassages() {
  var wall = ui.mode === 'wall' ? getActiveWall() : null;
  var result = [];

  if (!wall) {
    return result;
  }

  wall.passages = wall.passages || [];
  var length = wallLength(wall);

  for (var i = 0; i < wall.passages.length; i++) {
    var passage = wall.passages[i];
    result.push({ item: passage, x: ui.activeSide === 'back' ? length - passage.x : passage.x, y: passage.y });
  }

  return result;
}

// All places that hold items: both sides of every wall and the ceiling.
function getAllSurfaces() {
  var surfaces = [];

  for (var i = 0; i < state.walls.length; i++) {
    surfaces.push(state.walls[i]);

    if (state.walls[i].back) {
      surfaces.push(state.walls[i].back);
    }
  }

  surfaces.push(state.ceiling);
  return surfaces;
}

// Allowed range of item positions on the active surface.
function getSurfaceLimits() {
  if (ui.mode === 'ceiling') {
    return { minX: -100000, maxX: 100000, minY: -100000, maxY: 100000 };
  }

  return { minX: 0, maxX: wallLength(getActiveWall()), minY: 0, maxY: state.wallHeight };
}

function wallLength(wall) {
  var a = getNode(wall.a);
  var b = getNode(wall.b);
  return dist(a.x, a.y, b.x, b.y);
}

function getCableTypeStrict(id) {
  for (var i = 0; i < state.cableTypes.length; i++) {
    if (state.cableTypes[i].id === id) {
      return state.cableTypes[i];
    }
  }

  return null;
}

function getCableType(id) {
  return getCableTypeStrict(id) || state.cableTypes[0];
}

function countCablesOfType(typeId) {
  var surfaces = getAllSurfaces();
  var count = 0;

  for (var s = 0; s < surfaces.length; s++) {
    for (var c = 0; c < surfaces[s].cables.length; c++) {
      if (surfaces[s].cables[c].typeId === typeId) {
        count = count + 1;
      }
    }
  }

  return count;
}

function cableLength(cable) {
  var total = 0;

  for (var i = 1; i < cable.points.length; i++) {
    total = total + dist(cable.points[i - 1].x, cable.points[i - 1].y, cable.points[i].x, cable.points[i].y);
  }

  return total + (cable.extra || 0);
}

// ---------- Coordinates ----------

function getDefaultView() {
  if ((ui.mode === 'ceiling' || ui.mode === 'plan') && state.nodes.length > 0) {
    var minX = state.nodes[0].x;
    var maxX = minX;
    var minY = state.nodes[0].y;
    var maxY = minY;

    for (var i = 1; i < state.nodes.length; i++) {
      minX = Math.min(minX, state.nodes[i].x);
      maxX = Math.max(maxX, state.nodes[i].x);
      minY = Math.min(minY, state.nodes[i].y);
      maxY = Math.max(maxY, state.nodes[i].y);
    }

    var boxWidth = Math.max(1, maxX - minX);
    var boxHeight = Math.max(1, maxY - minY);
    var fit = clamp(Math.min((canvasWidth - 120) / boxWidth, (canvasHeight - 120) / boxHeight), MIN_SCALE, MAX_SCALE);
    return { scale: fit, ox: (canvasWidth - boxWidth * fit) / 2 - minX * fit, oy: (canvasHeight - boxHeight * fit) / 2 - minY * fit };
  }

  if (ui.mode === 'plan' || ui.mode === 'ceiling') {
    return { scale: PLAN_SCALE, ox: PLAN_MARGIN, oy: PLAN_MARGIN };
  }

  var length = wallLength(getActiveWall());
  var pad = 60;
  var scale = Math.max(MIN_SCALE, Math.min((canvasWidth - 2 * pad) / length, (canvasHeight - 2 * pad) / state.wallHeight));
  return { scale: scale, ox: (canvasWidth - length * scale) / 2, oy: (canvasHeight - state.wallHeight * scale) / 2 };
}

// Uses the user's zoom and pan when set, otherwise the default view.
function updateView() {
  var current = cameras[ui.mode] || getDefaultView();
  view.scale = current.scale;
  view.ox = current.ox;
  view.oy = current.oy;
}

// Zooms around the mouse cursor.
function onWheel(event) {
  event.preventDefault();
  var p = getPointer(event);
  updateView();
  var factor = event.deltaY < 0 ? 1.15 : 1 / 1.15;
  var newScale = clamp(view.scale * factor, MIN_SCALE, MAX_SCALE);
  factor = newScale / view.scale;
  cameras[ui.mode] = { scale: newScale, ox: p.x - (p.x - view.ox) * factor, oy: p.y - (p.y - view.oy) * factor };
  render();
}

function worldToScreen(x, y) {
  if (ui.mode !== 'wall') {
    return { x: view.ox + x * view.scale, y: view.oy + y * view.scale };
  }

  return { x: view.ox + x * view.scale, y: view.oy + (state.wallHeight - y) * view.scale };
}

function screenToWorld(sx, sy) {
  if (ui.mode !== 'wall') {
    return { x: (sx - view.ox) / view.scale, y: (sy - view.oy) / view.scale };
  }

  return { x: (sx - view.ox) / view.scale, y: state.wallHeight - (sy - view.oy) / view.scale };
}

// ---------- Persistence ----------

function markChanged() {
  recordHistory();
  persistState();
}

// Saves the state to the browser storage and schedules the file write.
function persistState() {
  try {
    if (!hostMode) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  } catch (error) {
    // Storage is not available.
  }

  updateTotals();

  if (hostMode) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeHost, 500);
  } else if (fileHandle) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 500);
  }
}

// ---------- Saving through the desktop app (WebView2 host) ----------

var hostMode = Boolean(window.chrome && window.chrome.webview);
var statusPinnedUntil = 0;
var toastOnSaved = false;
var toastOnLoaded = false;
var toastTimer = null;

// Shows a short message in the middle of the bottom edge of the window.
function showToast(text) {
  var toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 2500);
}

function hostSend(message) {
  window.chrome.webview.postMessage(message);
}

function writeHost() {
  hostSend({ type: 'save', text: JSON.stringify(state, null, 2) });
}

function fileNameOf(path) {
  return String(path).split('\\').pop();
}

// Handles the answers of the desktop app: loaded data, save result and errors.
function onHostMessage(event) {
  var message = event.data;

  if (message.type === 'loaded') {
    if (!message.text) {
      writeHost();
      return;
    }

    try {
      if (!loadState(JSON.parse(message.text))) {
        setStatus(TEXTS.invalidFile);
        return;
      }
    } catch (error) {
      setStatus(TEXTS.invalidFile);
      return;
    }

    setStatus(formatText('statusHostLoaded', { name: fileNameOf(message.path) }));

    if (toastOnLoaded) {
      toastOnLoaded = false;
      showToast(formatText('toastOpened', { name: fileNameOf(message.path) }));
    }

    return;
  }

  if (message.type === 'cancelled') {
    pendingNew = false;
    return;
  }

  if (message.type === 'saved' && pendingNew) {
    pendingNew = false;
    loadState(createEmptyState());
  }

  if (message.type === 'saved') {
    var savedText = formatText('statusHostSaved', { name: fileNameOf(message.path), time: new Date().toLocaleTimeString() });
    setTimeout(function () { setStatus(savedText); }, Math.max(0, statusPinnedUntil - Date.now()));

    if (toastOnSaved) {
      toastOnSaved = false;
      showToast(formatText('toastSaved', { name: fileNameOf(message.path) }));
    }

    return;
  }

  if (message.type === 'error') {
    toastOnSaved = false;
    toastOnLoaded = false;
    setStatus(formatText('statusErrorDetail', { message: message.message }));
    showToast(formatText('statusErrorDetail', { message: message.message }));
  }
}

function initHost() {
  if (!hostMode) {
    return;
  }

  window.chrome.webview.addEventListener('message', onHostMessage);
  hostSend({ type: 'load' });
}
// ---------- Undo and redo ----------

var changeLog = { undo: [], redo: [], last: null };

function initHistory() {
  changeLog.undo = [];
  changeLog.redo = [];
  changeLog.last = JSON.stringify(state);
}

// Remembers the state after every change so it can be undone.
function recordHistory() {
  var snapshot = JSON.stringify(state);

  if (changeLog.last === null) {
    changeLog.last = snapshot;
    return;
  }

  if (snapshot === changeLog.last) {
    return;
  }

  changeLog.undo.push(changeLog.last);

  if (changeLog.undo.length > 100) {
    changeLog.undo.shift();
  }

  changeLog.redo = [];
  changeLog.last = snapshot;
}

function ensureValidTool() {
  if (ui.tool !== 'select' && !isOpeningTool(ui.tool) && ui.tool !== 'beam' && ui.tool !== 'addWall' && !isSymbolTool(ui.tool) && !isCableTool(ui.tool)) {
    ui.tool = 'select';
  }
}

function applySnapshot(snapshot) {
  state = JSON.parse(snapshot);
  cancelDrawing();
  ui.selected = null;
  ui.dragging = null;

  if (ui.mode === 'wall' && !getActiveWall()) {
    ui.mode = 'plan';
    ui.activeWallId = null;
  }

  ensureValidTool();
  persistState();
  refreshAll();
}

function undo() {
  if (changeLog.undo.length === 0) {
    return;
  }

  changeLog.redo.push(changeLog.last);
  changeLog.last = changeLog.undo.pop();
  applySnapshot(changeLog.last);
}

function redo() {
  if (changeLog.redo.length === 0) {
    return;
  }

  changeLog.undo.push(changeLog.last);
  changeLog.last = changeLog.redo.pop();
  applySnapshot(changeLog.last);
}

function setStatus(text) {
  elements.status.textContent = text;
}

async function writeFile() {
  try {
    var writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    setStatus(formatText('statusSaved', { time: new Date().toLocaleTimeString() }));

    if (toastOnSaved) {
      toastOnSaved = false;
      showToast(formatText('toastSaved', { name: fileHandle.name }));
    }
  } catch (error) {
    // The error is shown clearly and the data is downloaded so nothing is lost.
    var message = formatText('statusErrorDetail', { message: describeError(error) });
    setStatus(message);
    showToast(message);
    downloadState();
  }
}

function loadState(data) {
  if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.walls)) {
    return false;
  }

  var maxId = 0;
  var maxNumber = 0;

  for (var i = 0; i < data.nodes.length; i++) {
    maxId = Math.max(maxId, data.nodes[i].id);
  }

  for (var w = 0; w < data.walls.length; w++) {
    var wall = data.walls[w];
    wall.thickness = wall.thickness || 10;
    wall.openings = wall.openings || [];
    wall.passages = wall.passages || [];

    if (wall.back) {
      wall.back.symbols = wall.back.symbols || [];
      wall.back.cables = wall.back.cables || [];
      wall.back.openings = wall.back.openings || [];
    }

    wall.symbols = wall.symbols || [];
    wall.cables = wall.cables || [];
    maxId = Math.max(maxId, wall.id);
    maxNumber = Math.max(maxNumber, wall.number || 0);
  }

  data.wallHeight = data.wallHeight || 260;
  data.ceiling = data.ceiling || {};
  data.ceiling.openings = data.ceiling.openings || [];
  data.ceiling.symbols = data.ceiling.symbols || [];
  data.ceiling.cables = data.ceiling.cables || [];
  ensureCableTypes(data);
  data.circuits = data.circuits || [];

  for (var q = 0; q < data.circuits.length; q++) {
    data.circuits[q].width = data.circuits[q].width || 3.5;
  }
  data.nextId = Math.max(data.nextId || 1, maxId + 1, 1000);
  data.wallCounter = Math.max(data.wallCounter || 0, maxNumber);
  data.customTypes = data.customTypes || [];
  state = data;
  registerCustomTypes();
  initHistory();
  cameras.plan = null;
  cameras.wall = null;
  cameras.ceiling = null;
  ui.mode = 'plan';
  ui.tool = 'select';
  ui.selected = null;
  ui.activeWallId = null;
  ui.drawing = null;
  ui.preview = null;
  refreshAll();
  return true;
}

function loadFromLocal() {
  try {
    var text = localStorage.getItem(STORAGE_KEY);

    if (text) {
      loadState(JSON.parse(text));
    }
  } catch (error) {
    // Ignore damaged storage.
  }
}

async function openFile() {
  if (hostMode) {
    toastOnLoaded = true;
    hostSend({ type: 'open' });
    return;
  }

  elements.fileInput.click();
}

// Opening through the file system picker; kept for browsers served over https.
async function openFileWithPicker() {
  try {
    var handles = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
    var file = await handles[0].getFile();

    if (loadState(JSON.parse(await file.text()))) {
      fileHandle = handles[0];
      setStatus(handles[0].name);
    } else {
      alert(TEXTS.invalidFile);
    }
  } catch (error) {
    if (error && error.name === 'AbortError') {
      return;
    }

    setStatus(formatText('statusOpenError', { message: describeError(error) }));
    elements.fileInput.click();
  }
}

// Saves to the chosen file right away, or asks for a file when there is none yet.
function saveNow() {
  if (hostMode) {
    toastOnSaved = true;
    writeHost();
    return;
  }

  // In the browser the project is downloaded to the Downloads folder.
  downloadState();
  setStatus(TEXTS.statusDownloadedPlain);
  showToast(TEXTS.statusDownloadedPlain);
}

// Asks for a new file name and starts an empty flat there; the current file stays untouched.
var pendingNew = false;

function newProject() {
  if (hostMode) {
    pendingNew = true;
    toastOnSaved = true;
    hostSend({ type: 'saveAs', text: JSON.stringify(createEmptyState(), null, 2) });
    return;
  }

  loadState(createEmptyState());
  fileHandle = null;
  persistState();
}

async function saveAs() {
  if (hostMode) {
    toastOnSaved = true;
    hostSend({ type: 'saveAs', text: JSON.stringify(state, null, 2) });
    return;
  }

  // The browser asks where to save; if it cannot write there, the file is downloaded and the reason shown.
  if (!window.showSaveFilePicker) {
    downloadState();
    showToast(TEXTS.statusDownloadedPlain);
    return;
  }

  try {
    fileHandle = await window.showSaveFilePicker({ suggestedName: 'byt.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
  } catch (error) {
    if (error && error.name === 'AbortError' && /abort/i.test(error.message)) {
      showToast(TEXTS.saveCancelled + ' (' + describeError(error) + ')');
      return;
    }

    downloadState();
    showToast(formatText('statusErrorDetail', { message: describeError(error) }) + ' ' + TEXTS.statusDownloadedPlain);
    return;
  }

  toastOnSaved = true;
  await writeFile();
}

function describeError(error) {
  return error ? (error.name + ': ' + error.message) : '';
}

function downloadState() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'project.json';
  link.click();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
}

function onFileInputChange() {
  var file = elements.fileInput.files[0];

  if (!file) {
    return;
  }

  var reader = new FileReader();
  reader.onload = function () {
    try {
      if (!loadState(JSON.parse(reader.result))) {
        alert(TEXTS.invalidFile);
      }
    } catch (error) {
      alert(TEXTS.invalidFile);
    }
  };
  reader.readAsText(file);
  elements.fileInput.value = '';
}

// ---------- Plan model ----------

function createNode(x, y) {
  var node = { id: newId(), x: x, y: y };
  state.nodes.push(node);
  return node;
}

function createWall(aId, bId) {
  for (var i = 0; i < state.walls.length; i++) {
    var existing = state.walls[i];

    if ((existing.a === aId && existing.b === bId) || (existing.a === bId && existing.b === aId)) {
      return existing;
    }
  }

  state.wallCounter = state.wallCounter + 1;
  var wall = { id: newId(), number: state.wallCounter, a: aId, b: bId, thickness: 10, openings: [], symbols: [], cables: [], passages: [] };
  state.walls.push(wall);
  return wall;
}

function cleanupOrphanNodes() {
  var used = {};

  for (var i = 0; i < state.walls.length; i++) {
    used[state.walls[i].a] = true;
    used[state.walls[i].b] = true;
  }

  var kept = [];

  for (var n = 0; n < state.nodes.length; n++) {
    if (used[state.nodes[n].id]) {
      kept.push(state.nodes[n]);
    }
  }

  state.nodes = kept;
}

function mergeNodes(keepId, removeId) {
  var kept = [];

  for (var i = 0; i < state.walls.length; i++) {
    var wall = state.walls[i];

    if (wall.a === removeId) {
      wall.a = keepId;
    }

    if (wall.b === removeId) {
      wall.b = keepId;
    }

    if (wall.a !== wall.b) {
      kept.push(wall);
    }
  }

  state.walls = kept;
  cleanupOrphanNodes();
}

function deleteWall(wallId) {
  var kept = [];

  for (var i = 0; i < state.walls.length; i++) {
    if (state.walls[i].id !== wallId) {
      kept.push(state.walls[i]);
    }
  }

  state.walls = kept;
  cleanupOrphanNodes();
}

// Changes the length by moving one end ('a' or 'b'); the other end stays.
function setWallLength(wall, newLength, moveEnd) {
  var fixed = getNode(moveEnd === 'a' ? wall.b : wall.a);
  var moving = getNode(moveEnd === 'a' ? wall.a : wall.b);
  var current = dist(fixed.x, fixed.y, moving.x, moving.y);

  if (current < 0.001 || newLength <= 0) {
    return;
  }

  // Every point at or beyond the moving end shifts with it, so the rest of the flat moves instead of bending.
  var ux = (moving.x - fixed.x) / current;
  var uy = (moving.y - fixed.y) / current;
  var shiftX = ux * (newLength - current);
  var shiftY = uy * (newLength - current);
  var limit = current - 1;

  for (var i = 0; i < state.nodes.length; i++) {
    var node = state.nodes[i];
    var along = (node.x - fixed.x) * ux + (node.y - fixed.y) * uy;

    if (node === moving || along >= limit) {
      node.x = roundTo(node.x + shiftX, 1);
      node.y = roundTo(node.y + shiftY, 1);
    }
  }

  // Ceiling items in that part move too.
  var ceilingPoints = state.ceiling.symbols.slice();

  for (var c = 0; c < state.ceiling.cables.length; c++) {
    ceilingPoints = ceilingPoints.concat(state.ceiling.cables[c].points);
  }

  for (var p = 0; p < ceilingPoints.length; p++) {
    var point = ceilingPoints[p];

    if ((point.x - fixed.x) * ux + (point.y - fixed.y) * uy >= limit) {
      point.x = roundTo(point.x + shiftX, 1);
      point.y = roundTo(point.y + shiftY, 1);
    }
  }
}

function wallsAtNode(nodeId) {
  var count = 0;

  for (var i = 0; i < state.walls.length; i++) {
    if (state.walls[i].a === nodeId || state.walls[i].b === nodeId) {
      count = count + 1;
    }
  }

  return count;
}

// The end that moves: the one chosen by the user, otherwise the one with fewer connected walls.
function chooseMovingEnd(wall) {
  if (ui.moveEnd === 'a' || ui.moveEnd === 'b') {
    return ui.moveEnd;
  }

  return wallsAtNode(wall.a) < wallsAtNode(wall.b) ? 'a' : 'b';
}

// Name of a wall end as seen in the plan: left/right for lying walls, top/bottom for standing ones.
function wallEndName(wall, end) {
  var here = getNode(end === 'a' ? wall.a : wall.b);
  var other = getNode(end === 'a' ? wall.b : wall.a);

  if (Math.abs(other.x - here.x) >= Math.abs(other.y - here.y)) {
    return here.x < other.x ? TEXTS.endLeft : TEXTS.endRight;
  }

  return here.y < other.y ? TEXTS.endTop : TEXTS.endBottom;
}

function addMoveEndSelect(props, wall) {
  var row = createElement('label', 'field');
  row.appendChild(createElement('span', 'field-label', TEXTS.moveEndLabel));
  var select = createElement('select', 'field-input');
  var choices = [['auto', TEXTS.moveEndAuto], ['a', wallEndName(wall, 'a')], ['b', wallEndName(wall, 'b')]];

  for (var i = 0; i < choices.length; i++) {
    var option = createElement('option', '', choices[i][1]);
    option.value = choices[i][0];
    select.appendChild(option);
  }

  select.value = ui.moveEnd || 'auto';
  select.addEventListener('change', function () {
    ui.moveEnd = select.value;
  });
  row.appendChild(select);
  props.appendChild(row);
}

function findNodeNear(sx, sy, radius, excludeId) {
  for (var i = 0; i < state.nodes.length; i++) {
    var node = state.nodes[i];
    var p = worldToScreen(node.x, node.y);

    if (node.id !== excludeId && dist(sx, sy, p.x, p.y) <= radius) {
      return node;
    }
  }

  return null;
}

function findWallNear(sx, sy) {
  for (var i = 0; i < state.walls.length; i++) {
    var a = getNode(state.walls[i].a);
    var b = getNode(state.walls[i].b);
    var pa = worldToScreen(a.x, a.y);
    var pb = worldToScreen(b.x, b.y);

    if (distToSegment(sx, sy, pa.x, pa.y, pb.x, pb.y) <= 8) {
      return state.walls[i];
    }
  }

  return null;
}

// Locks the point to the horizontal or vertical axis through the start point.
function snapRightAngle(sx, sy, from) {
  var fromScreen = worldToScreen(from.x, from.y);
  var w = screenToWorld(sx, sy);

  if (Math.abs(sx - fromScreen.x) >= Math.abs(sy - fromScreen.y)) {
    return { x: snapValue(w.x, GRID_CM), y: from.y };
  }

  return { x: from.x, y: snapValue(w.y, GRID_CM) };
}

// Aligns the point with the horizontal or vertical axis of nearby points and remembers the guide lines.
function alignToPoints(x, y, sx, sy, points, excludeId) {
  var result = { x: x, y: y };

  for (var i = 0; i < points.length; i++) {
    var p = worldToScreen(points[i].x, points[i].y);

    if (points[i].id === excludeId && excludeId !== undefined && excludeId !== null) {
      continue;
    }

    if (ui.guide.x === null && Math.abs(sx - p.x) < ORTHO_PX) {
      result.x = points[i].x;
      ui.guide.x = points[i].x;
    }

    if (ui.guide.y === null && Math.abs(sy - p.y) < ORTHO_PX) {
      result.y = points[i].y;
      ui.guide.y = points[i].y;
    }
  }

  return result;
}

function snapPlanPoint(sx, sy, fromNode, excludeId) {
  ui.guide = { x: null, y: null };

  if (fromNode && ui.shift) {
    var locked = snapRightAngle(sx, sy, fromNode);
    return { x: locked.x, y: locked.y, node: null };
  }

  var node = findNodeNear(sx, sy, NODE_SNAP_PX, excludeId);

  if (node) {
    return { x: node.x, y: node.y, node: node };
  }

  var w = screenToWorld(sx, sy);
  var x = snapValue(w.x, GRID_CM);
  var y = snapValue(w.y, GRID_CM);

  if (fromNode) {
    var from = worldToScreen(fromNode.x, fromNode.y);

    if (Math.abs(sx - from.x) < ORTHO_PX) {
      x = fromNode.x;
    }

    if (Math.abs(sy - from.y) < ORTHO_PX) {
      y = fromNode.y;
    }
  }

  var aligned = alignToPoints(x, y, sx, sy, state.nodes, excludeId);
  return { x: aligned.x, y: aligned.y, node: null };
}

// ---------- Plan interaction ----------

function planPointerDown(p) {
  if (ui.tool === 'addWall') {
    planAddWallClick(p);
    return;
  }

  var clickedSide = findSideLabel(p.x, p.y);

  if (clickedSide) {
    openWall(ui.selected.id, clickedSide);
    return;
  }

  var node = findNodeNear(p.x, p.y, 10, null);

  if (node) {
    ui.dragging = { kind: 'node', id: node.id, moved: false };
    return;
  }

  var wall = findWallNear(p.x, p.y);
  ui.selected = wall ? { kind: 'wall', id: wall.id } : null;

  if (!wall) {
    ui.dragging = { kind: 'pan', lastX: p.x, lastY: p.y };
  }

  renderSidebar();
}

function planAddWallClick(p) {
  if (!ui.drawing) {
    var start = snapPlanPoint(p.x, p.y, null, null);
    var startNode = start.node || createNode(start.x, start.y);
    ui.drawing = { kind: 'wall', startNodeId: startNode.id, firstNodeId: startNode.id };
    return;
  }

  var from = getNode(ui.drawing.startNodeId);
  var end = snapPlanPoint(p.x, p.y, from, from.id);

  if (dist(end.x, end.y, from.x, from.y) < 1) {
    return;
  }

  var endNode = end.node || createNode(end.x, end.y);
  createWall(from.id, endNode.id);
  markChanged();

  if (end.node && endNode.id === ui.drawing.firstNodeId) {
    ui.drawing = null;
    finishTool();
  } else {
    ui.drawing.startNodeId = endNode.id;
  }
}

function planPointerMove(p) {
  ui.hoverSide = null;

  if (!ui.dragging && ui.tool === 'select') {
    var hovered = findWallNear(p.x, p.y);

    if (hovered) {
      ui.hoverSide = { wallId: hovered.id, side: sideOfWall(hovered, screenToWorld(p.x, p.y)) };
    }
  }

  if (ui.dragging && ui.dragging.kind === 'node') {
    var snapped = snapPlanPoint(p.x, p.y, null, ui.dragging.id);
    var node = getNode(ui.dragging.id);
    node.x = snapped.x;
    node.y = snapped.y;
    ui.dragging.moved = true;
    return;
  }

  if (ui.tool === 'addWall') {
    var fromNode = ui.drawing ? getNode(ui.drawing.startNodeId) : null;
    ui.preview = snapPlanPoint(p.x, p.y, fromNode, fromNode ? fromNode.id : null);
  }
}

function planPointerUp() {
  if (!ui.dragging || ui.dragging.kind !== 'node') {
    return;
  }

  var dragged = getNode(ui.dragging.id);

  if (ui.dragging.moved && dragged) {
    for (var i = 0; i < state.nodes.length; i++) {
      var other = state.nodes[i];

      if (other.id !== dragged.id && dist(other.x, other.y, dragged.x, dragged.y) < 0.5) {
        mergeNodes(other.id, dragged.id);
        break;
      }
    }

    markChanged();
    renderSidebar();
  }
}

// ---------- Wall model ----------

function findItem(wall, selected) {
  var list = wall.symbols;

  if (selected.kind === 'passage') {
    list = getActiveWall() ? getActiveWall().passages || [] : [];
  }

  if (selected.kind === 'cable') {
    list = wall.cables;
  } else if (selected.kind === 'opening') {
    list = wall.openings;
  }

  for (var i = 0; i < list.length; i++) {
    if (list[i].id === selected.id) {
      return list[i];
    }
  }

  return null;
}

function removeItem(wall, selected) {
  var key = 'symbols';

  if (selected.kind === 'passage') {
    wall = getActiveWall();
    key = 'passages';
  } else if (selected.kind === 'cable') {
    key = 'cables';
  } else if (selected.kind === 'opening') {
    key = 'openings';
  }

  for (var i = wall[key].length - 1; i >= 0; i--) {
    if (wall[key][i].id === selected.id) {
      wall[key].splice(i, 1);
    }
  }
}

function hitTestWall(wall, sx, sy) {
  var passages = getSidePassages();

  for (var ps = 0; ps < passages.length; ps++) {
    var pp = worldToScreen(passages[ps].x, passages[ps].y);

    if (dist(sx, sy, pp.x, pp.y) <= 12 * symbolScale()) {
      return { kind: 'passage', id: passages[ps].item.id };
    }
  }

  for (var s = 0; s < wall.symbols.length; s++) {
    var sp = worldToScreen(wall.symbols[s].x, wall.symbols[s].y);

    var turned = wall.symbols[s].rotation === 90 || wall.symbols[s].rotation === 270;
    var k = symbolScale();
    var halfX = (turned ? 12 : 21) * k;
    var halfY = (turned ? 21 : 12) * k;
    var isDouble = wall.symbols[s].type === 'socket2' && Math.abs(sx - sp.x) <= halfX && Math.abs(sy - sp.y) <= halfY;

    if (dist(sx, sy, sp.x, sp.y) <= 14 * k || isDouble) {
      return { kind: 'symbol', id: wall.symbols[s].id };
    }
  }

  for (var c = 0; c < wall.cables.length; c++) {
    var cable = wall.cables[c];

    for (var i = 1; i < cable.points.length; i++) {
      var pa = worldToScreen(cable.points[i - 1].x, cable.points[i - 1].y);
      var pb = worldToScreen(cable.points[i].x, cable.points[i].y);

      if (distToSegment(sx, sy, pa.x, pa.y, pb.x, pb.y) <= 6) {
        return { kind: 'cable', id: cable.id };
      }
    }
  }

  var w = screenToWorld(sx, sy);

  for (var o = 0; o < wall.openings.length; o++) {
    var op = wall.openings[o];

    if (w.x >= op.x && w.x <= op.x + op.w && w.y >= op.y && w.y <= op.y + op.h) {
      return { kind: 'opening', id: op.id };
    }
  }

  return null;
}

// Cables of different circuits never connect; a junction box also belongs to one circuit (STN 33 2000-5-52).
function connectionAllowed(restrict, currentCircuit, otherCircuit) {
  if (!restrict) {
    return true;
  }

  return !(currentCircuit && otherCircuit && currentCircuit !== otherCircuit);
}
function snapWallPoint(sx, sy, fromPoint, excludeCableId) {
  var wall = getActiveSurface();
  var limits = getSurfaceLimits();
  ui.guide = { x: null, y: null };

  if (fromPoint && ui.shift) {
    var locked = snapRightAngle(sx, sy, fromPoint);
    return { x: clamp(locked.x, limits.minX, limits.maxX), y: clamp(locked.y, limits.minY, limits.maxY) };
  }

  var candidates = [];
  var restrictCircuit = false;
  var snapCircuit = null;

  if (excludeCableId !== undefined && excludeCableId !== null) {
    var own = findItem(wall, { kind: 'cable', id: excludeCableId });
    snapCircuit = own ? (own.circuitId || null) : null;
    restrictCircuit = true;
  } else if (isCableTool(ui.tool)) {
    snapCircuit = resolveCableTool(ui.tool).circuitId || null;
    restrictCircuit = true;
  }

  if (ui.mode === 'ceiling') {
    for (var n = 0; n < state.nodes.length; n++) {
      candidates.push({ x: state.nodes[n].x, y: state.nodes[n].y });
    }

    var upStubs = wallStubsOnCeiling();

    for (var u = 0; u < upStubs.length; u++) {
      candidates.push({ x: upStubs[u].x, y: upStubs[u].y, r: 14 });
    }
  }

  for (var s = 0; s < wall.symbols.length; s++) {
    if (connectionAllowed(restrictCircuit, snapCircuit, wall.symbols[s].circuitId)) {
      candidates.push({ x: wall.symbols[s].x, y: wall.symbols[s].y, r: Math.max(POINT_SNAP_PX, 14 * symbolScale()) });
    }
  }

  for (var c = 0; c < wall.cables.length; c++) {
    if (wall.cables[c].id === excludeCableId || !connectionAllowed(restrictCircuit, snapCircuit, wall.cables[c].circuitId)) {
      continue;
    }

    for (var i = 0; i < wall.cables[c].points.length; i++) {
      candidates.push(wall.cables[c].points[i]);
    }
  }

  var sidePassages = getSidePassages();

  for (var sp = 0; sp < sidePassages.length; sp++) {
    candidates.push({ x: sidePassages[sp].x, y: sidePassages[sp].y, r: Math.max(POINT_SNAP_PX, 12 * symbolScale()) });
  }

  if (ui.mode === 'wall') {
    var stubs = getCableStubs(wall);

    for (var st = 0; st < stubs.length; st++) {
      if (connectionAllowed(restrictCircuit, snapCircuit, stubs[st].cable.circuitId)) {
        candidates.push({ x: stubs[st].x, y: stubs[st].y, r: 14 });
      }
    }
  }

  for (var k = 0; k < candidates.length; k++) {
    var cp = worldToScreen(candidates[k].x, candidates[k].y);

    if (dist(sx, sy, cp.x, cp.y) <= (candidates[k].r || POINT_SNAP_PX)) {
      return { x: candidates[k].x, y: candidates[k].y };
    }
  }

  var w = screenToWorld(sx, sy);
  var x = snapValue(w.x, GRID_CM);
  var y = snapValue(w.y, GRID_CM);

  if (fromPoint) {
    var from = worldToScreen(fromPoint.x, fromPoint.y);

    if (Math.abs(sx - from.x) < ORTHO_PX) {
      x = fromPoint.x;
    }

    if (Math.abs(sy - from.y) < ORTHO_PX) {
      y = fromPoint.y;
    }
  }

  var aligned = alignToPoints(x, y, sx, sy, candidates, null);

  if (ui.mode === 'wall') {
    if (Math.abs(sx - worldToScreen(0, 0).x) <= POINT_SNAP_PX) {
      aligned.x = 0;
    }

    if (Math.abs(sx - worldToScreen(limits.maxX, 0).x) <= POINT_SNAP_PX) {
      aligned.x = limits.maxX;
    }

    var joins = wallJoins(getActiveWall(), ui.activeSide === 'back' ? -1 : 1);

    for (var j = 0; j < joins.length; j++) {
      // Corner walls are skipped: there the cable goes to the wall edge.
      if (joins[j].x < 1 || joins[j].x > limits.maxX - 1) {
        continue;
      }

      var edges = [joins[j].x - joins[j].w / 2, joins[j].x + joins[j].w / 2];

      for (var ed = 0; ed < 2; ed++) {
        if (Math.abs(sx - worldToScreen(edges[ed], 0).x) <= POINT_SNAP_PX) {
          aligned.x = edges[ed];
        }
      }
    }
  }

  var result = { x: clamp(aligned.x, limits.minX, limits.maxX), y: clamp(aligned.y, limits.minY, limits.maxY) };

  if (fromPoint && ui.mode === 'wall') {
    result.x = stopAtJoins(fromPoint.x, result.x);
  }

  if (fromPoint && ui.mode === 'ceiling') {
    result = stopAtWallFace(fromPoint, result);
  }

  return result;
}

// Wall faces as lines in plan coordinates: wall, side, start point, direction, normal and length.
function wallFaceLines() {
  var lines = [];

  for (var i = 0; i < state.walls.length; i++) {
    var wall = state.walls[i];
    var a = getNode(wall.a);
    var b = getNode(wall.b);
    var length = dist(a.x, a.y, b.x, b.y);

    if (length < 1) {
      continue;
    }

    var ux = (b.x - a.x) / length;
    var uy = (b.y - a.y) / length;
    var half = (wall.thickness || 10) / 2;

    for (var s = 0; s < 2; s++) {
      var sign = s === 0 ? 1 : -1;
      var nx = sign * -uy;
      var ny = sign * ux;
      lines.push({ wall: wall, side: s === 0 ? 'front' : 'back', x: a.x + nx * half, y: a.y + ny * half, ux: ux, uy: uy, nx: nx, ny: ny, length: length });
    }
  }

  return lines;
}

// A ceiling cable cannot pass over a wall: the segment ends on the first wall face it meets.
function stopAtWallFace(from, to) {
  var dx = to.x - from.x;
  var dy = to.y - from.y;
  var best = 1;
  var lines = wallFaceLines();

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var startSide = (from.x - line.x) * line.nx + (from.y - line.y) * line.ny;
    var endSide = (to.x - line.x) * line.nx + (to.y - line.y) * line.ny;

    // Only a face seen from the room side, crossed from the room into the wall.
    if (startSide < 0.01 || endSide >= 0) {
      continue;
    }

    var t = startSide / (startSide - endSide);
    var hitX = from.x + dx * t;
    var hitY = from.y + dy * t;
    var along = (hitX - line.x) * line.ux + (hitY - line.y) * line.uy;

    if (along >= -0.5 && along <= line.length + 0.5 && t < best) {
      best = t;
    }
  }

  return { x: roundTo(from.x + dx * best, 1), y: roundTo(from.y + dy * best, 1) };
}

// A cable cannot pass through a partition wall: it stops at the near edge of its strip.
function stopAtJoins(fromX, toX) {
  var joins = wallJoins(getActiveWall(), ui.activeSide === 'back' ? -1 : 1);

  var length = wallLength(getActiveWall());

  for (var i = 0; i < joins.length; i++) {
    // Walls in the corners do not stop the cable; it runs to the edge and continues on the next wall.
    if (joins[i].x < 1 || joins[i].x > length - 1) {
      continue;
    }

    var left = joins[i].x - joins[i].w / 2;
    var right = joins[i].x + joins[i].w / 2;

    if (fromX <= left + 0.01 && toX > left) {
      toX = left;
    } else if (fromX >= right - 0.01 && toX < right) {
      toX = right;
    }
  }

  return toX;
}

function isCableTool(tool) {
  return getCableTypeStrict(tool) !== null || getCircuitFromTool(tool) !== null;
}

function isSymbolTool(tool) {
  for (var i = 0; i < SYMBOL_TYPES.length; i++) {
    if (SYMBOL_TYPES[i].id === tool) {
      return true;
    }
  }

  return false;
}

// ---------- Wall interaction ----------

// A cable end that continues on the neighbouring wall is moved together with the other wall's cable end.
function linkCableEnd(face, drag) {
  var cable = findItem(face, { kind: 'cable', id: drag.id });
  var index = drag.index;

  if (ui.mode !== 'wall' || !cable || (index !== 0 && index !== cable.points.length - 1)) {
    return;
  }

  var point = cable.points[index];
  var stubs = getCableStubs(face);
  var links = [];

  for (var i = 0; i < stubs.length; i++) {
    if (!stubs[i].inPassage && stubs[i].endIndex !== undefined && Math.abs(stubs[i].x - point.x) < 0.5 && Math.abs(stubs[i].y - point.y) < 0.5) {
      links.push({ list: [{ cable: stubs[i].cable, index: stubs[i].endIndex }], anchor: stubs[i].anchor });
    }
  }

  if (links.length > 0) {
    drag.links = links;
    drag.own = [{ cable: cable, index: index }];
    drag.edgeX = point.x;
  }
}

// Moves a linked cable end up or down along the wall edge; both cables keep their runs straight.
function moveLinkedCableEnd(cable, p) {
  var drag = ui.dragging;
  var point = cable.points[drag.own[0].index];
  var targetY = clamp(snapValue(screenToWorld(p.x, p.y).y, GRID_CM), 0, state.wallHeight);
  var dy = targetY - point.y;

  if (Math.abs(dy) < 0.01) {
    return;
  }

  moveAttached(drag.own, 0, dy);

  for (var i = 0; i < drag.links.length; i++) {
    moveAttached(drag.links[i].list, 0, dy, drag.links[i].anchor);
  }

  drag.index = drag.own[0].index;
  drag.moved = true;
  render();
}

// Clicking the end of a cable coming from the neighbouring wall continues that cable here.
function continueStubAt(p) {
  var stub = findStubAt(p);

  if (!stub) {
    return false;
  }

  startStubCable(stub);
  return true;
}

// The cable end from the neighbouring wall under the mouse, if any.
function findStubAt(p) {
  if (ui.drawing || (ui.mode !== 'wall' && ui.mode !== 'ceiling') || (ui.tool !== 'select' && !isCableTool(ui.tool))) {
    return null;
  }

  var stubs = ui.mode === 'ceiling' ? wallStubsOnCeiling() : getCableStubs(getActiveSurface());

  for (var i = 0; i < stubs.length; i++) {
    var edge = worldToScreen(stubs[i].x, stubs[i].y);

    if (dist(p.x, p.y, edge.x, edge.y) <= 12) {
      return stubs[i];
    }
  }

  return null;
}

// Starts drawing a cable from the stub in the same circuit.
function startStubCable(stub) {
  var cable = stub.cable;
  setTool(getCircuit(cable.circuitId) ? 'use:' + cable.circuitId : cable.typeId);
  ui.drawing = { kind: 'cable', typeId: cable.typeId, circuitId: cable.circuitId, points: [{ x: stub.x, y: stub.y }] };
  render();
}

// Pressing a stub: a click continues the cable, dragging moves the cable end up or down on both walls.
function pressStubAt(p) {
  var stub = findStubAt(p);

  if (!stub) {
    return false;
  }

  ui.dragging = { kind: 'stub', stub: stub, startX: p.x, startY: p.y, y: stub.y, moved: false };
  return true;
}

// Moves the end of the neighbouring wall's cable together with its stub.
function moveStub(p) {
  var drag = ui.dragging;

  if (!drag.moved && dist(p.x, p.y, drag.startX, drag.startY) < 4) {
    return;
  }

  drag.moved = true;

  if (drag.stub.inPassage || drag.stub.endIndex === undefined) {
    return;
  }

  var targetY = clamp(snapValue(screenToWorld(p.x, p.y).y, GRID_CM), 0, state.wallHeight);
  var dy = targetY - drag.y;

  if (Math.abs(dy) < 0.01) {
    return;
  }

  if (!drag.list) {
    drag.list = [{ cable: drag.stub.cable, index: drag.stub.endIndex }];
  }

  moveAttached(drag.list, 0, dy, drag.stub.anchor);
  drag.y = targetY;
  render();
}

function wallPointerDown(p) {
  var wall = getActiveSurface();

  if (ui.tool !== 'select' && continueStubAt(p)) {
    return;
  }

  if (ui.tool === 'select') {
    var openingHandle = findOpeningHandle(wall, p.x, p.y);

    if (openingHandle) {
      var op = findItem(wall, ui.selected);
      ui.dragging = { kind: 'openingResize', id: ui.selected.id, handle: openingHandle, left: op.x, right: op.x + op.w, bottom: op.y, top: op.y + op.h, moved: false };
      return;
    }

    var handle = findCableHandle(wall, p.x, p.y);

    if (handle) {
      ui.dragging = { kind: 'cablePoint', id: handle.cableId, index: handle.index, moved: false };
      linkCableEnd(wall, ui.dragging);
      return;
    }

    if (pressStubAt(p)) {
      return;
    }

    var hit = hitTestWall(wall, p.x, p.y);
    ui.selected = hit;

    if (!hit) {
      ui.dragging = { kind: 'pan', lastX: p.x, lastY: p.y };
    }

    if (hit && hit.kind !== 'cable') {
      var item = findItem(wall, hit);
      var w = screenToWorld(p.x, p.y);
      var shownX = hit.kind === 'passage' && ui.activeSide === 'back' ? wallLength(getActiveWall()) - item.x : item.x;
      ui.dragging = { kind: hit.kind, id: hit.id, dx: shownX - w.x, dy: item.y - w.y, moved: false };

      if (hit.kind === 'symbol') {
        ui.dragging.attached = collectAttached(wall.cables, item.x, item.y);
      } else if (hit.kind === 'passage') {
        var host = getActiveWall();
        ui.dragging.attached = collectAttached(host.cables, item.x, item.y);
        ui.dragging.attachedBack = host.back ? collectAttached(host.back.cables, wallLength(host) - item.x, item.y) : [];
      }
    }

    renderSidebar();
    return;
  }

  if (isOpeningTool(ui.tool) || ui.tool === 'beam') {
    var start = snapWallPoint(p.x, p.y, null);
    ui.drawing = { kind: 'opening', solid: ui.tool === 'beam', openingKind: OPENING_TOOLS[ui.tool], x0: start.x, y0: start.y, x1: start.x, y1: start.y };
    return;
  }

  if (isSymbolTool(ui.tool)) {
    var spot = snapWallPoint(p.x, p.y, null);

    if (ui.tool === 'passage' && ui.mode === 'wall') {
      var host = getActiveWall();
      host.passages = host.passages || [];
      host.passages.push({ id: newId(), x: ui.activeSide === 'back' ? wallLength(host) - spot.x : spot.x, y: spot.y });
      markChanged();
      finishTool();
      return;
    }

    var placedSymbol = { id: newId(), type: ui.tool, x: spot.x, y: spot.y, circuitId: ui.activeCircuitId };

    // A double socket is placed standing (vertical) by default.
    if (ui.tool === 'socket2') {
      placedSymbol.rotation = 90;
    }

    placedSymbol.circuitId = attachedCircuitId(placedSymbol);
    wall.symbols.push(placedSymbol);
    markChanged();
    finishTool();
    return;
  }

  if (isCableTool(ui.tool)) {
    wallCableClick(p);
  }
}

function wallCableClick(p) {
  if (!ui.drawing) {
    var first = snapWallPoint(p.x, p.y, null);
    var resolved = resolveCableTool(ui.tool);
    ui.drawing = { kind: 'cable', typeId: resolved.typeId, circuitId: resolved.circuitId, points: [first] };
    return;
  }

  var last = ui.drawing.points[ui.drawing.points.length - 1];
  var next = snapWallPoint(p.x, p.y, last);

  if (dist(next.x, next.y, last.x, last.y) < 1) {
    return;
  }

  ui.drawing.points.push(next);
}

function wallPointerMove(p) {
  var wall = getActiveSurface();

  if (ui.dragging && ui.dragging.kind === 'stub') {
    moveStub(p);
    return;
  }

  if (ui.dragging && ui.dragging.kind === 'openingResize') {
    resizeOpening(findItem(wall, { kind: 'opening', id: ui.dragging.id }), ui.dragging, screenToWorld(p.x, p.y));
    ui.dragging.moved = true;
    renderSidebar();
    return;
  }

  if (ui.dragging && ui.dragging.kind === 'cablePoint') {
    var cable = findItem(wall, { kind: 'cable', id: ui.dragging.id });

    if (ui.dragging.links) {
      moveLinkedCableEnd(cable, p);
      return;
    }

    var index = ui.dragging.index;
    var neighbor = cable.points[index > 0 ? index - 1 : index + 1];
    cable.points[index] = snapWallPoint(p.x, p.y, neighbor, cable.id);
    ui.dragging.moved = true;
    renderSidebar();
    return;
  }

  if (ui.dragging) {
    var item = findItem(wall, ui.dragging);
    var w = screenToWorld(p.x, p.y);
    var limits = getSurfaceLimits();
    var oldX = item.x;
    var oldY = item.y;

    if (ui.dragging.kind === 'passage') {
      var movedX = clamp(snapValue(w.x + ui.dragging.dx, GRID_CM), limits.minX, limits.maxX);
      item.x = ui.activeSide === 'back' ? limits.maxX - movedX : movedX;
      item.y = clamp(snapValue(w.y + ui.dragging.dy, GRID_CM), limits.minY, limits.maxY);
    } else if (ui.dragging.kind === 'symbol') {
      item.x = clamp(snapValue(w.x + ui.dragging.dx, GRID_CM), limits.minX, limits.maxX);
      item.y = clamp(snapValue(w.y + ui.dragging.dy, GRID_CM), limits.minY, limits.maxY);
    } else {
      item.x = clamp(snapValue(w.x + ui.dragging.dx, GRID_CM), limits.minX, Math.max(limits.minX, limits.maxX - item.w));
      item.y = clamp(snapValue(w.y + ui.dragging.dy, GRID_CM), limits.minY, Math.max(limits.minY, limits.maxY - item.h));
    }

    if (ui.dragging.attached) {
      moveAttached(ui.dragging.attached, item.x - oldX, item.y - oldY);
    }

    if (ui.dragging.attachedBack) {
      moveAttached(ui.dragging.attachedBack, oldX - item.x, item.y - oldY);
    }

    ui.dragging.moved = true;
    renderSidebar();
    return;
  }

  if (ui.drawing && ui.drawing.kind === 'opening') {
    var corner = snapWallPoint(p.x, p.y, null);
    ui.drawing.x1 = corner.x;
    ui.drawing.y1 = corner.y;
    return;
  }

  if (isCableTool(ui.tool)) {
    var from = ui.drawing ? ui.drawing.points[ui.drawing.points.length - 1] : null;
    ui.preview = snapWallPoint(p.x, p.y, from);
    return;
  }

  if (isSymbolTool(ui.tool)) {
    ui.preview = snapWallPoint(p.x, p.y, null);
  }
}

function wallPointerUp() {
  if (ui.dragging && ui.dragging.kind === 'stub' && !ui.dragging.moved) {
    var pressed = ui.dragging.stub;
    ui.dragging = null;
    startStubCable(pressed);
    return;
  }

  if (ui.dragging) {
    if (ui.dragging.moved) {
      markChanged();
    }

    ui.dragging = null;
    return;
  }

  if (ui.drawing && ui.drawing.kind === 'opening') {
    var d = ui.drawing;
    var width = Math.abs(d.x1 - d.x0);
    var height = Math.abs(d.y1 - d.y0);

    if (width >= 5 && height >= 5) {
      var created = { id: newId(), x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: width, h: height, solid: d.solid === true };

      if (d.openingKind) {
        created.kind = d.openingKind;
      }

      getActiveSurface().openings.push(created);
      markChanged();
      ui.drawing = null;
      finishTool();
      ui.selected = { kind: 'opening', id: created.id };
      renderSidebar();
      return;
    }

    ui.drawing = null;
  }
}

// ---------- Common interaction ----------

// Cable points that lie on a position, e.g. cable ends in a socket.
function collectAttached(cables, x, y) {
  var list = [];

  for (var c = 0; c < cables.length; c++) {
    for (var i = 0; i < cables[c].points.length; i++) {
      if (dist(cables[c].points[i].x, cables[c].points[i].y, x, y) < 0.5) {
        list.push({ cable: cables[c], index: i });
      }
    }
  }

  return list;
}

function isAttachedPoint(list, cable, index) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].cable === cable && list[i].index === index) {
      return true;
    }
  }

  return false;
}

// Moves attached cable points; the neighbour of a vertical or horizontal segment follows so the right angle stays.
function moveAttached(list, dx, dy, anchorTest) {
  for (var k = 0; k < list.length; k++) {
    var points = list[k].cable.points;
    var index = list[k].index;
    var point = points[index];
    var neighbours = [index - 1, index + 1];

    for (var n = 0; n < neighbours.length; n++) {
      var other = points[neighbours[n]];

      if (!other || isAttachedPoint(list, list[k].cable, neighbours[n])) {
        continue;
      }

      var vertical = Math.abs(other.x - point.x) < 0.01 && Math.abs(other.y - point.y) >= 0.01;
      var horizontal = Math.abs(other.y - point.y) < 0.01 && Math.abs(other.x - point.x) >= 0.01;

      // A neighbour held by a wall edge, passage or symbol stays; a bend keeps the right angle instead.
      if (((vertical && dx !== 0) || (horizontal && dy !== 0)) && (anchorTest ? anchorTest(other) : isAnchoredPoint(other))) {
        var elbow = vertical ? { x: other.x, y: point.y } : { x: point.x, y: other.y };
        var at = neighbours[n] < index ? index : index + 1;
        points.splice(at, 0, elbow);
        shiftAttached(list, list[k].cable, at);
        index = list[k].index;
        neighbours = [index - 1, index + 1];
        continue;
      }

      if (vertical) {
        other.x += dx;
      } else if (horizontal) {
        other.y += dy;
      }
    }

    point.x += dx;
    point.y += dy;
  }
}

// Anchor test for a face that is not open: its wall edges and its symbols hold cable points.
function faceAnchor(symbols, length) {
  return function (p) {
    if (p.x < 0.5 || p.x > length - 0.5) {
      return true;
    }

    for (var i = 0; i < symbols.length; i++) {
      if (dist(p.x, p.y, symbols[i].x, symbols[i].y) < 0.5) {
        return true;
      }
    }

    return false;
  };
}

// After a point is inserted into a cable, attached indices behind it move by one.
function shiftAttached(list, cable, at) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].cable === cable && list[i].index >= at) {
      list[i].index++;
    }
  }
}

// A cable point that must not move with a dragged item: wall edge, passage or symbol.
function isAnchoredPoint(p) {
  if (ui.mode === 'wall') {
    var length = wallLength(getActiveWall());

    if (p.x < 0.5 || p.x > length - 0.5) {
      return true;
    }

    var passages = getSidePassages();

    for (var i = 0; i < passages.length; i++) {
      if (dist(p.x, p.y, passages[i].x, passages[i].y) < 0.5) {
        return true;
      }
    }
  }

  var symbols = getActiveSurface().symbols;

  for (var s = 0; s < symbols.length; s++) {
    if (dist(p.x, p.y, symbols[s].x, symbols[s].y) < 0.5) {
      return true;
    }
  }

  return false;
}

// Moves a symbol of the active surface together with the cable ends in it.
function moveSymbolTo(item, x, y) {
  var attached = collectAttached(getActiveSurface().cables, item.x, item.y);
  var dx = x - item.x;
  var dy = y - item.y;
  item.x = x;
  item.y = y;
  moveAttached(attached, dx, dy);
}

// Circuit of a symbol: its own one, otherwise the circuit of a cable ending in it on the shown surface.
function attachedCircuitId(symbol) {
  if (symbol.circuitId) {
    return symbol.circuitId;
  }

  if (ui.mode === 'plan') {
    return null;
  }

  var cables = getActiveSurface().cables;

  for (var c = 0; c < cables.length; c++) {
    var points = cables[c].points;
    var ends = [points[0], points[points.length - 1]];

    for (var e = 0; e < ends.length; e++) {
      if (cables[c].circuitId && dist(ends[e].x, ends[e].y, symbol.x, symbol.y) < 0.5) {
        return cables[c].circuitId;
      }
    }
  }

  return null;
}

// A symbol without a circuit takes the circuit of the cable that ends in it.
function claimSymbolsAtEnds(surface, points, circuitId) {
  if (!circuitId) {
    return;
  }

  var ends = [points[0], points[points.length - 1]];

  for (var s = 0; s < surface.symbols.length; s++) {
    var symbol = surface.symbols[s];

    for (var e = 0; e < ends.length; e++) {
      if (!symbol.circuitId && dist(symbol.x, symbol.y, ends[e].x, ends[e].y) < 0.5) {
        symbol.circuitId = circuitId;
      }
    }
  }
}
function finishDrawing() {
  if (ui.drawing && ui.drawing.kind === 'cable' && ui.drawing.points.length >= 2) {
    getActiveSurface().cables.push({ id: newId(), typeId: ui.drawing.typeId, points: ui.drawing.points, circuitId: ui.drawing.circuitId });
    claimSymbolsAtEnds(getActiveSurface(), ui.drawing.points, ui.drawing.circuitId);
    markChanged();
  }

  cancelDrawing();
  finishTool();
}

function cancelDrawing() {
  ui.drawing = null;
  ui.preview = null;
  ui.guide = { x: null, y: null };
  cleanupOrphanNodes();
}

function deleteSelected() {
  if (ui.multi.length > 0) {
    deleteMultiple();
    return;
  }

  if (!ui.selected) {
    return;
  }

  if (ui.mode === 'plan' && ui.selected.kind === 'wall') {
    deleteWall(ui.selected.id);
  } else if (ui.mode !== 'plan') {
    removeItem(getActiveSurface(), ui.selected);
  }

  ui.selected = null;
  markChanged();
  renderSidebar();
  render();
}

// ---------- Selecting several items with the right mouse button ----------

// True when the item is the selected one or part of the multiple selection.
function isItemSelected(kind, id) {
  if (ui.selected && ui.selected.kind === kind && ui.selected.id === id) {
    return true;
  }

  for (var i = 0; i < ui.multi.length; i++) {
    if (ui.multi[i].kind === kind && ui.multi[i].id === id) {
      return true;
    }
  }

  return false;
}

function pointInRect(x, y, r) {
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  var d1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  var d2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
  var d3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
  var d4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}

function segmentHitsRect(ax, ay, bx, by, r) {
  if (pointInRect(ax, ay, r) || pointInRect(bx, by, r)) {
    return true;
  }

  return segmentsIntersect(ax, ay, bx, by, r.left, r.top, r.right, r.top) ||
    segmentsIntersect(ax, ay, bx, by, r.right, r.top, r.right, r.bottom) ||
    segmentsIntersect(ax, ay, bx, by, r.right, r.bottom, r.left, r.bottom) ||
    segmentsIntersect(ax, ay, bx, by, r.left, r.bottom, r.left, r.top);
}

// Finds the walls, or the symbols, cables and openings, touched by the screen rectangle.
function collectInRect(r) {
  var found = [];

  if (ui.mode === 'plan') {
    for (var w = 0; w < state.walls.length; w++) {
      var a = worldToScreen(getNode(state.walls[w].a).x, getNode(state.walls[w].a).y);
      var b = worldToScreen(getNode(state.walls[w].b).x, getNode(state.walls[w].b).y);

      if (segmentHitsRect(a.x, a.y, b.x, b.y, r)) {
        found.push({ kind: 'wall', id: state.walls[w].id });
      }
    }

    return found;
  }

  var surface = getActiveSurface();

  for (var s = 0; s < surface.symbols.length; s++) {
    var sp = worldToScreen(surface.symbols[s].x, surface.symbols[s].y);

    if (pointInRect(sp.x, sp.y, r)) {
      found.push({ kind: 'symbol', id: surface.symbols[s].id });
    }
  }

  for (var c = 0; c < surface.cables.length; c++) {
    var points = surface.cables[c].points;

    for (var i = 1; i < points.length; i++) {
      var pa = worldToScreen(points[i - 1].x, points[i - 1].y);
      var pb = worldToScreen(points[i].x, points[i].y);

      if (segmentHitsRect(pa.x, pa.y, pb.x, pb.y, r)) {
        found.push({ kind: 'cable', id: surface.cables[c].id });
        break;
      }
    }
  }

  for (var o = 0; o < surface.openings.length; o++) {
    var op = surface.openings[o];
    var tl = worldToScreen(op.x, op.y + op.h);
    var br = worldToScreen(op.x + op.w, op.y);

    if (tl.x <= r.right && br.x >= r.left && tl.y <= r.bottom && br.y >= r.top) {
      found.push({ kind: 'opening', id: op.id });
    }
  }

  return found;
}

function finishMarquee() {
  var m = ui.marquee;
  ui.marquee = null;

  if (m.moved) {
    ui.suppressContext = true;
    ui.selected = null;
    ui.multi = collectInRect({ left: Math.min(m.x0, m.x1), right: Math.max(m.x0, m.x1), top: Math.min(m.y0, m.y1), bottom: Math.max(m.y0, m.y1) });
    renderSidebar();
  }

  render();
}

function renderMarquee() {
  if (!ui.marquee || !ui.marquee.moved) {
    return;
  }

  var m = ui.marquee;
  ctx.fillStyle = 'rgba(232, 89, 12, 0.12)';
  ctx.strokeStyle = COLORS.accent;
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 3]);
  ctx.fillRect(Math.min(m.x0, m.x1), Math.min(m.y0, m.y1), Math.abs(m.x1 - m.x0), Math.abs(m.y1 - m.y0));
  ctx.strokeRect(Math.min(m.x0, m.x1), Math.min(m.y0, m.y1), Math.abs(m.x1 - m.x0), Math.abs(m.y1 - m.y0));
  ctx.setLineDash([]);
}

function deleteMultiple() {
  var surface = ui.mode === 'plan' ? null : getActiveSurface();

  for (var i = 0; i < ui.multi.length; i++) {
    if (ui.multi[i].kind === 'wall') {
      deleteWall(ui.multi[i].id);
    } else {
      removeItem(surface, ui.multi[i]);
    }
  }

  ui.multi = [];
  markChanged();
  renderSidebar();
  render();
}

// Turns the selected symbol by 90 degrees.
function rotateSelected() {
  if (ui.mode === 'plan' || !ui.selected || ui.selected.kind !== 'symbol') {
    return;
  }

  var symbol = findItem(getActiveSurface(), ui.selected);

  if (!symbol) {
    return;
  }

  symbol.rotation = ((symbol.rotation || 0) + 90) % 360;
  markChanged();
  render();
}

function openWall(wallId, side) {
  cancelDrawing();
  cameras.wall = null;
  ui.mode = 'wall';
  ui.activeWallId = wallId;
  ui.activeSide = side === 'back' ? 'back' : 'front';
  ui.tool = 'select';
  ui.selected = null;
  refreshAll();
}

function openCeiling() {
  cancelDrawing();
  cameras.ceiling = null;
  ui.mode = 'ceiling';
  ui.activeWallId = null;
  ui.tool = 'select';
  ui.selected = null;
  refreshAll();
}

function backToPlan() {
  cancelDrawing();
  ui.activeSide = 'front';
  ui.mode = 'plan';
  ui.activeWallId = null;
  ui.tool = 'select';
  ui.selected = null;
  refreshAll();
}

// Switches back to the select tool unless the user wants to keep the current tool.
function finishTool() {
  if (!elements.keepTool.checked) {
    setTool('select');
  }
}

function setTool(tool) {
  cancelDrawing();
  ui.tool = tool;
  ui.selected = null;
  ui.multi = [];
  updateToolbarActive();
  renderSidebar();
  render();
}

function getPointer(event) {
  var rect = canvas.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

function onPointerDown(event) {
  ui.suppressContext = false;
  var isMiddle = event.button === 1;
  var isRight = event.button === 2 && !ui.drawing;

  if (event.button !== 0 && !isMiddle && !isRight) {
    return;
  }

  try {
    canvas.setPointerCapture(event.pointerId);
  } catch (error) {
    // Pointer capture is optional.
  }

  var p = getPointer(event);
  ui.shift = event.shiftKey;
  ui.lastPointer = p;

  if (isRight) {
    ui.marquee = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, moved: false };
    return;
  }

  if (isMiddle) {
    event.preventDefault();
    ui.dragging = { kind: 'pan', lastX: p.x, lastY: p.y };
    return;
  }

  if (ui.multi.length > 0) {
    ui.multi = [];
    renderSidebar();
  }

  if (ui.mode === 'plan') {
    planPointerDown(p);
  } else {
    wallPointerDown(p);
  }

  render();
}

function onPointerMove(event) {
  var p = getPointer(event);
  ui.shift = event.shiftKey;
  ui.lastPointer = p;

  if (ui.marquee) {
    ui.marquee.x1 = p.x;
    ui.marquee.y1 = p.y;

    if (dist(ui.marquee.x0, ui.marquee.y0, p.x, p.y) > 4) {
      ui.marquee.moved = true;
    }

    render();
    return;
  }

  if (ui.dragging && ui.dragging.kind === 'pan') {
    cameras[ui.mode] = { scale: view.scale, ox: view.ox + p.x - ui.dragging.lastX, oy: view.oy + p.y - ui.dragging.lastY };
    ui.dragging.lastX = p.x;
    ui.dragging.lastY = p.y;
    render();
    return;
  }

  if (ui.mode === 'plan') {
    planPointerMove(p);
  } else {
    wallPointerMove(p);
  }

  render();
}

function onPointerUp() {
  if (ui.marquee) {
    finishMarquee();
    return;
  }

  if (ui.mode === 'plan') {
    planPointerUp();
  } else {
    wallPointerUp();
  }

  ui.dragging = null;
  render();
}

// The front side is seen from the left of the direction a -> b in the plan (y grows downwards).
function sideOfWall(wall, point) {
  var a = getNode(wall.a);
  var b = getNode(wall.b);
  var cross = (b.x - a.x) * (point.y - a.y) - (b.y - a.y) * (point.x - a.x);
  return cross >= 0 ? 'front' : 'back';
}

function onDoubleClick(event) {
  if (ui.drawing) {
    finishDrawing();
    render();
    return;
  }

  if (ui.mode === 'plan' && ui.tool === 'select') {
    var p = getPointer(event);
    var wall = findWallNear(p.x, p.y);

    if (wall) {
      openWall(wall.id, sideOfWall(wall, screenToWorld(p.x, p.y)));
    }
  }
}

function onContextMenu(event) {
  event.preventDefault();

  if (ui.suppressContext) {
    ui.suppressContext = false;
    return;
  }

  if (ui.drawing) {
    finishDrawing();
    render();
  }
}

// Redraws the preview at the last mouse position after Shift was pressed or released.
function onShiftChanged(pressed) {
  ui.shift = pressed;

  if (!ui.lastPointer || ui.dragging) {
    return;
  }

  if (ui.mode === 'plan') {
    planPointerMove(ui.lastPointer);
  } else {
    wallPointerMove(ui.lastPointer);
  }

  render();
}

function onKeyUp(event) {
  if (event.key === 'Shift') {
    onShiftChanged(false);
  }
}

function onKeyDown(event) {
  var inField = event.target.tagName === 'INPUT';

  if (event.key === 'Shift' && !event.repeat) {
    onShiftChanged(true);
    return;
  }

  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
    event.preventDefault();
    saveNow();
    return;
  }

  if (event.key === 'Escape') {
    if (ui.multi.length > 0) {
      ui.multi = [];
      renderSidebar();
    }

    if (ui.drawing) {
      cancelDrawing();
    } else if (ui.tool !== 'select') {
      setTool('select');
    }

    render();
    return;
  }

  if (inField) {
    return;
  }

  var withCtrl = event.ctrlKey || event.metaKey;
  var key = event.key.toLowerCase();

  if (withCtrl && key === 'z') {
    event.preventDefault();

    if (event.shiftKey) {
      redo();
    } else {
      undo();
    }

    return;
  }

  if (withCtrl && key === 'y') {
    event.preventDefault();
    redo();
    return;
  }

  if (event.key === 'Delete' || event.key === 'Backspace') {
    deleteSelected();
  }

  if (event.key === 'r' || event.key === 'R') {
    rotateSelected();
  }
}

// ---------- Rendering ----------

// ---------- 3D view ----------

var three = { renderer: null, scene: null, camera: null, content: null, materials: {}, target: null, radius: 1000, theta: 0, phi: 1, drag: null, box: null };

function open3d() {
  if (!window.THREE) {
    setStatus(TEXTS.threeMissing);
    return;
  }

  cancelDrawing();
  ui.mode = '3d';
  ui.activeWallId = null;
  ui.tool = 'select';
  ui.selected = null;
  init3d();
  build3dScene();
  reset3dCamera();
  refreshAll();
}

function init3d() {
  if (three.renderer) {
    return;
  }

  three.renderer = new THREE.WebGLRenderer({ canvas: elements.canvas3d, antialias: true });
  three.scene = new THREE.Scene();
  three.scene.background = new THREE.Color('#e9edf2');
  three.camera = new THREE.PerspectiveCamera(45, 1, 1, 100000);
  three.scene.add(new THREE.AmbientLight(0xffffff, 0.45));

  // Lights from different sides give each wall direction its own shade, so corners are visible.
  var lights = [[0, 1, 0, 0.6], [1, 0, 0.2, 0.45], [0.2, 0, 1, 0.25], [-1, 0, -0.2, 0.1]];

  for (var i = 0; i < lights.length; i++) {
    var light = new THREE.DirectionalLight(0xffffff, lights[i][3]);
    light.position.set(lights[i][0], lights[i][1], lights[i][2]);
    three.scene.add(light);
  }
  elements.canvas3d.addEventListener('pointerdown', on3dPointerDown);
  elements.canvas3d.addEventListener('pointermove', on3dPointerMove);
  elements.canvas3d.addEventListener('pointerup', on3dPointerUp);
  elements.canvas3d.addEventListener('wheel', on3dWheel, { passive: false });
  elements.label3dInput.addEventListener('keydown', function (event) {
    event.stopPropagation();

    if (event.key === 'Enter') {
      finish3dLabel(true);
    } else if (event.key === 'Escape') {
      finish3dLabel(false);
    }
  });
  elements.label3dInput.addEventListener('blur', function () {
    finish3dLabel(true);
  });
  elements.canvas3d.addEventListener('contextmenu', function (event) { event.preventDefault(); });
}

function material3d(color) {
  if (!three.materials[color]) {
    three.materials[color] = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });
  }

  return three.materials[color];
}

// Light blue see-through material for window glass.
function glassMaterial3d() {
  if (!three.glass) {
    three.glass = new THREE.MeshStandardMaterial({ color: '#9fc6e3', transparent: true, opacity: 0.45, roughness: 0.2 });
  }

  return three.glass;
}

// Parts of a wall around its holes, as rectangles [x0, x1, y0, y1] in wall coordinates.
function wallPieces(length, height, holes) {
  var xs = [0, length];

  for (var i = 0; i < holes.length; i++) {
    xs.push(clamp(holes[i].x, 0, length), clamp(holes[i].x + holes[i].w, 0, length));
  }

  xs = uniqueSorted(xs);
  var pieces = [];

  for (var k = 0; k + 1 < xs.length; k++) {
    var x0 = xs[k];
    var x1 = xs[k + 1];
    var middle = (x0 + x1) / 2;
    var spans = holes.filter(function (hole) { return hole.x < middle && hole.x + hole.w > middle; }).map(function (hole) { return [hole.y, hole.y + hole.h]; }).sort(function (a, b) { return a[0] - b[0]; });
    var y = 0;

    for (var s = 0; s < spans.length; s++) {
      if (spans[s][0] > y) {
        pieces.push([x0, x1, y, spans[s][0]]);
      }

      y = Math.max(y, spans[s][1]);
    }

    if (y < height) {
      pieces.push([x0, x1, y, height]);
    }
  }

  return pieces;
}

function add3dBox(width, height, depth, color, x, y, z, angle) {
  var mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material3d(color));
  mesh.position.set(x, y, z);
  mesh.rotation.y = angle;
  three.content.add(mesh);
  return mesh;
}

// A cable segment as a thin tube with a small ball on its joints.
function add3dTube(p1, p2, color, item) {
  var direction = new THREE.Vector3().subVectors(p2, p1);
  var length = direction.length();

  if (length < 0.01) {
    return;
  }

  // Thickness follows the line width of the cable's circuit (3.5 px = 1.3 cm radius).
  var circuit = item ? getCircuit(item.circuitId) : null;
  var radius = 1.3 * (circuit && circuit.width ? circuit.width : 3.5) / 3.5;
  var tube = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 8), material3d(color));
  tube.position.copy(p1).addScaledVector(direction, 0.5);
  tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  tube.userData.item = item;
  three.content.add(tube);
  var joint = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), material3d(color));
  joint.position.copy(p2);
  three.content.add(joint);
}

// Text shown next to a symbol in 3D: own label, breaker value with circuit, or the symbol name.
function label3d(symbol) {
  if (symbol.label) {
    return symbol.label;
  }

  var circuit = getCircuit(symbol.circuitId);

  if (symbol.type === 'breaker') {
    return [storedRating(symbol), circuit ? circuit.name : ''].filter(Boolean).join(' – ');
  }

  if (symbol.type === 'rcd') {
    return storedRating(symbol);
  }

  return TEXTS[SYMBOL_TYPES[symbolIndex(symbol.type)].textKey];
}

// A text drawn on a small canvas and shown as a sprite of constant screen size that always faces the camera.
function add3dLabel(text, position, color, item) {
  if (!text) {
    return;
  }

  var canvas2d = document.createElement('canvas');
  var context = canvas2d.getContext('2d');
  context.font = '26px Segoe UI, Arial, sans-serif';
  var width = Math.ceil(context.measureText(text).width) + 24;
  canvas2d.width = width;
  canvas2d.height = 44;
  context.font = '26px Segoe UI, Arial, sans-serif';
  context.fillStyle = '#ffffff';
  context.strokeStyle = 'rgba(154, 161, 171, 0.5)';
  context.lineWidth = 2;
  context.beginPath();
  context.moveTo(8, 1);
  context.lineTo(width - 8, 1);
  context.arcTo(width - 1, 1, width - 1, 8, 7);
  context.lineTo(width - 1, 36);
  context.arcTo(width - 1, 43, width - 8, 43, 7);
  context.lineTo(8, 43);
  context.arcTo(1, 43, 1, 36, 7);
  context.lineTo(1, 8);
  context.arcTo(1, 1, 8, 1, 7);
  context.closePath();
  context.fill();
  context.fillStyle = color || '#1f2937';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(text, width / 2, 23);
  var texture = new THREE.CanvasTexture(canvas2d);
  var sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, sizeAttenuation: false, depthTest: false }));
  sprite.renderOrder = 10;
  sprite.center.set(0.5, 0);
  var height = 0.016;
  sprite.scale.set(height * width / 44, height, 1);
  sprite.position.copy(position);
  sprite.userData.item = item;
  three.labels.add(sprite);
}

var SYMBOL_3D = {
  socket: [8, 8, 2, '#ffffff'], socket2: [15, 8, 2, '#ffffff'], switch: [8, 8, 2, '#ffffff'], switch2: [8, 8, 2, '#ffffff'], light: [14, 14, 4, '#ffe58a'],
  board: [30, 40, 9, '#c9cdd4'], breaker: [2, 9, 6, '#ffffff'], rcd: [4, 9, 6, '#ffffff'], box: [8, 8, 3, '#d1d5db']
};

function symbolSize3d(symbol) {
  var size = SYMBOL_3D[symbol.type] || [8, 8, 2, '#f3f4f6'];
  var turned = symbol.rotation === 90 || symbol.rotation === 270;
  return turned ? [size[1], size[0], size[2], size[3]] : size;
}

// Builds walls with their holes, beams, cables and symbols of both sides, and the ceiling wiring.
function build3dScene() {
  if (three.content) {
    three.scene.remove(three.content);
  }

  three.content = new THREE.Group();
  three.scene.add(three.content);
  three.itemInfo = new Map();
  three.refs = new Map();
  three.labels = new THREE.Group();
  three.content.add(three.labels);
  var height = state.wallHeight;
  var minX = Infinity;
  var maxX = -Infinity;
  var minZ = Infinity;
  var maxZ = -Infinity;

  for (var n = 0; n < state.nodes.length; n++) {
    minX = Math.min(minX, state.nodes[n].x);
    maxX = Math.max(maxX, state.nodes[n].x);
    minZ = Math.min(minZ, state.nodes[n].y);
    maxZ = Math.max(maxZ, state.nodes[n].y);
  }

  if (minX === Infinity) {
    minX = 0;
    maxX = 500;
    minZ = 0;
    maxZ = 500;
  }

  three.box = { minX: minX, maxX: maxX, minZ: minZ, maxZ: maxZ };
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(maxX - minX + 300, maxZ - minZ + 300), material3d('#ddd6c8'));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set((minX + maxX) / 2, 0, (minZ + maxZ) / 2);
  three.content.add(floor);

  for (var w = 0; w < state.walls.length; w++) {
    add3dWall(state.walls[w], height);
  }

  add3dCorners(height);

  for (var c = 0; c < state.ceiling.cables.length; c++) {
    var cable = state.ceiling.cables[c];

    for (var i = 1; i < cable.points.length; i++) {
      add3dTube(new THREE.Vector3(cable.points[i - 1].x, height - 2, cable.points[i - 1].y), new THREE.Vector3(cable.points[i].x, height - 2, cable.points[i].y), cableColor(cable), cable);
    }
  }

  for (var s = 0; s < state.ceiling.symbols.length; s++) {
    var symbol = state.ceiling.symbols[s];
    var size = symbolSize3d(symbol);
    add3dBox(size[0], size[2], size[1], size[3], symbol.x, height - size[2] / 2, symbol.y, 0).userData.item = symbol;
    three.refs.set(symbol, { list: state.ceiling.symbols, kind: 'symbol', ceiling: true });
    add3dLabel(label3d(symbol), new THREE.Vector3(symbol.x, height - size[2] - 1, symbol.y), null, symbol);
  }
}

// Fills the corners where walls meet with a post, so no gap shows between them.
function add3dCorners(height) {
  for (var n = 0; n < state.nodes.length; n++) {
    var node = state.nodes[n];
    var thickness = 0;
    var angle = 0;

    for (var w = 0; w < state.walls.length; w++) {
      var wall = state.walls[w];

      if (wall.a !== node.id && wall.b !== node.id) {
        continue;
      }

      if ((wall.thickness || 10) > thickness) {
        thickness = wall.thickness || 10;
        var a = getNode(wall.a);
        var b = getNode(wall.b);
        angle = -Math.atan2(b.y - a.y, b.x - a.x);
      }
    }

    if (thickness > 0) {
      add3dBox(thickness, height, thickness, wallColor(), node.x, height / 2, node.y, angle);
    }
  }
}

function add3dWall(wall, height) {
  var a = getNode(wall.a);
  var b = getNode(wall.b);
  var length = dist(a.x, a.y, b.x, b.y);

  if (length < 1) {
    return;
  }

  var ux = (b.x - a.x) / length;
  var uz = (b.y - a.y) / length;
  var angle = -Math.atan2(uz, ux);
  var thickness = wall.thickness || 10;
  var holes = throughOpenings(wall);
  var pieces = wallPieces(length, height, holes);

  for (var p = 0; p < pieces.length; p++) {
    var cx = (pieces[p][0] + pieces[p][1]) / 2;
    add3dBox(pieces[p][1] - pieces[p][0], pieces[p][3] - pieces[p][2], thickness, wallColor(), a.x + ux * cx, (pieces[p][2] + pieces[p][3]) / 2, a.y + uz * cx, angle);
  }

  for (var h = 0; h < holes.length; h++) {
