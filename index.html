    three.refs.set(holes[h].item || holes[h], { list: holes[h].item ? wall.back.openings : wall.openings, kind: 'opening' });
  }

  for (var g = 0; g < holes.length; g++) {
    if (openingKind(holes[g]) === 'window') {
      var glassCenter = holes[g].x + holes[g].w / 2;
      var glass = new THREE.Mesh(new THREE.BoxGeometry(holes[g].w, holes[g].h, 1.5), glassMaterial3d());
      glass.position.set(a.x + ux * glassCenter, holes[g].y + holes[g].h / 2, a.y + uz * glassCenter);
      glass.rotation.y = angle;
      glass.userData.item = holes[g].item || holes[g];
      three.content.add(glass);
    }
  }

  var faces = [{ sign: 1, cables: wall.cables, symbols: wall.symbols, openings: wall.openings, beams: wall.openings.filter(function (opening) { return opening.solid; }) }];

  if (wall.back) {
    faces.push({ sign: -1, cables: wall.back.cables, symbols: wall.back.symbols, openings: wall.back.openings || [], beams: (wall.back.openings || []).filter(function (opening) { return opening.solid; }) });
  }

  for (var f = 0; f < faces.length; f++) {
    var face = faces[f];
    var nx = face.sign * -uz;
    var nz = face.sign * ux;
    var place = function (x, y, offset) {
      var along = face.sign > 0 ? x : length - x;
      return new THREE.Vector3(a.x + ux * along + nx * offset, y, a.y + uz * along + nz * offset);
    };

    for (var c = 0; c < face.cables.length; c++) {
      var points = face.cables[c].points;
      three.refs.set(face.cables[c], { list: face.cables, kind: 'cable' });

      for (var i = 1; i < points.length; i++) {
        add3dTube(place(points[i - 1].x, points[i - 1].y, thickness / 2 + 1.5), place(points[i].x, points[i].y, thickness / 2 + 1.5), cableColor(face.cables[c]), face.cables[c]);
      }
    }

    for (var s = 0; s < face.symbols.length; s++) {
      var symbol = face.symbols[s];
      var size = symbolSize3d(symbol);
      var spot = place(symbol.x, symbol.y, thickness / 2 + size[2] / 2);
      add3dBox(size[0], size[1], size[2], size[3], spot.x, spot.y, spot.z, angle).userData.item = symbol;
      three.refs.set(symbol, { list: face.symbols, kind: 'symbol' });
      three.itemInfo.set(symbol, TEXTS.label3dDistances.replace('{left}', Math.round(symbol.x)).replace('{right}', Math.round(length - symbol.x)).replace('{floor}', Math.round(symbol.y)));
      add3dLabel(label3d(symbol), place(symbol.x, symbol.y - size[1] / 2 - 1, thickness / 2 + 2), null, symbol);
    }

    for (var l = 0; l < face.cables.length; l++) {
      var named = face.cables[l];

      if (named.label && named.points.length >= 2) {
        var first = named.points[0];
        var second = named.points[1];
        add3dLabel(named.label, place((first.x + second.x) / 2, (first.y + second.y) / 2, thickness / 2 + 2), cableColor(named), named);
      }
    }

    for (var m = 0; m < face.beams.length; m++) {
      var beam = face.beams[m];
      var beamSpot = place(beam.x + beam.w / 2, beam.y + beam.h / 2, thickness / 2 + 4);
      add3dBox(beam.w, beam.h, 8, '#b8bec7', beamSpot.x, beamSpot.y, beamSpot.z, angle).userData.item = beam;
      three.refs.set(beam, { list: face.openings, kind: 'opening' });
    }
  }

  for (var o = 0; o < holes.length; o++) {
    var opening = holes[o];

    if (opening.label) {
      var center = opening.x + opening.w / 2;
      add3dLabel(opening.label, new THREE.Vector3(a.x + ux * center - uz * (thickness / 2 + 6), opening.y + opening.h / 2, a.y + uz * center + ux * (thickness / 2 + 6)), null, opening.item || opening);
    }
  }

  var passages = wall.passages || [];

  for (var k = 0; k < passages.length; k++) {
    var hole = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, thickness + 4, 16), material3d('#2b2f36'));
    hole.position.set(a.x + ux * passages[k].x, passages[k].y, a.y + uz * passages[k].x);
    hole.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-uz, 0, ux));
    hole.userData.item = passages[k];
    three.refs.set(passages[k], { list: passages, kind: 'passage' });
    three.content.add(hole);
  }
}

function reset3dCamera() {
  var box = three.box || { minX: 0, maxX: 500, minZ: 0, maxZ: 500 };
  three.target = new THREE.Vector3((box.minX + box.maxX) / 2, state.wallHeight / 3, (box.minZ + box.maxZ) / 2);
  three.radius = Math.max(box.maxX - box.minX, box.maxZ - box.minZ, 300) * 1.4;
  three.theta = Math.PI * 0.3;
  three.phi = Math.PI * 0.3;
}

// Hides labels whose element is behind a wall from the current camera.
function hideCoveredLabels() {
  if (!three.labels.visible) {
    return;
  }

  var solids = [];

  for (var i = 0; i < three.content.children.length; i++) {
    if (three.content.children[i] !== three.labels) {
      solids.push(three.content.children[i]);
    }
  }

  var ray = new THREE.Raycaster();

  for (var j = 0; j < three.labels.children.length; j++) {
    var sprite = three.labels.children[j];
    var direction = sprite.position.clone().sub(three.camera.position);
    var distance = direction.length();
    ray.set(three.camera.position, direction.normalize());
    ray.far = distance - 3;
    sprite.visible = ray.intersectObjects(solids, true).length === 0;
  }
}

function render3d() {
  if (!three.renderer) {
    return;
  }

  three.labels.visible = elements.showLabels.checked;
  var sinPhi = Math.sin(three.phi);
  three.camera.position.set(three.target.x + three.radius * sinPhi * Math.cos(three.theta), three.target.y + three.radius * Math.cos(three.phi), three.target.z + three.radius * sinPhi * Math.sin(three.theta));
  three.camera.lookAt(three.target);
  hideCoveredLabels();
  three.renderer.render(three.scene, three.camera);
}

// Left button orbits around the flat, right or middle button moves it.
function on3dPointerDown(event) {
  elements.canvas3d.setPointerCapture(event.pointerId);
  three.drag = { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY, pan: event.button !== 0 };
}

function on3dPointerMove(event) {
  if (!three.drag) {
    return;
  }

  var dx = event.clientX - three.drag.x;
  var dy = event.clientY - three.drag.y;
  three.drag.x = event.clientX;
  three.drag.y = event.clientY;

  if (three.drag.pan) {
    var right = new THREE.Vector3();
    var up = new THREE.Vector3();
    three.camera.matrixWorld.extractBasis(right, up, new THREE.Vector3());
    var step = three.radius * 0.0015;
    three.target.addScaledVector(right, -dx * step).addScaledVector(up, dy * step);
  } else {
    three.theta = three.theta + dx * 0.006;
    three.phi = clamp(three.phi - dy * 0.006, 0.05, Math.PI / 2 - 0.02);
  }

  render3d();
}

function on3dPointerUp(event) {
  var drag = three.drag;
  three.drag = null;

  if (drag && !drag.pan && Math.abs(event.clientX - drag.startX) + Math.abs(event.clientY - drag.startY) < 4) {
    edit3dLabelAt(event);
  }
}

// Finds the clicked symbol, cable or opening and opens a text box for its label.
function edit3dLabelAt(event) {
  var rect = elements.canvas3d.getBoundingClientRect();
  var pointer = new THREE.Vector2((event.clientX - rect.left) / rect.width * 2 - 1, -(event.clientY - rect.top) / rect.height * 2 + 1);
  var ray = new THREE.Raycaster();
  ray.setFromCamera(pointer, three.camera);
  var hits = ray.intersectObjects(three.content.children, true);
  var item = null;

  for (var i = 0; i < hits.length; i++) {
    if (hits[i].object.visible && hits[i].object.userData.item) {
      item = hits[i].object.userData.item;
      break;
    }

    if (hits[i].object.type !== 'Sprite') {
      break;
    }
  }

  three.selected = item && three.refs.has(item) ? item : null;
  renderSidebar();
}

// Right panel in 3D for the clicked item: label, exact position and delete.
function add3dItemProps(props) {
  var item = three.selected;
  var ref = item ? three.refs.get(item) : null;

  if (!ref || ref.list.indexOf(item) < 0) {
    three.selected = null;
    return;
  }

  var apply = function () {
    markChanged();
    build3dScene();
    render3d();
  };
  var title = ref.kind === 'symbol' ? TEXTS[SYMBOL_TYPES[symbolIndex(item.type)].textKey] : ref.kind === 'opening' ? TEXTS.openingLabel : ref.kind === 'passage' ? TEXTS.passage3d : TEXTS.cable3d;
  props.appendChild(createElement('h3', 'side-title', title));

  if (ref.kind !== 'passage') {
    var row = createElement('label', 'field');
    row.appendChild(createElement('span', 'field-label', TEXTS.itemLabel));
    var input = createElement('input', 'field-input');
    input.type = 'text';
    input.value = item.label || '';
    input.addEventListener('change', function () {
      item.label = input.value.trim();
      apply();
    });
    row.appendChild(input);
    props.appendChild(row);
  }

  if (ref.kind === 'opening' && !item.solid) {
    addOpeningKindSelect(props, item);
  }

  if (ref.kind !== 'cable' && !ref.ceiling) {
    addNumberField(props, TEXTS.distLeft, item.x, function (value) {
      item.x = Math.max(0, value);
      apply();
    });
    addNumberField(props, TEXTS.distFloor, item.y, function (value) {
      item.y = clamp(value, 0, state.wallHeight);
      apply();
    });
  }

  if (ref.kind === 'opening') {
    addNumberField(props, TEXTS.openingWidth, item.w, function (value) {
      item.w = Math.max(1, value);
      apply();
    });
    addNumberField(props, TEXTS.openingHeight, item.h, function (value) {
      item.h = Math.max(1, value);
      apply();
    });
  }

  addButton(props, TEXTS.deleteItem, function () {
    ref.list.splice(ref.list.indexOf(item), 1);
    three.selected = null;
    apply();
    renderSidebar();
  });
}

// Saves or cancels the label typed in the 3D text box.
function finish3dLabel(save) {
  var item = three.editItem;
  three.editItem = null;
  elements.label3dBox.classList.add('hidden');

  if (!item || !save) {
    return;
  }

  item.label = elements.label3dInput.value.trim();
  markChanged();
  build3dScene();
  render3d();
}

function on3dWheel(event) {
  event.preventDefault();
  three.radius = clamp(three.radius * (event.deltaY > 0 ? 1.12 : 0.89), 40, 50000);
  render3d();
}

function resizeCanvas() {
  var rect = elements.stage.getBoundingClientRect();
  var ratio = window.devicePixelRatio || 1;
  canvasWidth = rect.width;
  canvasHeight = rect.height;
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  if (three.renderer) {
    three.renderer.setPixelRatio(ratio);
    three.renderer.setSize(rect.width, rect.height, false);
    three.camera.aspect = rect.width / Math.max(1, rect.height);
    three.camera.updateProjectionMatrix();
  }

  render();
}

function render() {
  placedLabels = [];
  canvas.classList.toggle('hidden', ui.mode === '3d');
  elements.canvas3d.classList.toggle('hidden', ui.mode !== '3d');

  if (ui.mode === '3d') {
    if (three.renderer) {
      build3dScene();
    }

    render3d();
    return;
  }

  updateView();
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);
  ctx.fillStyle = COLORS.background;
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);

  if (ui.mode === 'plan') {
    renderPlan();
  } else if (ui.mode === 'ceiling') {
    renderCeiling();
  } else {
    renderWall();
  }

  renderGuides();
  renderMarquee();
}

// Draws dashed guide lines when the point is aligned with another point.
function renderGuides() {
  if (!ui.drawing && !ui.dragging && !ui.preview) {
    return;
  }

  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = COLORS.accent;
  ctx.lineWidth = 1;

  if (ui.guide.x !== null) {
    var gx = worldToScreen(ui.guide.x, 0).x;
    ctx.beginPath();
    ctx.moveTo(gx, 0);
    ctx.lineTo(gx, canvasHeight);
    ctx.stroke();
  }

  if (ui.guide.y !== null) {
    var gy = worldToScreen(0, ui.guide.y).y;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(canvasWidth, gy);
    ctx.stroke();
  }

  ctx.setLineDash([]);
}

var placedLabels = [];

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}

// Marks an area that labels should not cover, e.g. a symbol.
function registerLabelObstacle(x, y, halfWidth, halfHeight) {
  placedLabels.push({ x: x - halfWidth, y: y - halfHeight, w: halfWidth * 2, h: halfHeight * 2 });
}

// Draws a text with a white halo; when it would cover another label or symbol it moves a little up or down.
// When a direction (alongX, alongY) is given, a colliding label moves along it, e.g. along its cable.
function drawLabel(text, x, y, color, alongX, alongY) {
  ctx.font = '12px Segoe UI, Arial, sans-serif';
  var width = ctx.measureText(text).width + 12;
  var along = alongX !== undefined;
  var stepX = along ? alongX : 0;
  var stepY = along ? alongY : 1;
  var offsets = along ? [0, 36, -36, 72, -72] : [0, 16, 32, 48, 64, 80, 96, 112, 128, -16, -32];
  var chosenX = x;
  var chosenY = y;
  var fewest = Infinity;

  // Takes the first free place; if none is free, the place with the fewest overlaps.
  for (var i = 0; i < offsets.length; i++) {
    var cx = x + stepX * offsets[i];
    var cy = y + stepY * offsets[i];
    var rect = { x: cx - width / 2, y: cy - 10, w: width, h: 20 };
    var overlaps = 0;

    for (var k = 0; k < placedLabels.length; k++) {
      if (rectsOverlap(rect, placedLabels[k])) {
        overlaps++;
      }
    }

    if (overlaps < fewest) {
      fewest = overlaps;
      chosenX = cx;
      chosenY = cy;
    }

    if (overlaps === 0) {
      break;
    }
  }

  x = chosenX;
  y = chosenY;
  placedLabels.push({ x: x - width / 2, y: y - 10, w: width, h: 20 });
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || COLORS.text;
  ctx.fillText(text, x, y);
}

// Draws grid lines: fine lines at the snap step and stronger lines every 100 cm.
function strokeGrid(minX, maxX, minY, maxY, cm, color) {
  var yA = worldToScreen(0, minY).y;
  var yB = worldToScreen(0, maxY).y;
  var xA = worldToScreen(minX, 0).x;
  var xB = worldToScreen(maxX, 0).x;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();

  for (var x = Math.ceil(minX / cm) * cm; x <= maxX; x += cm) {
    var sx = worldToScreen(x, 0).x;
    ctx.moveTo(sx, yA);
    ctx.lineTo(sx, yB);
  }

  for (var y = Math.ceil(minY / cm) * cm; y <= maxY; y += cm) {
    var sy = worldToScreen(0, y).y;
    ctx.moveTo(xA, sy);
    ctx.lineTo(xB, sy);
  }

  ctx.stroke();
}

function drawGridLines(x0, x1, y0, y1) {
  var minX = Math.min(x0, x1);
  var maxX = Math.max(x0, x1);
  var minY = Math.min(y0, y1);
  var maxY = Math.max(y0, y1);
  var majorCm = 100;

  while (majorCm * view.scale < 8) {
    majorCm = majorCm * 10;
  }

  if (GRID_CM * view.scale >= 6 && GRID_CM < majorCm) {
    strokeGrid(minX, maxX, minY, maxY, GRID_CM, COLORS.gridMinor);
  }

  strokeGrid(minX, maxX, minY, maxY, majorCm, COLORS.grid);
}
// Unit normal of a wall in screen space pointing to side A (front) or B (back).
function wallSideNormal(wall, side) {
  var a = worldToScreen(getNode(wall.a).x, getNode(wall.a).y);
  var b = worldToScreen(getNode(wall.b).x, getNode(wall.b).y);
  var length = Math.max(0.001, dist(a.x, a.y, b.x, b.y));
  var sign = side === 'back' ? -1 : 1;
  return { a: a, b: b, x: sign * -(b.y - a.y) / length, y: sign * (b.x - a.x) / length };
}

// Returns 'front' or 'back' when the mouse is on the letter A or B of the selected wall.
function findSideLabel(sx, sy) {
  var selected = ui.selected && ui.selected.kind === 'wall' ? getWall(ui.selected.id) : null;

  if (!selected) {
    return null;
  }

  var sides = ['front', 'back'];

  for (var i = 0; i < sides.length; i++) {
    var normal = wallSideNormal(selected, sides[i]);
    var offset = Math.max(3, selected.thickness * view.scale) / 2 + 14;
    var x = (normal.a.x + normal.b.x) / 2 + normal.x * offset;
    var y = (normal.a.y + normal.b.y) / 2 + normal.y * offset;

    if (dist(sx, sy, x, y) <= 12) {
      return sides[i];
    }
  }

  return null;
}

// Highlights the side under the mouse and labels the sides of the selected wall.
function renderWallSides() {
  if (ui.hoverSide) {
    var hovered = getWall(ui.hoverSide.wallId);

    if (hovered) {
      var n = wallSideNormal(hovered, ui.hoverSide.side);
      var inner = Math.max(3, hovered.thickness * view.scale) / 2;
      var outer = inner + 9;
      ctx.fillStyle = 'rgba(232, 89, 12, 0.35)';
      ctx.beginPath();
      ctx.moveTo(n.a.x + n.x * inner, n.a.y + n.y * inner);
      ctx.lineTo(n.b.x + n.x * inner, n.b.y + n.y * inner);
      ctx.lineTo(n.b.x + n.x * outer, n.b.y + n.y * outer);
      ctx.lineTo(n.a.x + n.x * outer, n.a.y + n.y * outer);
      ctx.closePath();
      ctx.fill();
      drawLabel(ui.hoverSide.side === 'back' ? TEXTS.sideB : TEXTS.sideA, (n.a.x + n.b.x) / 2 + n.x * (outer + 10), (n.a.y + n.b.y) / 2 + n.y * (outer + 10));
    }
  }

  var selected = ui.selected && ui.selected.kind === 'wall' ? getWall(ui.selected.id) : null;

  if (!selected) {
    return;
  }

  var sides = ['front', 'back'];

  for (var i = 0; i < sides.length; i++) {
    var normal = wallSideNormal(selected, sides[i]);
    var offset = Math.max(3, selected.thickness * view.scale) / 2 + 14;
    drawLabel(sides[i] === 'back' ? TEXTS.sideB : TEXTS.sideA, (normal.a.x + normal.b.x) / 2 + normal.x * offset, (normal.a.y + normal.b.y) / 2 + normal.y * offset);
  }
}

// Draws doors (gap with a door leaf and swing) and windows (gap with a double line) into the walls.
function renderPlanOpenings() {
  for (var w = 0; w < state.walls.length; w++) {
    var wall = state.walls[w];
    var a = getNode(wall.a);
    var b = getNode(wall.b);
    var length = dist(a.x, a.y, b.x, b.y);

    if (length < 1) {
      continue;
    }

    var ux = (b.x - a.x) / length;
    var uy = (b.y - a.y) / length;
    var thickness = Math.max(3, wall.thickness * view.scale);
    var half = thickness / 2;

    var planOpenings = throughOpenings(wall);

    for (var o = 0; o < planOpenings.length; o++) {
      var opening = planOpenings[o];
      var p1 = worldToScreen(a.x + ux * opening.x, a.y + uy * opening.x);
      var p2 = worldToScreen(a.x + ux * (opening.x + opening.w), a.y + uy * (opening.x + opening.w));
      var nx = -uy;
      var ny = ux;
      ctx.lineCap = 'butt';
      ctx.strokeStyle = COLORS.background;
      ctx.lineWidth = thickness + 2;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.strokeStyle = COLORS.line;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x - nx * half, p1.y - ny * half);
      ctx.lineTo(p1.x + nx * half, p1.y + ny * half);
      ctx.moveTo(p2.x - nx * half, p2.y - ny * half);
      ctx.lineTo(p2.x + nx * half, p2.y + ny * half);
      ctx.stroke();
      ctx.strokeStyle = '#6b7280';
      ctx.lineWidth = 1;
      ctx.beginPath();

      var kind = openingKind(opening);

      if (kind === 'doorLeft') {
        var radius = dist(p1.x, p1.y, p2.x, p2.y);
        var angle = Math.atan2(uy, ux);
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p1.x + nx * radius, p1.y + ny * radius);
        ctx.moveTo(p2.x, p2.y);
        ctx.arc(p1.x, p1.y, radius, angle, angle + Math.PI / 2);
      } else if (kind === 'doorRight') {
        var radiusRight = dist(p1.x, p1.y, p2.x, p2.y);
        var angleRight = Math.atan2(-uy, -ux);
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p2.x + nx * radiusRight, p2.y + ny * radiusRight);
        ctx.moveTo(p1.x, p1.y);
        ctx.arc(p2.x, p2.y, radiusRight, angleRight, angleRight - Math.PI / 2, true);
      } else if (kind === 'window') {
        var gap = half * 0.35;
        ctx.moveTo(p1.x + nx * gap, p1.y + ny * gap);
        ctx.lineTo(p2.x + nx * gap, p2.y + ny * gap);
        ctx.moveTo(p1.x - nx * gap, p1.y - ny * gap);
        ctx.lineTo(p2.x - nx * gap, p2.y - ny * gap);
      }

      ctx.stroke();
    }
  }

  ctx.lineCap = 'round';
}

// Short text written into a schema symbol.
function schemaText(type) {
  var texts = {
    socket2: TEXTS.schemaDouble, socket400: TEXTS.schema400, socketOut: TEXTS.schemaOutdoor, data: TEXTS.schemaData,
    tv: TEXTS.schemaTv, bell: TEXTS.schemaBell, thermostat: TEXTS.schemaThermostat, motion: TEXTS.schemaMotion,
    smoke: TEXTS.schemaSmoke, dimmer: TEXTS.schemaDimmer, blinds: TEXTS.schemaBlinds
  };
  return texts[type] || '';
}

// Draws an electrical schema symbol; angle points from the wall into the room.
function drawSchemaSymbol(type, x, y, angle) {
  var r = 7;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.strokeStyle = '#1f2937';
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  var isSocket = type === 'socket' || type === 'socket2' || type === 'socket400' || type === 'socketOut';
  var isSwitch = type === 'switch' || type === 'switch2' || type === 'dimmer' || type === 'blinds';

  if (isSocket) {
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(0, 0);
    ctx.moveTo(0, -r);
    ctx.lineTo(0, r);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.fill();
    ctx.stroke();
  } else if (isSwitch) {
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(-3.5, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2.5, -2.5);
    ctx.lineTo(9, -9);
    ctx.lineTo(11, -7);
    ctx.stroke();
  } else if (type === 'light') {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.7, -r * 0.7);
    ctx.lineTo(r * 0.7, r * 0.7);
    ctx.moveTo(-r * 0.7, r * 0.7);
    ctx.lineTo(r * 0.7, -r * 0.7);
    ctx.stroke();
  } else if (type === 'board') {
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(-5, -8, 10, 16);
  } else if (type === 'box' || type === 'outlet') {
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.lineTo(0, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, type === 'box' ? 4.5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = type === 'box' ? '#ffffff' : '#1f2937';
    ctx.fill();
    ctx.stroke();

    if (type === 'box') {
      ctx.beginPath();
      ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#1f2937';
      ctx.fill();
    }
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, r + 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
  var text = schemaText(type);

  if (text) {
    ctx.font = 'bold 8px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1f2937';
    var tx = isSocket || isSwitch ? x + Math.cos(angle) * 15 : x;
    var ty = isSocket || isSwitch ? y + Math.sin(angle) * 15 : y;
    ctx.fillText(text, tx, ty);
  }
}

function cableColor(cable) {
  var circuit = getCircuit(cable.circuitId);
  return circuit ? circuit.color : getCableType(cable.typeId).colors[0];
}

// Draws wall cables beside their wall side, symbols as dots, passages on the wall and ceiling cables dashed.
function renderPlanWiring() {
  if (!elements.showWiring.checked) {
    return;
  }

  for (var w = 0; w < state.walls.length; w++) {
    var wall = state.walls[w];
    var a = getNode(wall.a);
    var b = getNode(wall.b);
    var length = dist(a.x, a.y, b.x, b.y);

    if (length < 1) {
      continue;
    }

    var ux = (b.x - a.x) / length;
    var uy = (b.y - a.y) / length;
    var faces = [{ side: 'front', cables: wall.cables, symbols: wall.symbols }];

    if (wall.back) {
      faces.push({ side: 'back', cables: wall.back.cables, symbols: wall.back.symbols });
    }

    for (var f = 0; f < faces.length; f++) {
      var sign = faces[f].side === 'back' ? -1 : 1;
      var offset = wall.thickness / 2 + 12 / view.scale;
      var nx = sign * -uy * offset;
      var ny = sign * ux * offset;
      var mapWorld = function (x) {
        var along = sign > 0 ? x : length - x;
        return { x: a.x + ux * along + nx, y: a.y + uy * along + ny };
      };
      var mapPoint = function (x) {
        var world = mapWorld(x);
        return worldToScreen(world.x, world.y);
      };

      for (var c = 0; c < faces[f].cables.length; c++) {
        var cable = faces[f].cables[c];
        ctx.strokeStyle = cableColor(cable);
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();

        for (var i = 0; i < cable.points.length; i++) {
          var p = mapPoint(cable.points[i].x);

          if (i === 0) {
            ctx.moveTo(p.x, p.y);
          } else {
            ctx.lineTo(p.x, p.y);
          }
        }

        ctx.stroke();
      }

      for (var s = 0; s < faces[f].symbols.length; s++) {
        var symbol = faces[f].symbols[s];
        var sw = mapWorld(symbol.x);
        var sp = worldToScreen(sw.x, sw.y);
        drawSchemaSymbol(symbol.type, sp.x, sp.y, Math.atan2(ny, nx));
      }
    }

    var passages = wall.passages || [];

    for (var k = 0; k < passages.length; k++) {
      var pp = worldToScreen(a.x + ux * passages[k].x, a.y + uy * passages[k].x);
      ctx.fillStyle = '#1f2329';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  ctx.setLineDash([6, 4]);

  for (var cc = 0; cc < state.ceiling.cables.length; cc++) {
    var ceilingCable = state.ceiling.cables[cc];
    ctx.strokeStyle = cableColor(ceilingCable);
    ctx.lineWidth = 2;
    ctx.beginPath();

    for (var j = 0; j < ceilingCable.points.length; j++) {
      var cp = worldToScreen(ceilingCable.points[j].x, ceilingCable.points[j].y);

      if (j === 0) {
        ctx.moveTo(cp.x, cp.y);
      } else {
        ctx.lineTo(cp.x, cp.y);
      }
    }

    ctx.stroke();
  }

  ctx.setLineDash([]);

  for (var cs = 0; cs < state.ceiling.symbols.length; cs++) {
    var ceilingSymbol = state.ceiling.symbols[cs];
    var ceilingPoint = worldToScreen(ceilingSymbol.x, ceilingSymbol.y);
    drawSchemaSymbol(ceilingSymbol.type, ceilingPoint.x, ceilingPoint.y, -Math.PI / 2);
  }
}

function renderPlan() {
  var topLeftWorld = screenToWorld(0, 0);
  var bottomRightWorld = screenToWorld(canvasWidth, canvasHeight);
  drawGridLines(topLeftWorld.x, bottomRightWorld.x, topLeftWorld.y, bottomRightWorld.y);

  var wallsHidden = elements.hideWalls.checked;

  for (var i = 0; i < state.walls.length && !wallsHidden; i++) {
    var wall = state.walls[i];
    var a = getNode(wall.a);
    var b = getNode(wall.b);
    var pa = worldToScreen(a.x, a.y);
    var pb = worldToScreen(b.x, b.y);
    var selected = isItemSelected('wall', wall.id);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, wall.thickness * view.scale);
    ctx.strokeStyle = selected ? COLORS.accent : COLORS.line;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
    drawLabel(Math.round(wallLength(wall)) + ' cm', (pa.x + pb.x) / 2, (pa.y + pb.y) / 2 - 14);
  }

  for (var n = 0; n < state.nodes.length && !wallsHidden; n++) {
    var np = worldToScreen(state.nodes[n].x, state.nodes[n].y);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = COLORS.line;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(np.x, np.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  if (!wallsHidden) {
    renderPlanOpenings();
  }

  renderPlanWiring();

  if (!wallsHidden) {
    renderWallSides();
  }

  if (ui.tool === 'addWall' && ui.preview) {
    var pv = worldToScreen(ui.preview.x, ui.preview.y);
    ctx.fillStyle = COLORS.accent;
    ctx.beginPath();
    ctx.arc(pv.x, pv.y, 4, 0, Math.PI * 2);
    ctx.fill();

    if (ui.drawing) {
      var from = getNode(ui.drawing.startNodeId);
      var pf = worldToScreen(from.x, from.y);
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = COLORS.accent;
      ctx.beginPath();
      ctx.moveTo(pf.x, pf.y);
      ctx.lineTo(pv.x, pv.y);
      ctx.stroke();
      ctx.setLineDash([]);
      drawLabel(Math.round(dist(from.x, from.y, ui.preview.x, ui.preview.y)) + ' cm', (pf.x + pv.x) / 2, (pf.y + pv.y) / 2 - 14);
    }
  }
}

function uniqueSorted(values) {
  var sorted = values.slice().sort(function (a, b) { return a - b; });
  var result = [];

  for (var i = 0; i < sorted.length; i++) {
    if (result.length === 0 || sorted[i] - result[result.length - 1] > 0.5) {
      result.push(sorted[i]);
    }
  }

  return result;
}

// Walls that touch the viewed face, as positions along it (cm from the left edge) and their thickness.
function wallJoins(wall, sign) {
  var a = getNode(wall.a);
  var b = getNode(wall.b);
  var length = dist(a.x, a.y, b.x, b.y);
  var joins = [];

  if (length < 1) {
    return joins;
  }

  var ux = (b.x - a.x) / length;
  var uy = (b.y - a.y) / length;
  var nx = sign * -uy;
  var ny = sign * ux;

  for (var i = 0; i < state.walls.length; i++) {
    var other = state.walls[i];

    if (other === wall) {
      continue;
    }

    var ends = [[other.a, other.b], [other.b, other.a]];

    for (var e = 0; e < 2; e++) {
      var p = getNode(ends[e][0]);
      var q = getNode(ends[e][1]);
      var along = (p.x - a.x) * ux + (p.y - a.y) * uy;
      var across = (p.x - a.x) * nx + (p.y - a.y) * ny;
      var away = (q.x - p.x) * nx + (q.y - p.y) * ny;

      if (along >= -1 && along <= length + 1 && Math.abs(across) <= (wall.thickness || 10) && away > 1) {
        var x = sign > 0 ? along : length - along;
        joins.push({ x: x, w: other.thickness || 10 });
      }
    }
  }

  return joins;
}

// Shades the strips where partition walls meet the viewed face.
function drawWallJoins(wall, length) {
  var joins = wallJoins(wall, ui.activeSide === 'back' ? -1 : 1);
  ctx.fillStyle = '#c3c8d0';

  for (var i = 0; i < joins.length; i++) {
    var left = clamp(joins[i].x - joins[i].w / 2, 0, length);
    var right = clamp(joins[i].x + joins[i].w / 2, 0, length);
    var top = worldToScreen(left, state.wallHeight);
    var bottom = worldToScreen(right, 0);
    ctx.fillRect(top.x, top.y, bottom.x - top.x, bottom.y - top.y);
  }
}

// Colour of all walls in the plan, wall view and 3D.
function wallColor() {
  return state.wallColor || COLORS.wall;
}

function redrawWallColor() {
  if (ui.mode === '3d') {
    build3dScene();
    render3d();
  } else {
    render();
  }
}

// Colour picker for the walls.
function addWallColorField(props) {
  var row = createElement('label', 'field');
  row.appendChild(createElement('span', 'field-label', TEXTS.wallColorLabel));
  var input = createElement('input', 'field-input');
  input.type = 'color';
  input.value = wallColor();
  // The colour shows while picking; it is saved when the picker closes.
  input.addEventListener('input', function () {
    state.wallColor = input.value;
    redrawWallColor();
  });
  input.addEventListener('change', function () {
    state.wallColor = input.value;
    markChanged();
    redrawWallColor();
  });
  row.appendChild(input);
  props.appendChild(row);
}

function renderWall() {
  var wall = getActiveWall();
  var length = wallLength(wall);
  var topLeft = worldToScreen(0, state.wallHeight);
  var bottomRight = worldToScreen(length, 0);
  ctx.fillStyle = wallColor();
  ctx.fillRect(topLeft.x, topLeft.y, bottomRight.x - topLeft.x, bottomRight.y - topLeft.y);
  if (!elements.hideWallGrid.checked) {
    drawGridLines(0, length, 0, state.wallHeight);
  }

  drawWallJoins(wall, length);

  for (var o = 0; o < wall.openings.length; o++) {
    var opening = wall.openings[o];

    if (ui.activeSide === 'back') {
      if (!opening.solid) {
        drawOpening({ x: length - opening.x - opening.w, y: opening.y, w: opening.w, h: opening.h, label: opening.label }, false);
      }
    } else {
      drawOpening(opening, isItemSelected('opening', opening.id));
    }
  }

  if (ui.activeSide !== 'back') {
    var fromBack = throughOpenings(wall).filter(function (item) { return item.item; });

    for (var fb = 0; fb < fromBack.length; fb++) {
      drawOpening(fromBack[fb], false);
    }
  }

  if (ui.activeSide === 'back') {
    var backOpenings = getActiveSurface().openings;

    for (var bo = 0; bo < backOpenings.length; bo++) {
      drawOpening(backOpenings[bo], isItemSelected('opening', backOpenings[bo].id));
    }
  }

  ctx.strokeStyle = COLORS.line;
  ctx.lineWidth = 2;
  ctx.strokeRect(topLeft.x, topLeft.y, bottomRight.x - topLeft.x, bottomRight.y - topLeft.y);
  drawLabel(Math.round(length) + ' cm', (topLeft.x + bottomRight.x) / 2, topLeft.y - 16);
  drawLabel(Math.round(state.wallHeight) + ' cm', topLeft.x - 32, (topLeft.y + bottomRight.y) / 2);

  var shownPassages = getSidePassages();

  for (var ip = 0; ip < shownPassages.length; ip++) {
    var shown = shownPassages[ip];
    drawSymbol('passage', shown.x, shown.y, isItemSelected('passage', shown.item.id), 0);
    var passageScreen = worldToScreen(shown.x, shown.y);
    registerLabelObstacle(passageScreen.x, passageScreen.y, 10 * symbolScale(), 10 * symbolScale());
    drawSymbolLabel({ type: 'passage', x: shown.x, y: shown.y, label: shown.item.label });
  }

  renderCableStubs(getActiveSurface());
  renderSurfaceItems(getActiveSurface());
}

// Draws cables, symbols and the editing helpers of a wall or the ceiling.
function renderSurfaceItems(surface) {
  for (var c = 0; c < surface.cables.length; c++) {
    drawCable(surface.cables[c].points, getCableType(surface.cables[c].typeId), isItemSelected('cable', surface.cables[c].id), getCircuit(surface.cables[c].circuitId));
  }

  var k = symbolScale();

  for (var s = 0; s < surface.symbols.length; s++) {
    var symbol = surface.symbols[s];
    drawSymbol(symbol.type, symbol.x, symbol.y, isItemSelected('symbol', symbol.id), symbol.rotation, attachedCircuitId(symbol));
    var sp = worldToScreen(symbol.x, symbol.y);
    var turned = symbol.rotation === 90 || symbol.rotation === 270;
    var wide = symbol.type === 'socket2';
    registerLabelObstacle(sp.x, sp.y, (wide && !turned ? 21 : 12) * k, (wide && turned ? 21 : 12) * k);
  }

  for (var l = 0; l < surface.symbols.length; l++) {
    drawSymbolLabel(surface.symbols[l]);
  }

  for (var d = 0; d < surface.cables.length; d++) {
    drawSegmentLabels(surface.cables[d].points, surface, cableColor(surface.cables[d]));
    drawCableLabel(surface.cables[d]);
  }

  renderCableHandles(surface);
  renderOpeningHandles(surface);

  if (ui.mode === 'ceiling') {
    renderCeilingDistances(surface);
  } else {
    renderSelectedDistances(surface);
  }

  renderWallDrawing();
}

// Returns the node ids of the room outline when the walls form one closed loop.
function traceOutline() {
  if (state.nodes.length < 3 || state.walls.length !== state.nodes.length) {
    return null;
  }

  var adjacency = {};

  for (var w = 0; w < state.walls.length; w++) {
    adjacency[state.walls[w].a] = (adjacency[state.walls[w].a] || []).concat([state.walls[w].b]);
    adjacency[state.walls[w].b] = (adjacency[state.walls[w].b] || []).concat([state.walls[w].a]);
  }

  for (var n = 0; n < state.nodes.length; n++) {
    if (!adjacency[state.nodes[n].id] || adjacency[state.nodes[n].id].length !== 2) {
      return null;
    }
  }

  var order = [];
  var previous = null;
  var current = state.nodes[0].id;

  for (var i = 0; i < state.nodes.length; i++) {
    order.push(current);
    var neighbors = adjacency[current];
    var next = neighbors[0] !== previous ? neighbors[0] : neighbors[1];
    previous = current;
    current = next;
  }

  return current === state.nodes[0].id ? order : null;
}

function renderCeiling() {
  var topLeftWorld = screenToWorld(0, 0);
  var bottomRightWorld = screenToWorld(canvasWidth, canvasHeight);
  drawGridLines(topLeftWorld.x, bottomRightWorld.x, topLeftWorld.y, bottomRightWorld.y);
  var outline = traceOutline();

  if (outline) {
    ctx.fillStyle = wallColor();
    ctx.beginPath();

    for (var i = 0; i < outline.length; i++) {
      var corner = worldToScreen(getNode(outline[i]).x, getNode(outline[i]).y);

      if (i === 0) {
        ctx.moveTo(corner.x, corner.y);
      } else {
        ctx.lineTo(corner.x, corner.y);
      }
    }

    ctx.closePath();
    ctx.fill();
  }

  ctx.lineCap = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#6b7280';

  for (var w = 0; w < state.walls.length; w++) {
    var a = worldToScreen(getNode(state.walls[w].a).x, getNode(state.walls[w].a).y);
    var b = worldToScreen(getNode(state.walls[w].b).x, getNode(state.walls[w].b).y);
    ctx.lineWidth = Math.max(2, state.walls[w].thickness * view.scale);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  renderSurfaceItems(state.ceiling);
  renderCeilingStubs();
}

// Dots on the ceiling where wall cables come up; a click continues them.
function renderCeilingStubs() {
  var stubs = wallStubsOnCeiling();

  for (var i = 0; i < stubs.length; i++) {
    var p = worldToScreen(stubs[i].x, stubs[i].y);
    ctx.fillStyle = cableColor(stubs[i].cable);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

// Finds the nearest wall in an axis direction from a point.
function rayHit(x, y, dirX, dirY) {
  var best = null;

  for (var i = 0; i < state.walls.length; i++) {
    var a = getNode(state.walls[i].a);
    var b = getNode(state.walls[i].b);
    var hitX = x;
    var hitY = y;

    if (dirX !== 0) {
      if (Math.abs(a.y - b.y) < 0.001) {
        continue;
      }

      var tx = (y - a.y) / (b.y - a.y);

      if (tx < 0 || tx > 1) {
        continue;
      }

      hitX = a.x + tx * (b.x - a.x);
    } else {
      if (Math.abs(a.x - b.x) < 0.001) {
        continue;
      }

      var ty = (x - a.x) / (b.x - a.x);

      if (ty < 0 || ty > 1) {
        continue;
      }

      hitY = a.y + ty * (b.y - a.y);
    }

    var distance = (hitX - x) * dirX + (hitY - y) * dirY;

    if (distance > 0.5 && (best === null || distance < best.distance)) {
      best = { distance: distance, x: hitX, y: hitY };
    }
  }

  return best;
}

// Shows distances of the selected ceiling symbol to the nearest walls.
function renderCeilingDistances(surface) {
  if (!ui.selected || ui.selected.kind !== 'symbol') {
    return;
  }

  var item = findItem(surface, ui.selected);

  if (!item) {
    return;
  }

  var directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  for (var i = 0; i < directions.length; i++) {
    var hit = rayHit(item.x, item.y, directions[i][0], directions[i][1]);

    if (hit) {
      drawDimension(item.x, item.y, hit.x, hit.y);
    }
  }
}

// A circuit tool has the id "use:" + circuit id; it draws the cable type of the circuit.
function getCircuitFromTool(tool) {
  if (String(tool).indexOf('use:') !== 0) {
    return null;
  }

  return getCircuit(tool.substring(4));
}

function resolveCableTool(tool) {
  var circuit = getCircuitFromTool(tool);

  if (circuit) {
    var typeId = circuit.cableTypeId && getCableTypeStrict(circuit.cableTypeId) ? circuit.cableTypeId : state.cableTypes[0].id;
    return { typeId: typeId, circuitId: circuit.id };
  }

  return { typeId: tool, circuitId: ui.activeCircuitId };
}

// Button in the left panel that selects the circuit and its cable type.
function addCircuitToolButton(circuit) {
  var tool = 'use:' + circuit.id;
  var button = createElement('button', 'tool-button circuit-button');
  var dot = createElement('span', 'circuit-dot');
  dot.style.setProperty('--dot', circuit.color);
  button.appendChild(dot);
  button.appendChild(document.createTextNode(circuit.name));
  var type = getCableType(resolveCableTool(tool).typeId);
  button.title = [circuit.breaker, type.name].join(' · ');
  button.dataset.tool = tool;
  button.addEventListener('click', function () {
    setTool(tool);
  });
  elements.toolbar.appendChild(button);
}
function getCircuit(id) {
  for (var i = 0; i < state.circuits.length; i++) {
    if (state.circuits[i].id === id) {
      return state.circuits[i];
    }
  }

  return null;
}

function getCircuitColor(id) {
  var circuit = getCircuit(id);
  return circuit ? circuit.color : null;
}

// Breaker shows e.g. "B16 – Okruh 1", RCD shows the RCD of its circuit.
function circuitSymbolLabel(symbol) {
  var circuit = getCircuit(attachedCircuitId(symbol));

  if (!circuit) {
    return symbol.type === 'breaker' || symbol.type === 'rcd' ? symbolRating(symbol) : '';
  }

  if (symbol.type === 'breaker') {
    return [circuit.breaker, circuit.name].filter(Boolean).join(' – ');
  }

  if (symbol.type === 'rcd') {
    return circuit.rcd || '';
  }

  return '';
}

// Draws the text of a symbol below it.
function drawSymbolLabel(symbol) {
  if (!elements.showLabels.checked) {
    return;
  }

  var p = worldToScreen(symbol.x, symbol.y);
  drawLabel(symbol.label || circuitSymbolLabel(symbol) || TEXTS[SYMBOL_TYPES[symbolIndex(symbol.type)].textKey], p.x, p.y + 26 * symbolScale());
}

// Draws the name of a cable on its longest segment.
function drawCableLabel(cable) {
  if (!elements.showLabels.checked || !cable.label || cable.points.length < 2) {
    return;
  }

  var best = 1;
  var bestLength = -1;

  for (var i = 1; i < cable.points.length; i++) {
    var length = dist(cable.points[i - 1].x, cable.points[i - 1].y, cable.points[i].x, cable.points[i].y);

    if (length > bestLength) {
      bestLength = length;
      best = i;
    }
  }

  var a = worldToScreen(cable.points[best - 1].x, cable.points[best - 1].y);
  var b = worldToScreen(cable.points[best].x, cable.points[best].y);
  // The name sits on the cable itself, away from the middle where the length is written.
  var span = Math.max(0.001, dist(a.x, a.y, b.x, b.y));
  drawLabel(cable.label, a.x + (b.x - a.x) * 0.3, a.y + (b.y - a.y) * 0.3, cableColor(cable), (b.x - a.x) / span, (b.y - a.y) / span);
}

// Returns the screen positions of the eight resize handles of an opening.
function getOpeningHandles(opening) {
  var tl = worldToScreen(opening.x, opening.y + opening.h);
  var br = worldToScreen(opening.x + opening.w, opening.y);
  var mx = (tl.x + br.x) / 2;
  var my = (tl.y + br.y) / 2;
  return [
    { name: 'nw', x: tl.x, y: tl.y }, { name: 'n', x: mx, y: tl.y }, { name: 'ne', x: br.x, y: tl.y },
    { name: 'e', x: br.x, y: my }, { name: 'se', x: br.x, y: br.y }, { name: 's', x: mx, y: br.y },
    { name: 'sw', x: tl.x, y: br.y }, { name: 'w', x: tl.x, y: my }
  ];
}

// Returns the name of the resize handle of the selected opening under the mouse, if any.
function findOpeningHandle(wall, sx, sy) {
  if (!ui.selected || ui.selected.kind !== 'opening') {
    return null;
  }

  var opening = findItem(wall, ui.selected);

  if (!opening) {
    return null;
  }

  var handles = getOpeningHandles(opening);

  for (var i = 0; i < handles.length; i++) {
    if (dist(sx, sy, handles[i].x, handles[i].y) <= 8) {
      return handles[i].name;
    }
  }

  return null;
}

function renderOpeningHandles(surface) {
  if (!ui.selected || ui.selected.kind !== 'opening') {
    return;
  }

  var opening = findItem(surface, ui.selected);

  if (!opening) {
    return;
  }

  var handles = getOpeningHandles(opening);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = COLORS.accent;
  ctx.lineWidth = 2;

  for (var i = 0; i < handles.length; i++) {
    ctx.fillRect(handles[i].x - 4, handles[i].y - 4, 8, 8);
    ctx.strokeRect(handles[i].x - 4, handles[i].y - 4, 8, 8);
  }
}

// Resizes an opening by dragging one of its handles; edges snap to the grid.
function resizeOpening(opening, drag, world) {
  var limits = getSurfaceLimits();
  var x = snapValue(world.x, GRID_CM);
  var y = snapValue(world.y, GRID_CM);
  var left = drag.left;
  var right = drag.right;
  var bottom = drag.bottom;
  var top = drag.top;

  if (drag.handle.indexOf('w') >= 0) {
    left = clamp(x, limits.minX, right - GRID_CM);
  }

  if (drag.handle.indexOf('e') >= 0) {
    right = clamp(x, left + GRID_CM, limits.maxX);
  }

  if (drag.handle.indexOf('s') >= 0) {
    bottom = clamp(y, limits.minY, top - GRID_CM);
  }

  if (drag.handle.indexOf('n') >= 0) {
    top = clamp(y, bottom + GRID_CM, limits.maxY);
  }

  opening.x = left;
  opening.y = bottom;
  opening.w = right - left;
  opening.h = top - bottom;
}
// The node two walls have in common, or null.
function sharedNode(first, second) {
  if (first.a === second.a || first.a === second.b) {
    return first.a;
  }

  if (first.b === second.a || first.b === second.b) {
    return first.b;
  }

  return null;
}

function crossProduct(ax, ay, bx, by) {
  return ax * by - ay * bx;
}

// The next wall around a corner when turning from the given wall in one direction (+1 or -1).
function neighbourAround(nodeId, wall, turn) {
  var corner = getNode(nodeId);
  var baseFar = getNode(wall.a === nodeId ? wall.b : wall.a);
  var base = Math.atan2(baseFar.y - corner.y, baseFar.x - corner.x);
  var best = null;
  var bestDelta = Infinity;

  for (var i = 0; i < state.walls.length; i++) {
    var other = state.walls[i];

    if (other.id === wall.id || (other.a !== nodeId && other.b !== nodeId)) {
      continue;
    }

    var far = getNode(other.a === nodeId ? other.b : other.a);
    var delta = (Math.atan2(far.y - corner.y, far.x - corner.x) - base) * turn;

    while (delta <= 0) {
      delta += Math.PI * 2;
    }

    while (delta > Math.PI * 2) {
      delta -= Math.PI * 2;
    }

    if (delta < bestDelta) {
      bestDelta = delta;
      best = other;
    }
  }

  return best;
}

// True when the source face and the target face bound the same area between neighbouring walls around the corner.
function facesShareCorner(alongX, alongY, normalX, normalY, target, targetSide, shared, other) {
  var corner = getNode(shared);
  var far = getNode(target.a === shared ? target.b : target.a);
  var a = getNode(target.a);
  var b = getNode(target.b);
  var length = Math.max(0.001, dist(a.x, a.y, b.x, b.y));
  var targetAlongX = (far.x - corner.x) / length;
  var targetAlongY = (far.y - corner.y) / length;
  var sign = targetSide === 'back' ? -1 : 1;
  var targetNormalX = sign * -(b.y - a.y) / length;
  var targetNormalY = sign * (b.x - a.x) / length;
  var sourceTurn = crossProduct(alongX, alongY, normalX, normalY) > 0 ? 1 : -1;
  var targetTurn = crossProduct(targetAlongX, targetAlongY, targetNormalX, targetNormalY) > 0 ? 1 : -1;

  if (sourceTurn === targetTurn) {
    return false;
  }

  return neighbourAround(shared, other, sourceTurn) === target && neighbourAround(shared, target, targetTurn) === other;
}

// Walls whose end touches the middle of another wall (T-junction), with the geometry needed for cable stubs.
function teeJunctions() {
  var list = [];

  for (var i = 0; i < state.walls.length; i++) {
    var host = state.walls[i];
    var a = getNode(host.a);
    var b = getNode(host.b);
    var length = dist(a.x, a.y, b.x, b.y);

    if (length < 1) {
      continue;
    }

    var ux = (b.x - a.x) / length;
    var uy = (b.y - a.y) / length;

    for (var j = 0; j < state.walls.length; j++) {
      var other = state.walls[j];

      if (other === host) {
        continue;
      }

      var ends = [[other.a, other.b], [other.b, other.a]];

      for (var e = 0; e < 2; e++) {
        var p = getNode(ends[e][0]);
        var q = getNode(ends[e][1]);
        var along = (p.x - a.x) * ux + (p.y - a.y) * uy;
        var across = (p.x - a.x) * -uy + (p.y - a.y) * ux;
        var away = (q.x - p.x) * -uy + (q.y - p.y) * ux;

        if (along > 1 && along < length - 1 && Math.abs(across) <= (host.thickness || 10) && Math.abs(away) > 1) {
          list.push({ host: host, other: other, node: ends[e][0], along: along, hostLength: length, ux: ux, uy: uy, hostSign: away > 0 ? 1 : -1, half: (other.thickness || 10) / 2 });
        }
      }
    }
  }

  return list;
}

// Face of a wall (front or back) as cables, the side normal and the coordinate of a given end node.
function wallFaceInfo(wall, side, nodeId) {
  var a = getNode(wall.a);
  var b = getNode(wall.b);
  var length = Math.max(0.001, dist(a.x, a.y, b.x, b.y));
  var sign = side === 'back' ? -1 : 1;
  var startNode = side === 'back' ? wall.b : wall.a;
  return { cables: side === 'back' ? (wall.back ? wall.back.cables : []) : wall.cables, symbols: side === 'back' ? (wall.back ? wall.back.symbols : []) : wall.symbols, nx: sign * -(b.y - a.y) / length, ny: sign * (b.x - a.x) / length, edge: startNode === nodeId ? 0 : length, length: length };
}

// Position on the host face (face coordinates) of the band edge that faces the given side of the partition.
function teeEdgeOnHost(tee, normalX, normalY) {
  var along = tee.along + (normalX * tee.ux + normalY * tee.uy) * tee.half;
  return tee.hostSign > 0 ? along : tee.hostLength - along;
}

// Stubs on this face from cables at T-junctions: partition cables on the host wall and host cables on the partition.
function teeStubs(face) {
  var stubs = [];
  var target = face.isBack ? getWall(face.id) : face;
  var targetSide = face.isBack ? 'back' : 'front';
  var tees = teeJunctions();

  for (var i = 0; i < tees.length; i++) {
    var tee = tees[i];
    var hostSide = tee.hostSign > 0 ? 'front' : 'back';
    var sides = ['front', 'back'];

    if (tee.host.id === target.id && hostSide === targetSide) {
      // A cable ending at one edge of the partition strip goes through and sticks out at the other edge.
      var self = wallFaceInfo(tee.host, hostSide, tee.node);
      var edgeLeft = teeEdgeOnHost(tee, -tee.ux, -tee.uy);
      var edgeRight = teeEdgeOnHost(tee, tee.ux, tee.uy);
      var low = Math.min(edgeLeft, edgeRight);
      var high = Math.max(edgeLeft, edgeRight);
      collectEndStubs(stubs, self, low, high, tee.host.number, 1);
      collectEndStubs(stubs, self, high, low, tee.host.number, -1);

      for (var s = 0; s < 2; s++) {
        var source = wallFaceInfo(tee.other, sides[s], tee.node);
        var edgeHere = teeEdgeOnHost(tee, source.nx, source.ny);
        var center = teeEdgeOnHost(tee, 0, 0);
        collectEndStubs(stubs, source, source.edge, edgeHere, tee.other.number, edgeHere > center ? 1 : -1);
      }
    }

    if (tee.other.id === target.id) {
      var here = wallFaceInfo(tee.other, targetSide, tee.node);
      var host = wallFaceInfo(tee.host, hostSide, tee.node);
      collectEndStubs(stubs, host, teeEdgeOnHost(tee, here.nx, here.ny), here.edge, tee.host.number);
    }
  }

  return stubs;
}

// Ceiling cables that end on this wall face come down at its top edge.
function ceilingStubsOnWall(face) {
  var stubs = [];
  var wall = face.isBack ? getWall(face.id) : face;
  var side = face.isBack ? 'back' : 'front';
  var lines = wallFaceLines();

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    if (line.wall !== wall || line.side !== side) {
      continue;
    }

    for (var c = 0; c < state.ceiling.cables.length; c++) {
      var points = state.ceiling.cables[c].points;
      var ends = [0, points.length - 1];

      for (var e = 0; e < 2; e++) {
        var p = points[ends[e]];
        var across = (p.x - line.x) * line.nx + (p.y - line.y) * line.ny;
        var along = (p.x - line.x) * line.ux + (p.y - line.y) * line.uy;

        if (Math.abs(across) < 0.6 && along >= -0.5 && along <= line.length + 0.5) {
          stubs.push({ x: side === 'front' ? along : line.length - along, y: state.wallHeight, cable: state.ceiling.cables[c], vertical: true });
        }
      }
    }
  }

  return stubs;
}

// Wall cables that end at the top edge of a wall continue on the ceiling at the wall face.
function wallStubsOnCeiling() {
  var stubs = [];
  var lines = wallFaceLines();

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var face = line.side === 'front' ? line.wall : line.wall.back;

    if (!face) {
      continue;
    }

    for (var c = 0; c < face.cables.length; c++) {
      var points = face.cables[c].points;
      var ends = [points[0], points[points.length - 1]];

      for (var e = 0; e < 2; e++) {
        if (Math.abs(ends[e].y - state.wallHeight) < 0.5) {
          var along = line.side === 'front' ? ends[e].x : line.length - ends[e].x;
          stubs.push({ x: roundTo(line.x + line.ux * along, 1), y: roundTo(line.y + line.uy * along, 1), cable: face.cables[c], ceiling: true });
        }
      }
    }
  }

  return stubs;
}

// Cables that end in a passage on the other side of the wall stick out of the passage on this face.
function passageStubs(face) {
  var stubs = [];
  var wall = face.isBack ? getWall(face.id) : face;
  var passages = wall.passages || [];
  var length = wallLength(wall);
  var otherCables = face.isBack ? wall.cables : (wall.back ? wall.back.cables : []);

  for (var i = 0; i < passages.length; i++) {
    var hereX = face.isBack ? length - passages[i].x : passages[i].x;
    var thereX = length - hereX;

    for (var c = 0; c < otherCables.length; c++) {
      var points = otherCables[c].points;
      var ends = [points[0], points[points.length - 1]];

      for (var e = 0; e < ends.length; e++) {
        if (Math.abs(ends[e].x - thereX) < 0.5 && Math.abs(ends[e].y - passages[i].y) < 0.5) {
          stubs.push({ x: hereX, y: passages[i].y, cable: otherCables[c], inPassage: true });
        }
      }
    }
  }

  return stubs;
}

// Adds a stub for every cable end lying at the given position on the source face.
function collectEndStubs(stubs, source, edgeSource, edgeHere, fromNumber, direction) {
  var cables = source.cables;

  for (var c = 0; c < cables.length; c++) {
    var points = cables[c].points;
    var ends = [points[0], points[points.length - 1]];

    for (var e = 0; e < ends.length; e++) {
      if (Math.abs(ends[e].x - edgeSource) < 0.5) {
        stubs.push({ x: edgeHere, y: ends[e].y, fromNumber: fromNumber, cable: cables[c], direction: direction, endIndex: e === 0 ? 0 : points.length - 1, anchor: faceAnchor(source.symbols || [], source.length) });
      }
    }
  }
}

// The other wall goes straight on past the corner and this face lies on the same side, so a cable can pass through.
function facesContinueStraight(alongX, alongY, normalX, normalY, target, targetSide, shared) {
  var corner = getNode(shared);
  var far = getNode(target.a === shared ? target.b : target.a);
  var a = getNode(target.a);
  var b = getNode(target.b);
  var length = Math.max(0.001, dist(a.x, a.y, b.x, b.y));
  var sign = targetSide === 'back' ? -1 : 1;
  var targetAlongX = (far.x - corner.x) / length;
  var targetAlongY = (far.y - corner.y) / length;
  var targetNormalX = sign * -(b.y - a.y) / length;
  var targetNormalY = sign * (b.x - a.x) / length;
  return alongX * targetAlongX + alongY * targetAlongY < -0.99 && normalX * targetNormalX + normalY * targetNormalY > 0.99;
}

// Cables of neighbouring walls that end at the shared corner and continue on this face (same room only).
function getCableStubs(face) {
  var stubs = teeStubs(face).concat(passageStubs(face)).concat(ceilingStubsOnWall(face));
  var target = face.isBack ? getWall(face.id) : face;
  var targetSide = face.isBack ? 'back' : 'front';
  var lengthHere = wallLength(target);

  for (var i = 0; i < state.walls.length; i++) {
    var other = state.walls[i];
    var shared = other.id === target.id ? null : sharedNode(target, other);

    if (shared === null) {
      continue;
    }

    var edgeHere = face.a === shared ? 0 : lengthHere;
    var corner = getNode(shared);
    var far = getNode(other.a === shared ? other.b : other.a);
    var otherA = getNode(other.a);
    var otherB = getNode(other.b);
    var length = Math.max(0.001, dist(otherA.x, otherA.y, otherB.x, otherB.y));
    var alongX = (far.x - corner.x) / length;
    var alongY = (far.y - corner.y) / length;
    var sources = [{ cables: other.cables, symbols: other.symbols, side: 'front', a: other.a }];

    if (other.back) {
      sources.push({ cables: other.back.cables, symbols: other.back.symbols, side: 'back', a: other.b });
    }

    for (var s = 0; s < sources.length; s++) {
      var sign = sources[s].side === 'back' ? -1 : 1;
      var normalX = sign * -(otherB.y - otherA.y) / length;
      var normalY = sign * (otherB.x - otherA.x) / length;
      if (!facesShareCorner(alongX, alongY, normalX, normalY, target, targetSide, shared, other) && !facesContinueStraight(alongX, alongY, normalX, normalY, target, targetSide, shared)) {
        continue;
      }

      var edgeOther = sources[s].a === shared ? 0 : length;

      for (var c = 0; c < sources[s].cables.length; c++) {
        var points = sources[s].cables[c].points;
        var ends = [points[0], points[points.length - 1]];

        for (var e = 0; e < ends.length; e++) {
          if (Math.abs(ends[e].x - edgeOther) < 0.5) {
            stubs.push({ x: edgeHere, y: ends[e].y, fromNumber: other.number, cable: sources[s].cables[c], endIndex: e === 0 ? 0 : points.length - 1, anchor: faceAnchor(sources[s].symbols, length) });
          }
        }
      }
    }
  }

  return stubs;
}

// Draws a dashed piece of the cable that arrives from the neighbouring wall.
function renderCableStubs(wall) {
  var stubs = getCableStubs(wall);

  for (var i = 0; i < stubs.length; i++) {
    var stub = stubs[i];
    var circuit = getCircuit(stub.cable.circuitId);
    var color = circuit ? circuit.color : getCableType(stub.cable.typeId).colors[0];
    var direction = stub.direction || (stub.x === 0 ? 1 : -1);
    var edge = worldToScreen(stub.x, stub.y);
    var inner = stub.vertical ? worldToScreen(stub.x, stub.y - 12) : worldToScreen(stub.x + direction * 12, stub.y);

    // A cable coming through a passage shows only as a coloured ball in its middle.
    if (stub.inPassage) {
      ctx.fillStyle = color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(edge.x, edge.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      continue;
    }
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(edge.x, edge.y);
    ctx.lineTo(inner.x, inner.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(edge.x, edge.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}
// Returns the point of the selected cable under the mouse, if any.
function findCableHandle(wall, sx, sy) {
  var cable = ui.selected && ui.selected.kind === 'cable' ? findItem(wall, ui.selected) : null;

  // Without a selected cable, the end of any cable can be grabbed directly.
  if (!cable) {
    for (var c = 0; c < wall.cables.length; c++) {
      var points = wall.cables[c].points;
      var ends = [0, points.length - 1];

      for (var e = 0; e < ends.length; e++) {
        var end = worldToScreen(points[ends[e]].x, points[ends[e]].y);

        if (dist(sx, sy, end.x, end.y) <= 9) {
          ui.selected = { kind: 'cable', id: wall.cables[c].id };
          return { cableId: wall.cables[c].id, index: ends[e] };
        }
      }
    }

    return null;
  }

  for (var i = 0; i < cable.points.length; i++) {
    var p = worldToScreen(cable.points[i].x, cable.points[i].y);

    if (dist(sx, sy, p.x, p.y) <= 9) {
      return { cableId: cable.id, index: i };
    }
  }

  return null;
}

// Draws grab handles on the points of the selected cable.
function renderCableHandles(wall) {
  if (!ui.selected || ui.selected.kind !== 'cable') {
    return;
  }

  var cable = findItem(wall, ui.selected);

  if (!cable) {
    return;
  }

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = COLORS.accent;
  ctx.lineWidth = 2;

  for (var i = 0; i < cable.points.length; i++) {
    var p = worldToScreen(cable.points[i].x, cable.points[i].y);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

// Shows distances of the selected symbol or opening to the wall edges.
function renderSelectedDistances(wall) {
  if (!ui.selected || (ui.selected.kind !== 'symbol' && ui.selected.kind !== 'opening')) {
    return;
  }

  var item = findItem(wall, ui.selected);

  if (!item) {
    return;
  }

  if (ui.selected.kind === 'symbol') {
    drawDimension(0, item.y, item.x, item.y);
    drawDimension(item.x, item.y, wallLength(wall), item.y);
    drawDimension(item.x, 0, item.x, item.y);
    drawDimension(item.x, item.y, item.x, state.wallHeight);
    return;
  }

  drawDimension(0, item.y + item.h / 2, item.x, item.y + item.h / 2);
  drawDimension(item.x + item.w / 2, 0, item.x + item.w / 2, item.y);
}

function drawDimension(x1, y1, x2, y2) {
  var cm = dist(x1, y1, x2, y2);

  if (cm < 1) {
    return;
  }

  var a = worldToScreen(x1, y1);
  var b = worldToScreen(x2, y2);
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = COLORS.dim;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.setLineDash([]);
  drawLabel(Math.round(cm) + ' cm', (a.x + b.x) / 2, (a.y + b.y) / 2);
}

function renderWallDrawing() {
  if (ui.drawing && ui.drawing.kind === 'opening') {
    var d = ui.drawing;
    var tl = worldToScreen(Math.min(d.x0, d.x1), Math.max(d.y0, d.y1));
    var br = worldToScreen(Math.max(d.x0, d.x1), Math.min(d.y0, d.y1));
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = COLORS.accent;
    ctx.lineWidth = 2;
    ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    ctx.setLineDash([]);
    drawLabel(Math.round(Math.abs(d.x1 - d.x0)) + ' × ' + Math.round(Math.abs(d.y1 - d.y0)) + ' cm', (tl.x + br.x) / 2, (tl.y + br.y) / 2);
    return;
  }

  if (ui.drawing && ui.drawing.kind === 'cable' && ui.preview) {
    var points = ui.drawing.points.concat([ui.preview]);
    drawCable(points, getCableType(ui.drawing.typeId), false, getCircuit(ui.drawing.circuitId));
    drawSegmentLabels(points, getActiveSurface(), cableColor({ typeId: ui.drawing.typeId, circuitId: ui.drawing.circuitId }));
    return;
  }

  if (isSymbolTool(ui.tool) && ui.preview) {
    ctx.globalAlpha = 0.5;
    drawSymbol(ui.tool, ui.preview.x, ui.preview.y, false);
    ctx.globalAlpha = 1;
  }
}

// Door: swing lines meet on the handle side; window: inner frame; hole: nothing.
function drawOpeningGlyph(opening, tl, br) {
  var kind = openingKind(opening);
  ctx.strokeStyle = '#9aa1ab';
  ctx.lineWidth = 1;
  ctx.beginPath();

  if (kind === 'doorLeft' || kind === 'doorRight') {
    var hingeX = kind === 'doorLeft' ? br.x : tl.x;
    var freeX = kind === 'doorLeft' ? tl.x : br.x;
    ctx.moveTo(freeX, tl.y);
    ctx.lineTo(hingeX, (tl.y + br.y) / 2);
    ctx.lineTo(freeX, br.y);
  } else if (kind === 'window') {
    var inset = Math.min(6, (br.x - tl.x) / 6, (br.y - tl.y) / 6);
    ctx.rect(tl.x + inset, tl.y + inset, br.x - tl.x - inset * 2, br.y - tl.y - inset * 2);
    ctx.moveTo((tl.x + br.x) / 2, tl.y + inset);
    ctx.lineTo((tl.x + br.x) / 2, br.y - inset);
  }

  ctx.stroke();
}

function drawOpening(opening, selected) {
  var tl = worldToScreen(opening.x, opening.y + opening.h);
  var br = worldToScreen(opening.x + opening.w, opening.y);
  ctx.fillStyle = opening.solid ? '#d3d8de' : COLORS.background;
  ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

  if (opening.solid) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
    ctx.clip();
    ctx.strokeStyle = '#aab1bb';
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (var hx = tl.x - (br.y - tl.y); hx < br.x; hx += 10) {
      ctx.moveTo(hx, br.y);
      ctx.lineTo(hx + (br.y - tl.y), tl.y);
    }

    ctx.stroke();
    ctx.restore();
  }
  if (!opening.solid) {
    drawOpeningGlyph(opening, tl, br);
  }

  ctx.setLineDash([5, 3]);
  ctx.strokeStyle = selected ? COLORS.accent : COLORS.dim;
  ctx.lineWidth = 2;
  ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
  ctx.setLineDash([]);

  if (opening.label && elements.showLabels.checked) {
    drawLabel(opening.label, (tl.x + br.x) / 2, (tl.y + br.y) / 2);
  }
}

function drawCable(points, type, selected, circuit) {
  var screenPoints = [];

  for (var i = 0; i < points.length; i++) {
    screenPoints.push(worldToScreen(points[i].x, points[i].y));
  }

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  if (circuit) {
    var lineWidth = circuit.width || 3.5;

    if (selected) {
      strokePolyline(screenPoints, lineWidth + 5.5, COLORS.accent);
    }

    strokePolyline(screenPoints, lineWidth + 2.5, '#ffffff');
    strokePolyline(screenPoints, lineWidth, circuit.color);
  } else if (type.shape === 'flat') {
    drawFlatCable(screenPoints, type, selected);
  } else {
    if (selected) {
      strokePolyline(screenPoints, type.colors.length * 1.3 + 7, COLORS.accent);
    }

    strokePolyline(screenPoints, type.colors.length * 1.3 + 2, '#ffffff');

    for (var c = 0; c < type.colors.length; c++) {
      strokePolyline(screenPoints, (type.colors.length - c) * 1.3, type.colors[c]);
    }
  }

}

// Positions along a segment (cm from its start) where other cables, symbols or passages touch it.
function segmentSplits(a, b, surface, ownPoints) {
  var length = dist(a.x, a.y, b.x, b.y);
  var dirX = (b.x - a.x) / length;
  var dirY = (b.y - a.y) / length;
  var touches = [];
  var splits = [0, length];

  for (var c = 0; c < surface.cables.length; c++) {
    if (surface.cables[c].points !== ownPoints) {
      touches = touches.concat(surface.cables[c].points);
    }
  }

  touches = touches.concat(surface.symbols);

  if (ui.mode === 'wall') {
    touches = touches.concat(getSidePassages());
  }

  for (var i = 0; i < touches.length; i++) {
    var t = (touches[i].x - a.x) * dirX + (touches[i].y - a.y) * dirY;
    var off = Math.abs((touches[i].x - a.x) * dirY - (touches[i].y - a.y) * dirX);

    if (off < 0.5 && t > 0.5 && t < length - 0.5) {
      splits.push(t);
    }
  }

  return uniqueSorted(splits);
}

// Writes the cable lengths next to the cable, split at every connection point.
function drawSegmentLabels(points, surface, color) {
  for (var s = 1; s < points.length; s++) {
    var a = points[s - 1];
    var b = points[s];
    var length = dist(a.x, a.y, b.x, b.y);

    if (length < 0.5) {
      continue;
    }

    var splits = segmentSplits(a, b, surface, points);

    for (var k = 1; k < splits.length; k++) {
      var t1 = splits[k - 1];
      var t2 = splits[k];
      var from = worldToScreen(a.x + (b.x - a.x) * t1 / length, a.y + (b.y - a.y) * t1 / length);
      var to = worldToScreen(a.x + (b.x - a.x) * t2 / length, a.y + (b.y - a.y) * t2 / length);

      if (dist(from.x, from.y, to.x, to.y) < 28) {
        continue;
      }

      var horizontal = Math.abs(to.x - from.x) >= Math.abs(to.y - from.y);
      var span = Math.max(0.001, dist(from.x, from.y, to.x, to.y));
      drawLabel(Math.round(t2 - t1) + ' cm', (from.x + to.x) / 2, (from.y + to.y) / 2, color, (to.x - from.x) / span, (to.y - from.y) / span);
    }
  }
}

function strokePolyline(screenPoints, width, color) {
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.moveTo(screenPoints[0].x, screenPoints[0].y);

  for (var i = 1; i < screenPoints.length; i++) {
    ctx.lineTo(screenPoints[i].x, screenPoints[i].y);
  }

  ctx.stroke();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

var symbolSelected = false;

// Draws the plastic cover plate of a socket or switch with a soft shadow and a bevel.
function drawPlate(cx, cy, w, h) {
  var left = cx - w / 2;
  var top = cy - h / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 1.5;
  roundRectPath(left, top, w, h, 3.5);
  var gradient = ctx.createLinearGradient(left, top, left + w, top + h);
  gradient.addColorStop(0, '#ffffff');
  gradient.addColorStop(1, '#e6e8ec');
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.restore();
  roundRectPath(left, top, w, h, 3.5);
  ctx.strokeStyle = symbolSelected ? COLORS.accent : '#a9afb8';
  ctx.lineWidth = symbolSelected ? 2.5 : 1;
  ctx.stroke();
  roundRectPath(left + 1.4, top + 1.4, w - 2.8, h - 2.8, 2.6);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.lineWidth = 0.9;
  ctx.stroke();
}

// Draws one socket front: round recess, two pin holes and the earth pin at the top.
function drawSocketFace(cx, cy) {
  var recess = ctx.createRadialGradient(cx - 1.5, cy - 1.5, 1, cx, cy, 8);
  recess.addColorStop(0, '#f7f8f9');
  recess.addColorStop(1, '#c4c9d1');
  ctx.beginPath();
  ctx.arc(cx, cy, 7.6, 0, Math.PI * 2);
  ctx.fillStyle = recess;
  ctx.fill();
  ctx.strokeStyle = '#9097a2';
  ctx.lineWidth = 0.9;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 6.3, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  for (var side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.arc(cx + side * 3, cy + 0.9, 1.55, 0, Math.PI * 2);
    ctx.fillStyle = '#23272e';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + side * 3 - 0.4, cy + 0.5, 0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fill();
  }

  var pin = ctx.createLinearGradient(cx - 1.1, 0, cx + 1.1, 0);
  pin.addColorStop(0, '#fafafa');
  pin.addColorStop(0.5, '#c9ced6');
  pin.addColorStop(1, '#8d949e');
  roundRectPath(cx - 1.1, cy - 6.9, 2.2, 3.8, 1);
  ctx.fillStyle = pin;
  ctx.fill();
  ctx.strokeStyle = '#6f7680';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}
// Symbols grow with the zoom; at the usual wall view they have their basic size.
function symbolScale() {
  return clamp(view.scale / 1.8, 0.6, 4);
}

// A double socket keeps both sockets upright; only the plate and their arrangement turn.
function drawDoubleSocket(selected, rotation) {
  var angle = rotation * Math.PI / 180;
  ctx.lineWidth = selected ? 2.5 : 1.5;
  ctx.strokeStyle = selected ? COLORS.accent : '#4b5563';
  ctx.save();
  ctx.rotate(angle);
  drawPlate(0, 0, 40, 22);
  ctx.restore();
  drawSocketFace(-9 * Math.cos(angle), -9 * Math.sin(angle));
  drawSocketFace(9 * Math.cos(angle), 9 * Math.sin(angle));
}

var symbolCircuitColor = null;

function drawSymbol(type, x, y, selected, rotation, circuitId) {
  symbolCircuitColor = getCircuitColor(circuitId);
  var screen = worldToScreen(x, y);
  var k = symbolScale();
  ctx.save();
  ctx.translate(screen.x, screen.y);
  ctx.scale(k, k);
  symbolSelected = Boolean(selected);

  if (type === 'socket2') {
    drawDoubleSocket(selected, rotation || 0);
    ctx.restore();
    return;
  }

  ctx.rotate((rotation || 0) * Math.PI / 180);
  drawSymbolShape(type, selected);
  ctx.restore();
}

function strokeCircle(radius, fillColor) {
  ctx.fillStyle = fillColor;
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

// Draws the less common symbols around the origin; returns false for other types.
function drawExtraSymbol(type, outline) {
  ctx.strokeStyle = outline;

  if (type === 'socket400') {
    drawPlate(0, 0, 24, 24);
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 1;
    strokeCircle(8.5, '#f8d4d4');
    ctx.fillStyle = '#374151';
    var pins = [[0, -5], [4.8, -1.5], [3, 4], [-3, 4], [-4.8, -1.5]];

    for (var i = 0; i < pins.length; i++) {
      ctx.beginPath();
      ctx.arc(pins[i][0], pins[i][1], 1.3, 0, Math.PI * 2);
      ctx.fill();
    }

    return true;
  }

  if (type === 'socketOut') {
    roundRectPath(-12, -12, 24, 24, 3);
    ctx.fillStyle = '#cbd5e1';
    ctx.fill();
    ctx.stroke();
    drawSocketFace(0, -2);
    ctx.fillStyle = '#1f2937';
    ctx.font = 'bold 7px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('IP44', 0, 8);
    return true;
  }

  if (type === 'data') {
    drawPlate(0, 0, 22, 22);
    ctx.fillStyle = '#374151';
    ctx.fillRect(-6, -4, 12, 9);
    ctx.fillStyle = '#e5e7eb';

    for (var k = 0; k < 6; k++) {
      ctx.fillRect(-4.5 + k * 1.8, -3, 0.9, 4);
    }

    return true;
  }

  if (type === 'tv') {
    drawPlate(0, 0, 22, 22);
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 1;
    strokeCircle(6.5, '#9ca3af');
    strokeCircle(2.2, '#374151');
    return true;
  }

  if (type === 'bell') {
    strokeCircle(11, '#fbfbf8');
    ctx.fillStyle = '#d4a017';
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, -1, 5, Math.PI, 0);
    ctx.lineTo(6, 4);
    ctx.lineTo(-6, 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#92400e';
    ctx.beginPath();
    ctx.arc(0, 6, 1.6, 0, Math.PI * 2);
    ctx.fill();
    return true;
  }

  if (type === 'thermostat') {
    drawPlate(0, 0, 22, 22);
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 1;
    strokeCircle(6.5, '#e5e7eb');
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(3.5, -4.5);
    ctx.stroke();
    return true;
  }

  if (type === 'motion') {
    strokeCircle(10, '#f3f4f6');
    ctx.fillStyle = '#374151';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 1;

    for (var r = 5.5; r <= 8; r += 2.5) {
      ctx.beginPath();
      ctx.arc(0, 0, r, -Math.PI * 0.8, -Math.PI * 0.2);
      ctx.stroke();
    }

    return true;
  }

  if (type === 'smoke') {
    strokeCircle(10, '#ffffff');
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 1;
    strokeCircle(6, '#ffffff');
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(0, 0, 1.6, 0, Math.PI * 2);
    ctx.fill();
    return true;
  }

  if (type === 'dimmer') {
    drawPlate(0, 0, 22, 22);
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 1;
    strokeCircle(6.5, '#e5e7eb');
    ctx.strokeStyle = '#374151';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(0, -1);
    ctx.lineTo(0, -5.5);
    ctx.stroke();
    return true;
  }

  if (type === 'blinds') {
    drawPlate(0, 0, 22, 22);
    ctx.fillStyle = '#374151';
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(-5, -1.5);
    ctx.lineTo(5, -1.5);
    ctx.closePath();
    ctx.moveTo(0, 8);
    ctx.lineTo(-5, 1.5);
    ctx.lineTo(5, 1.5);
    ctx.closePath();
    ctx.fill();
    return true;
  }

  if (type === 'outlet') {
    ctx.setLineDash([3, 2]);
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#374151';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    return true;
  }

  return false;
}

function drawSwitch() {
  drawPlate(0, 0, 22, 22);
  var rocker = ctx.createLinearGradient(0, -8.5, 0, 8.5);
  rocker.addColorStop(0, '#ffffff');
  rocker.addColorStop(0.5, '#eceef1');
  rocker.addColorStop(1, '#cfd3d9');
  roundRectPath(-6.5, -8.5, 13, 17, 2.4);
  ctx.fillStyle = rocker;
  ctx.fill();
  ctx.strokeStyle = '#9aa1ab';
  ctx.lineWidth = 0.9;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-5.2, 0);
  ctx.lineTo(5.2, 0);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-5.2, 0.9);
  ctx.lineTo(5.2, 0.9);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.stroke();
}

// Double switch: one plate with two narrow rockers.
function drawDoubleSwitch() {
  drawPlate(0, 0, 22, 22);

  for (var i = 0; i < 2; i++) {
    var left = i === 0 ? -7 : 0.5;
    roundRectPath(left, -8.5, 6.5, 17, 1.8);
    ctx.fillStyle = '#f3f4f6';
    ctx.fill();
    ctx.strokeStyle = '#9aa1ab';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(left + 1, 0);
    ctx.lineTo(left + 5.5, 0);
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.stroke();
  }
}

// Ceiling light: white base ring with a glowing glass dome.
function drawLamp() {
  var base = ctx.createRadialGradient(-2, -2, 2, 0, 0, 12);
  base.addColorStop(0, '#ffffff');
  base.addColorStop(1, '#cfd3d9');
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 11.5, 0, Math.PI * 2);
  ctx.fillStyle = base;
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(0, 0, 11.5, 0, Math.PI * 2);
  ctx.strokeStyle = symbolSelected ? COLORS.accent : '#9aa1ab';
  ctx.lineWidth = symbolSelected ? 2.5 : 1;
  ctx.stroke();
  var glow = ctx.createRadialGradient(-1.5, -1.5, 1, 0, 0, 8);
  glow.addColorStop(0, '#fffde8');
  glow.addColorStop(0.55, '#ffe58a');
  glow.addColorStop(1, '#f0b43c');
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();
  ctx.strokeStyle = '#c8922a';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 5.6, Math.PI * 1.1, Math.PI * 1.6);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
}

// Distribution board: grey cabinet with two rows of circuit breakers on DIN rails.
function drawBoard() {
  var left = -13;
  var top = -16;
  var width = 26;
  var height = 32;
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 1.5;
  roundRectPath(left, top, width, height, 2.5);
  var frame = ctx.createLinearGradient(left, top, left + width, top + height);
  frame.addColorStop(0, '#f4f5f7');
  frame.addColorStop(1, '#c9cdd4');
  ctx.fillStyle = frame;
  ctx.fill();
  ctx.restore();
  roundRectPath(left, top, width, height, 2.5);
  ctx.strokeStyle = symbolSelected ? COLORS.accent : '#8f96a1';
  ctx.lineWidth = symbolSelected ? 2.5 : 1;
  ctx.stroke();
  roundRectPath(left + 2.5, top + 2.5, width - 5, height - 5, 1.5);
  ctx.fillStyle = '#dfe3e8';
  ctx.fill();
  ctx.strokeStyle = '#aab0b9';
  ctx.lineWidth = 0.6;
  ctx.stroke();

  for (var row = 0; row < 2; row++) {
    var y = top + 5 + row * 13;
    ctx.fillStyle = '#9aa1ab';
    ctx.fillRect(left + 3.2, y + 4.2, width - 6.4, 0.9);

    for (var col = 0; col < 5; col++) {
      var x = left + 4.2 + col * 3.7;
      var circuit = state.circuits[row * 5 + col];
      roundRectPath(x, y, 3.2, 9, 0.6);
      ctx.fillStyle = circuit ? '#fdfdfd' : '#e6e9ed';
      ctx.fill();
      ctx.strokeStyle = '#8f96a1';
      ctx.lineWidth = 0.5;
      ctx.stroke();

      if (circuit) {
        ctx.fillStyle = circuit.color;
        ctx.fillRect(x + 0.3, y + 0.3, 2.6, 1.4);
        ctx.fillStyle = '#2b2f36';
        ctx.fillRect(x + 0.7, y + 2.6, 1.8, 2.6);
      }
    }
  }
}

// Round installation box with a cable entry and two fixing screws.
function drawJunctionBox() {
  var body = ctx.createRadialGradient(-2, -2, 2, 0, 0, 10);
  body.addColorStop(0, '#f6f7f9');
  body.addColorStop(1, '#c1c6ce');
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
  ctx.strokeStyle = symbolSelected ? COLORS.accent : '#9aa1ab';
  ctx.lineWidth = symbolSelected ? 2.5 : 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 6.2, 0, Math.PI * 2);
  ctx.fillStyle = '#d3d7dd';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  for (var side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.arc(side * 7.4, 0, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = '#7d848f';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#4a4f57';
  ctx.fill();
}

// Hole through the wall: dark opening with a sleeve around it.
function drawPassage() {
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#d9dde3';
  ctx.fill();
