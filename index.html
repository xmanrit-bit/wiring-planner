  ctx.strokeStyle = symbolSelected ? COLORS.accent : '#7d848f';
  ctx.lineWidth = symbolSelected ? 2.5 : 1.2;
  ctx.stroke();
  var hole = ctx.createRadialGradient(-1, -1, 0.5, 0, 0, 5.5);
  hole.addColorStop(0, '#5a606a');
  hole.addColorStop(1, '#1f2329');
  ctx.beginPath();
  ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = hole;
  ctx.fill();
}

// DIN rail module: white body, circuit color on top, black lever; the RCD is wider with a test button.
function drawBreaker(isRcd) {
  var width = isRcd ? 22 : 11;
  var height = 22;
  var left = -width / 2;
  var top = -height / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 1;
  roundRectPath(left, top, width, height, 1.5);
  var body = ctx.createLinearGradient(left, top, left + width, top + height);
  body.addColorStop(0, '#ffffff');
  body.addColorStop(1, '#e3e6ea');
  ctx.fillStyle = body;
  ctx.fill();
  ctx.restore();
  roundRectPath(left, top, width, height, 1.5);
  ctx.strokeStyle = symbolSelected ? COLORS.accent : '#8f96a1';
  ctx.lineWidth = symbolSelected ? 2.5 : 1;
  ctx.stroke();
  ctx.fillStyle = symbolCircuitColor || '#c9ced6';
  ctx.fillRect(left + 1, top + 1, width - 2, 3.4);
  var leverX = isRcd ? -7 : -2.5;
  ctx.fillStyle = '#2b2f36';
  ctx.fillRect(leverX, -3.5, 5, 7.5);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.fillRect(leverX + 0.8, -2.8, 1.2, 6);

  if (isRcd) {
    ctx.beginPath();
    ctx.arc(5.5, 0.5, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = '#f0b43c';
    ctx.fill();
    ctx.strokeStyle = '#a87a1c';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  ctx.fillStyle = '#f1f3f5';
  ctx.fillRect(left + 1.5, top + height - 5, width - 3, 3.2);
  ctx.strokeStyle = '#c3c8cf';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(left + 1.5, top + height - 5, width - 3, 3.2);
}

function drawSymbolShape(type, selected) {
  var outline = selected ? COLORS.accent : '#6b7280';
  ctx.lineWidth = selected ? 2.5 : 1.2;
  ctx.strokeStyle = outline;

  if (type === 'socket') {
    drawPlate(0, 0, 22, 22);
    drawSocketFace(0, 0);
    return;
  }

  if (type === 'switch') {
    drawSwitch();
    return;
  }

  if (type === 'switch2') {
    drawDoubleSwitch();
    return;
  }

  if (isCustomType(type)) {
    drawPlate(0, 0, 22, 22);
    ctx.strokeRect(-7, -7, 14, 14);
    return;
  }

  if (type === 'light') {
    drawLamp();
    return;
  }

  if (type === 'passage') {
    drawPassage();
    return;
  }

  if (type === 'breaker' || type === 'rcd') {
    drawBreaker(type === 'rcd');
    return;
  }

  if (type === 'board') {
    drawBoard();
    return;
  }

  if (drawExtraSymbol(type, outline)) {
    return;
  }

  drawJunctionBox();
}
// ---------- Toolbar and sidebar ----------

function addToolButtonLabel(tool, label) {
  var button = createElement('button', 'tool-button', label);
  button.dataset.tool = tool;
  button.addEventListener('click', function () { setTool(tool); });
  elements.toolbar.appendChild(button);
}

function addToolButton(tool, textKey) {
  addToolButtonLabel(tool, TEXTS[textKey]);
}

// Button that centres the drawing and fits it into the window.
function addFitButton() {
  var fit = createElement('button', 'tool-button', TEXTS.fitView);
  fit.addEventListener('click', function () {
    if (ui.mode === '3d') {
      reset3dCamera();
    }

    cameras[ui.mode] = null;
    render();
  });
  elements.toolbar.appendChild(fit);
}

function buildToolbar() {
  elements.toolbar.textContent = '';

  if (ui.mode === 'plan') {
    addToolButton('select', 'toolSelect');
    addToolButton('addWall', 'toolAddWall');
    addFitButton();
    elements.toolbar.appendChild(createElement('div', 'toolbar-separator'));
    var ceilingButton = createElement('button', 'tool-button', TEXTS.toolCeiling);
    ceilingButton.addEventListener('click', openCeiling);
    elements.toolbar.appendChild(ceilingButton);
    var view3dButton = createElement('button', 'tool-button', TEXTS.tool3d);
    view3dButton.addEventListener('click', open3d);
    elements.toolbar.appendChild(view3dButton);
  } else if (ui.mode === '3d') {
    var back3d = createElement('button', 'tool-button', TEXTS.toolBack);
    back3d.addEventListener('click', backToPlan);
    elements.toolbar.appendChild(back3d);
    addFitButton();
  } else {
    var back = createElement('button', 'tool-button', TEXTS.toolBack);
    back.addEventListener('click', backToPlan);
    elements.toolbar.appendChild(back);
    addFitButton();

    if (ui.mode === 'wall') {
      var otherSide = createElement('button', 'tool-button', ui.activeSide === 'back' ? TEXTS.switchToA : TEXTS.switchToB);
      otherSide.addEventListener('click', function () { openWall(ui.activeWallId, ui.activeSide === 'back' ? 'front' : 'back'); });
      elements.toolbar.appendChild(otherSide);
    }
    elements.toolbar.appendChild(createElement('div', 'toolbar-separator'));
    addToolButton('select', 'toolSelect');

    if (ui.mode === 'wall') {
      addToolButton('door', 'toolDoor');
      addToolButton('window', 'toolWindow');
      addToolButton('hole', 'toolHole');
    }

    if (ui.mode === 'wall') {
      addToolButton('beam', 'toolBeam');
    }

    elements.toolbar.appendChild(createElement('div', 'toolbar-separator'));

    var moreSymbols = [];

    for (var s = 0; s < SYMBOL_TYPES.length; s++) {
      if (isPinned(SYMBOL_TYPES[s].id)) {
        addToolButton(SYMBOL_TYPES[s].id, SYMBOL_TYPES[s].textKey);
      } else {
        moreSymbols.push({ id: SYMBOL_TYPES[s].id, label: TEXTS[SYMBOL_TYPES[s].textKey] });
      }
    }

    addMoreSelect(moreSymbols, 'moreSymbols');

    elements.toolbar.appendChild(createElement('div', 'toolbar-separator'));

    if (state.circuits.length > 0) {
      for (var k = 0; k < state.circuits.length; k++) {
        addCircuitToolButton(state.circuits[k]);
      }

      elements.toolbar.appendChild(createElement('div', 'toolbar-separator'));
    }

    var moreCables = [];

    for (var c = 0; c < state.cableTypes.length; c++) {
      if (isPinned(state.cableTypes[c].id)) {
        addToolButtonLabel(state.cableTypes[c].id, state.cableTypes[c].name);
      } else {
        moreCables.push({ id: state.cableTypes[c].id, label: state.cableTypes[c].name });
      }
    }

    addMoreSelect(moreCables, 'moreCables');

    var typesButton = createElement('button', 'tool-button', TEXTS.toolCableTypes);
    typesButton.addEventListener('click', openTypesDialog);
    elements.toolbar.appendChild(typesButton);
    elements.toolbar.appendChild(createElement('div', 'toolbar-separator'));
    var circuitsButton = createElement('button', 'tool-button', TEXTS.toolCircuits);
    circuitsButton.addEventListener('click', openCircuitsDialog);
    elements.toolbar.appendChild(circuitsButton);
    var paletteButton = createElement('button', 'tool-button', TEXTS.toolPalette);
    paletteButton.addEventListener('click', openPaletteDialog);
    elements.toolbar.appendChild(paletteButton);
  }

  updateToolbarActive();
}

function updateToolbarActive() {
  var buttons = elements.toolbar.querySelectorAll('.tool-button');

  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.toggle('active', buttons[i].dataset.tool === ui.tool);
  }

  var selects = elements.toolbar.querySelectorAll('.more-select');

  for (var s = 0; s < selects.length; s++) {
    selects[s].value = selects[s].querySelector('option[value="' + ui.tool + '"]') ? ui.tool : '';
  }
}

// Dropdown with the tools that are not pinned to the toolbar.
function addMoreSelect(items, textKey) {
  if (items.length === 0) {
    return;
  }

  var select = createElement('select', 'field-input more-select');
  var placeholder = createElement('option', '', TEXTS[textKey]);
  placeholder.value = '';
  select.appendChild(placeholder);

  for (var i = 0; i < items.length; i++) {
    var option = createElement('option', '', items[i].label);
    option.value = items[i].id;
    select.appendChild(option);
  }

  select.addEventListener('change', function () {
    if (select.value !== '') {
      setTool(select.value);
    }
  });
  elements.toolbar.appendChild(select);
}

// ---------- Palette settings and panel sizes ----------

var DEFAULT_PINNED = ['socket', 'socket2', 'switch', 'switch2', 'light', 'board', 'breaker', 'rcd', 'box'];
var palettePrefs = {};

function loadPalettePrefs() {
  try {
    palettePrefs = JSON.parse(localStorage.getItem('byt-palette') || '{}') || {};
  } catch (error) {
    palettePrefs = {};
  }
}

function savePalettePrefs() {
  try {
    localStorage.setItem('byt-palette', JSON.stringify(palettePrefs));
  } catch (error) {
    // Storage is not available.
  }
}

// A tool is pinned when the user chose so; by default the common symbols and all cables are.
function isPinned(id) {
  if (palettePrefs[id] !== undefined) {
    return palettePrefs[id];
  }

  return DEFAULT_PINNED.indexOf(id) >= 0 || getCableTypeStrict(id) !== null || isCustomType(id);
}

function addPaletteRow(list, id, label) {
  var row = createElement('label', 'palette-row');
  var box = createElement('input');
  box.type = 'checkbox';
  box.checked = isPinned(id);
  box.addEventListener('change', function () {
    palettePrefs[id] = box.checked;
    savePalettePrefs();
  });
  row.appendChild(box);
  row.appendChild(createElement('span', '', label));
  list.appendChild(row);
}

function renderPaletteDialog() {
  var list = elements.paletteList;
  list.textContent = '';
  list.appendChild(createElement('h3', 'side-title', TEXTS.paletteSymbols));

  for (var s = 0; s < SYMBOL_TYPES.length; s++) {
    addPaletteRow(list, SYMBOL_TYPES[s].id, TEXTS[SYMBOL_TYPES[s].textKey]);
  }

  addCustomTypeRow(list);
  list.appendChild(createElement('h3', 'side-title', TEXTS.paletteCables));

  for (var c = 0; c < state.cableTypes.length; c++) {
    addPaletteRow(list, state.cableTypes[c].id, state.cableTypes[c].name);
  }
}

// Field and button to add an own element; it is drawn as a plain square.
function addCustomTypeRow(list) {
  var row = createElement('div', 'custom-type-row');
  var input = createElement('input', 'field-input');
  input.type = 'text';
  input.placeholder = TEXTS.customTypeName;
  var button = createElement('button', '', TEXTS.customTypeAdd);
  button.addEventListener('click', function () {
    var name = input.value.trim();

    if (!name) {
      return;
    }

    state.customTypes = state.customTypes || [];
    state.customTypes.push({ id: 'custom-' + newId(), name: name });
    registerCustomTypes();
    markChanged();
    renderPaletteDialog();
  });
  row.appendChild(input);
  row.appendChild(button);
  list.appendChild(row);
}

function isCustomType(type) {
  return String(type).indexOf('custom-') === 0;
}

// Adds the user's own elements to the list of symbol types.
function registerCustomTypes() {
  for (var i = SYMBOL_TYPES.length - 1; i >= 0; i--) {
    if (SYMBOL_TYPES[i].custom) {
      SYMBOL_TYPES.splice(i, 1);
    }
  }

  var custom = state.customTypes || [];

  for (var c = 0; c < custom.length; c++) {

}

// Lets the user drag a splitter to change the width of a side panel.
function setupSplitter(splitterId, panel, cssVar, direction, storageKey) {
  var splitter = document.getElementById(splitterId);
  var startX = 0;
  var startWidth = 0;
  var active = false;

  try {
    var stored = parseFloat(localStorage.getItem(storageKey));

    if (stored >= 100) {
      document.documentElement.style.setProperty(cssVar, stored + 'px');
    }
  } catch (error) {
    // Storage is not available.
  }

  splitter.addEventListener('pointerdown', function (event) {
    active = true;
    startX = event.clientX;
    startWidth = panel.getBoundingClientRect().width;
    splitter.setPointerCapture(event.pointerId);
  });
  splitter.addEventListener('pointermove', function (event) {
    if (!active) {
      return;
    }

    var width = clamp(startWidth + direction * (event.clientX - startX), 100, 560);
    document.documentElement.style.setProperty(cssVar, width + 'px');
    resizeCanvas();
  });
  splitter.addEventListener('pointerup', function () {
    active = false;

    try {
      localStorage.setItem(storageKey, String(Math.round(panel.getBoundingClientRect().width)));
    } catch (error) {
      // Storage is not available.
    }
  });
}

function addNumberField(parent, label, value, onChange) {
  var row = createElement('label', 'field');
  row.appendChild(createElement('span', 'field-label', label));
  var input = createElement('input', 'field-input');
  input.type = 'number';
  input.step = 'any';
  input.value = roundTo(value, 1);
  var commit = function () {
    var parsed = parseFloat(input.value);

    if (!isNaN(parsed)) {
      onChange(parsed);
    }
  };
  input.addEventListener('change', commit);
  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      commit();
    }
  });
  row.appendChild(input);
  parent.appendChild(row);
}

function getHintText() {
  if (ui.mode === '3d') {
    return TEXTS.hint3d;
  }

  if (ui.mode === 'plan') {
    return ui.tool === 'addWall' ? TEXTS.hintPlanAdd : TEXTS.hintPlanSelect;
  }

  if (isOpeningTool(ui.tool) || ui.tool === 'beam') {
    return TEXTS.hintOpening;
  }

  if (isSymbolTool(ui.tool)) {
    return TEXTS.hintSymbol;
  }

  if (isCableTool(ui.tool)) {
    return TEXTS.hintCable;
  }

  return TEXTS.hintWallSelect;
}

function renderSidebar() {
  var props = elements.props;
  props.textContent = '';

  if (ui.multi.length > 0) {
    props.appendChild(createElement('h3', 'side-title', formatText('multiSelected', { n: ui.multi.length })));
    addButton(props, TEXTS.deleteItem, deleteSelected);
    elements.hint.textContent = getHintText();
    updateTotals();
    return;
  }

  if (ui.mode !== 'ceiling' && !ui.selected) {
    addWallColorField(props);
  }

  if (ui.mode === '3d') {
    elements.modeTitle.textContent = TEXTS.mode3d;
    add3dItemProps(props);
  } else if (ui.mode === 'plan') {
    elements.modeTitle.textContent = TEXTS.modePlan;
    addNumberField(props, TEXTS.wallHeight, state.wallHeight, function (value) {
      if (value >= 50) {
        state.wallHeight = value;
        markChanged();
        render();
      }
    });

    var wall = ui.selected && ui.selected.kind === 'wall' ? getWall(ui.selected.id) : null;

    if (wall) {
      props.appendChild(createElement('h3', 'side-title', formatText('wallLabel', { n: wall.number })));
      addNumberField(props, TEXTS.wallLength, wallLength(wall), function (value) {
        setWallLength(wall, value, chooseMovingEnd(wall));
        markChanged();
        render();
        renderSidebar();
        statusPinnedUntil = Date.now() + 3000;
        setStatus(formatText('statusLengthSet', { len: roundTo(wallLength(wall), 1) }));
      });
      addMoveEndSelect(props, wall);
      addNumberField(props, TEXTS.wallThickness, wall.thickness, function (value) {
        if (value >= 1) {
          wall.thickness = value;
          markChanged();
          render();
        }
      });
      addButton(props, TEXTS.openWall, function () { openWall(wall.id, 'front'); });
      addButton(props, TEXTS.openWallBack, function () { openWall(wall.id, 'back'); });
      addButton(props, TEXTS.deleteItem, deleteSelected);
    }
  } else {
    renderWallProps(props);
  }

  elements.hint.textContent = getHintText();
  updateTotals();
}

function renderWallProps(props) {
  var wall = getActiveSurface();
  elements.modeTitle.textContent = ui.mode === 'ceiling' ? TEXTS.modeCeiling : formatText(wall.isBack ? 'modeWallBack' : 'modeWall', { n: wall.number });

  if (!ui.selected) {
    return;
  }

  var item = findItem(wall, ui.selected);

  if (!item) {
    return;
  }

  if (ui.selected.kind === 'symbol' && !item.circuitId && attachedCircuitId(item)) {
    item.circuitId = attachedCircuitId(item);
    markChanged();
  }

  var title = item.solid ? TEXTS.toolBeam : TEXTS.openingLabel;

  if (ui.selected.kind === 'passage') {
    title = TEXTS.toolPassage;
  } else if (ui.selected.kind === 'symbol') {
    title = TEXTS[SYMBOL_TYPES[symbolIndex(item.type)].textKey];
  } else if (ui.selected.kind === 'cable') {
    title = getCableType(item.typeId).name;
  }

  props.appendChild(createElement('h3', 'side-title', title));

  addLabelField(props, item);

  if (ui.selected.kind !== 'opening' && ui.selected.kind !== 'passage') {
    addCircuitSelect(props, item);
  }

  if (ui.selected.kind === 'symbol') {
    addButton(props, TEXTS.rotateSymbol, rotateSelected);

    if (item.type === 'breaker' || item.type === 'rcd') {
      addRatingSelect(props, item);
    }

    if (item.type === 'board') {
      addBoardBreakers(props);
    }

    if (ui.mode === 'ceiling') {
      addCeilingSymbolFields(props, item);
    } else {
      addSymbolFields(props, wall, item);
    }
  } else if (ui.selected.kind === 'opening') {
    addOpeningFields(props, wall, item);
  }

  if (ui.selected.kind === 'cable') {
    props.appendChild(createElement('div', 'field-label', formatText('cableLength', { len: Math.round(cableLength(item)) })));
    addCableTypeSelect(props, item);
    addNumberField(props, TEXTS.cableExtra, item.extra || 0, function (value) {
      item.extra = Math.max(0, value);

    });

}

function fillOptions(select, options, value) {
  var all = options.slice();

  if (value && all.indexOf(value) < 0) {
    all.unshift(value);
  }

  for (var i = 0; i < all.length; i++) {
    var option = createElement('option', '', all[i] === '' ? TEXTS.circuitNone : all[i]);
    option.value = all[i];
    select.appendChild(option);
  }

  select.value = value || '';
}

// Value of a breaker or RCD: from its circuit, otherwise stored on the symbol.
function symbolRating(symbol) {
  var circuit = getCircuit(attachedCircuitId(symbol));
  var key = symbol.type === 'rcd' ? 'rcd' : 'breaker';

  if (circuit) {
    return circuit[key] || '';
  }

  return symbol.rating || (symbol.type === 'rcd' ? '30 mA' : 'B16');
}

function addRatingSelect(props, item) {
  var isRcd = item.type === 'rcd';

  select.addEventListener('change', function () {
    var circuit = getCircuit(item.circuitId);

    if (circuit) {
      circuit[isRcd ? 'rcd' : 'breaker'] = select.value;

// Number fields to set the exact position of a symbol.
function addSymbolFields(props, wall, item) {
  var length = wallLength(wall);
  var height = state.wallHeight;
  addNumberField(props, TEXTS.distLeft, item.x, function (value) {
    moveSymbolTo(item, clamp(value, 0, length), item.y);
    applyItemChange();
  });
  addNumberField(props, TEXTS.distRight, length - item.x, function (value) {
    moveSymbolTo(item, clamp(length - value, 0, length), item.y);
    applyItemChange();
  });
  addNumberField(props, TEXTS.distFloor, item.y, function (value) {
    moveSymbolTo(item, item.x, clamp(value, 0, height));
    applyItemChange();
  });
  addNumberField(props, TEXTS.distCeiling, height - item.y, function (value) {
    moveSymbolTo(item, item.x, clamp(height - value, 0, height));
    applyItemChange();
  });
}

// Number fields to set the distance of a ceiling symbol to the nearest walls.
function addCeilingSymbolFields(props, item) {
  var fields = [
    { textKey: 'distWallLeft', dx: -1, dy: 0 },
    { textKey: 'distWallRight', dx: 1, dy: 0 },
    { textKey: 'distWallTop', dx: 0, dy: -1 },
    { textKey: 'distWallBottom', dx: 0, dy: 1 }
  ];

  for (var i = 0; i < fields.length; i++) {
    addCeilingDistanceField(props, item, fields[i]);
  }
}

function addCeilingDistanceField(props, item, field) {
  var hit = rayHit(item.x, item.y, field.dx, field.dy);

  if (!hit) {
    return;
  }

  addNumberField(props, TEXTS[field.textKey], hit.distance, function (value) {
    var target = rayHit(item.x, item.y, field.dx, field.dy);

    if (!target) {
      return;
    }

    moveSymbolTo(item, target.x - field.dx * value, target.y - field.dy * value);
    applyItemChange();
  });
}

// Tools that draw a through opening and the opening type each one creates.
var OPENING_TOOLS = { opening: 'doorLeft', door: 'doorLeft', window: 'window', hole: 'hole' };

function isOpeningTool(tool) {
  return Object.prototype.hasOwnProperty.call(OPENING_TOOLS, tool);
}

// Through openings of both sides in side A coordinates; doors drawn from side B swap their hinge side.
function throughOpenings(wall) {
  var length = wallLength(wall);
  var list = wall.openings.filter(function (opening) { return !opening.solid; });
  var back = wall.back ? (wall.back.openings || []) : [];
  var swap = { doorLeft: 'doorRight', doorRight: 'doorLeft' };

  for (var i = 0; i < back.length; i++) {
    var opening = back[i];

    if (!opening.solid) {
      var kind = openingKind(opening);
      list.push({ x: length - opening.x - opening.w, y: opening.y, w: opening.w, h: opening.h, label: opening.label, kind: swap[kind] || kind, item: opening });
    }
  }

  return list;
}

// Type of a through opening; old data without a type is a door at the floor, otherwise a window.
function openingKind(opening) {
  if (opening.kind) {
    return opening.kind;
  }

  return opening.y < 5 ? 'doorLeft' : 'window';
}

// Select to choose a left or right door, a window or a plain hole.
function addOpeningKindSelect(props, item) {
  var row = createElement('label', 'field');
  row.appendChild(createElement('span', 'field-label', TEXTS.openingKind));
  var select = createElement('select', 'field-input');
  var choices = [['doorLeft', TEXTS.openingDoorLeft], ['doorRight', TEXTS.openingDoorRight], ['window', TEXTS.openingWindow], ['hole', TEXTS.openingHole]];

  for (var i = 0; i < choices.length; i++) {
    var option = createElement('option', '', choices[i][1]);
    option.value = choices[i][0];
    select.appendChild(option);
  }

  select.value = openingKind(item);
  select.addEventListener('change', function () {
    item.kind = select.value;
    applyItemChange();
  });
  row.appendChild(select);
  props.appendChild(row);
}

// Number fields to set the exact position and size of a door or window.
function addOpeningFields(props, wall, item) {
  if (!item.solid) {
    addOpeningKindSelect(props, item);
  }

  var length = wallLength(wall);
  var height = state.wallHeight;
  addNumberField(props, TEXTS.distLeft, item.x, function (value) {
    item.x = clamp(value, 0, Math.max(0, length - item.w));
    applyItemChange();
  });
  addNumberField(props, TEXTS.distFloor, item.y, function (value) {
    item.y = clamp(value, 0, Math.max(0, height - item.h));
    applyItemChange();
  });
  addNumberField(props, TEXTS.openingWidth, item.w, function (value) {
    item.w = clamp(value, 1, Math.max(1, length - item.x));
    applyItemChange();
  });
  addNumberField(props, TEXTS.openingHeight, item.h, function (value) {
    item.h = clamp(value, 1, Math.max(1, height - item.y));
    applyItemChange();
  });
}

// ---------- Material list ----------

// Builds the rows of the material list: cables, items, breakers and RCDs.
function buildMaterialRows() {
  var rows = [];
  var totals = totalsFor(getAllSurfaces());

  for (var t = 0; t < state.cableTypes.length; t++) {
    var cm = totals.byType[state.cableTypes[t].id];

    if (cm) {
      rows.push({ group: TEXTS.materialCables, name: state.cableTypes[t].name, qty: (cm / 100).toFixed(2).replace('.', ','), unit: 'm' });
    }
  }

  for (var s = 0; s < SYMBOL_TYPES.length; s++) {
    var count = totals.symbols[SYMBOL_TYPES[s].id];

    if (count && SYMBOL_TYPES[s].id !== 'breaker' && SYMBOL_TYPES[s].id !== 'rcd') {
      rows.push({ group: TEXTS.materialItems, name: TEXTS[SYMBOL_TYPES[s].textKey], qty: String(count), unit: TEXTS.unitPieces });
    }
  }

  var breakers = {};
  var breakerOrder = [];
  var rcds = [];

  for (var c = 0; c < state.circuits.length; c++) {
    var breaker = state.circuits[c].breaker;
    var rcd = state.circuits[c].rcd;

    if (breaker) {
      if (!breakers[breaker]) {
        breakers[breaker] = 0;
        breakerOrder.push(breaker);
      }

      breakers[breaker] = breakers[breaker] + 1;
    }

    if (rcd && rcds.indexOf(rcd) < 0) {
      rcds.push(rcd);
    }
  }

  var allSurfaces = getAllSurfaces();

  for (var sf = 0; sf < allSurfaces.length; sf++) {
    for (var sy = 0; sy < allSurfaces[sf].symbols.length; sy++) {
      var placed = allSurfaces[sf].symbols[sy];

      if (placed.type === 'breaker' && !getCircuit(placed.circuitId)) {
        var rating = symbolRating(placed);

        if (!breakers[rating]) {
          breakers[rating] = 0;
          breakerOrder.push(rating);
        }

        breakers[rating] = breakers[rating] + 1;
      }
    }
  }

  for (var b = 0; b < breakerOrder.length; b++) {
    rows.push({ group: TEXTS.materialBreakers, name: formatText('materialBreakerName', { name: breakerOrder[b] }), qty: String(breakers[breakerOrder[b]]), unit: TEXTS.unitPieces });
  }

  for (var r = 0; r < rcds.length; r++) {
    rows.push({ group: TEXTS.materialRcds, name: rcds[r], qty: '1', unit: TEXTS.unitPieces });
  }

  return rows;
}

function renderMaterialDialog() {
  var list = elements.materialList;
  list.textContent = '';
  var rows = buildMaterialRows();

  if (rows.length === 0) {
    list.appendChild(createElement('div', 'hint', TEXTS.materialEmpty));
    return;
  }

  var group = '';

  for (var i = 0; i < rows.length; i++) {
    if (rows[i].group !== group) {
      group = rows[i].group;
      list.appendChild(createElement('h3', 'side-title', group));
    }

    var row = createElement('div', 'material-row');
    row.appendChild(createElement('span', '', rows[i].name));
    row.appendChild(createElement('span', 'material-qty', rows[i].qty));
    row.appendChild(createElement('span', '', rows[i].unit));
    list.appendChild(row);
  }
}

function quoteCsv(value) {
  return '"' + String(value).split('"').join('""') + '"';
}

// Downloads the material list as CSV that opens in Excel.
function downloadMaterialCsv() {
  var rows = buildMaterialRows();
  var lines = [[TEXTS.materialGroup, TEXTS.typeName, TEXTS.materialQty, TEXTS.materialUnit].map(quoteCsv).join(';')];

  for (var i = 0; i < rows.length; i++) {
    lines.push([rows[i].group, rows[i].name, rows[i].qty, rows[i].unit].map(quoteCsv).join(';'));
  }

  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'supis-materialu.csv';
  link.click();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
}

function copyMaterial() {
  var rows = buildMaterialRows();
  var lines = [];

  for (var i = 0; i < rows.length; i++) {
    lines.push([rows[i].group, rows[i].name, rows[i].qty, rows[i].unit].join('\t'));
  }

  try {
    navigator.clipboard.writeText(lines.join('\n'));
  } catch (error) {
    // Clipboard is not available.
  }
}

function printMaterial() {
  document.body.classList.add('print-material');
  window.print();
  document.body.classList.remove('print-material');
}

function removeCircuit(circuitId) {
  var kept = [];

  for (var i = 0; i < state.circuits.length; i++) {
    if (state.circuits[i].id !== circuitId) {
      kept.push(state.circuits[i]);
    }
  }

  state.circuits = kept;
  var surfaces = getAllSurfaces();

  for (var s = 0; s < surfaces.length; s++) {
    for (var c = 0; c < surfaces[s].cables.length; c++) {
      if (surfaces[s].cables[c].circuitId === circuitId) {
        surfaces[s].cables[c].circuitId = null;
      }
    }

    for (var k = 0; k < surfaces[s].symbols.length; k++) {
      if (surfaces[s].symbols[k].circuitId === circuitId) {
        surfaces[s].symbols[k].circuitId = null;
      }
    }
  }

  if (ui.activeCircuitId === circuitId) {
    ui.activeCircuitId = null;
  }

  markChanged();
  renderCircuitsDialog();
}

function addCircuitTextInput(row, circuit, key) {
  var input = createElement('input', 'field-input');
  input.value = circuit[key];
  input.addEventListener('change', function () {
    circuit[key] = key === 'name' ? (input.value.trim() || circuit.name) : input.value.trim();
    markChanged();
  });
  row.appendChild(input);
}

function addCircuitRow(list, circuit) {
  var row = createElement('div', 'circuit-row');
  addCircuitTextInput(row, circuit, 'name');
  addCircuitOptionSelect(row, circuit, 'breaker', BREAKER_OPTIONS);
  addCircuitOptionSelect(row, circuit, 'rcd', RCD_OPTIONS);
  var color = createElement('input', 'field-input');
  color.type = 'color';
  color.value = circuit.color;
  color.addEventListener('input', function () {
    circuit.color = color.value;
    markChanged();
  });
  row.appendChild(color);
  var width = createElement('input', 'field-input');
  width.type = 'number';
  width.min = '1';
  width.max = '12';
  width.step = '0.5';
  width.value = circuit.width || 3.5;
  width.addEventListener('change', function () {
    var value = parseFloat(width.value);

    if (!isNaN(value) && value >= 1 && value <= 12) {
      circuit.width = value;
      markChanged();
      render();
    } else {
      width.value = circuit.width || 3.5;
    }
  });
  row.appendChild(width);
  var cableSelect = createElement('select', 'field-input');

  for (var t = 0; t < state.cableTypes.length; t++) {
    var option = createElement('option', '', state.cableTypes[t].name);
    option.value = state.cableTypes[t].id;
    cableSelect.appendChild(option);
  }

  cableSelect.value = circuit.cableTypeId || state.cableTypes[0].id;
  cableSelect.addEventListener('change', function () {
    circuit.cableTypeId = cableSelect.value;
    markChanged();
  });
  row.appendChild(cableSelect);
  var remove = createElement('button', '', TEXTS.deleteItem);
  remove.addEventListener('click', function () { removeCircuit(circuit.id); });
  row.appendChild(remove);
  list.appendChild(row);
}

// ---------- Cable types dialog ----------

function openTypesDialog() {

function closeTypesDialog() {

function addCableType() {
  state.cableTypes.push(makeCableType('cable-n' + newId(), TEXTS.newCableName, 3, 1.5, 'round'));
  markChanged();
  renderTypesDialog();
}

function removeCableType(typeId) {
  if (state.cableTypes.length <= 1) {
    alert(TEXTS.typeLast);
    return;
  }

  if (countCablesOfType(typeId) > 0) {
    alert(TEXTS.typeInUse);
    return;
  }

  var kept = [];

  for (var i = 0; i < state.cableTypes.length; i++) {
    if (state.cableTypes[i].id !== typeId) {
      kept.push(state.cableTypes[i]);
    }
  }

  state.cableTypes = kept;
  markChanged();
  renderTypesDialog();
}

function renderTypesDialog() {
  var list = elements.typesList;
  list.textContent = '';
  var head = createElement('div', 'type-row type-head');
  var labels = [TEXTS.typeName, TEXTS.typeCores, TEXTS.typeSection, TEXTS.typeShape, ''];

  for (var h = 0; h < labels.length; h++) {
    head.appendChild(createElement('span', '', labels[h]));
  }

  list.appendChild(head);

function addTypeRow(list, type) {
  var row = createElement('div', 'type-row');

  name.value = type.name;
  name.addEventListener('change', function () {
    type.name = name.value.trim() || type.name;

  });
  var cores = createElement('input', 'field-input');
  cores.type = 'number';
  cores.min = '1';
  cores.max = '12';
  cores.step = '1';
  cores.value = type.cores;
  cores.addEventListener('change', function () {

    if (!isNaN(value) && value >= 1 && value <= 12) {

    }
  });
  var section = createElement('input', 'field-input');
  section.type = 'number';
  section.min = '0';
  section.step = '0.5';
  section.value = type.section;
  section.addEventListener('change', function () {
    var value = parseFloat(section.value);

    if (!isNaN(value) && value >= 0) {
      type.section = value;
      markChanged();
    } else {
      section.value = type.section;
    }
  });
  var shape = createElement('select', 'field-input');
  var round = createElement('option', '', TEXTS.shapeRound);
  round.value = 'round';
  var flat = createElement('option', '', TEXTS.shapeFlat);
  flat.value = 'flat';
  shape.appendChild(round);
  shape.appendChild(flat);
  shape.value = type.shape;
  shape.addEventListener('change', function () {
    type.shape = shape.value;

  });
  var remove = createElement('button', '', TEXTS.deleteItem);
  remove.addEventListener('click', function () { removeCableType(type.id); });
  row.appendChild(name);
  row.appendChild(cores);
  row.appendChild(section);
  row.appendChild(shape);
  row.appendChild(remove);
  list.appendChild(row);
}

function symbolIndex(type) {
  for (var i = 0; i < SYMBOL_TYPES.length; i++) {
    if (SYMBOL_TYPES[i].id === type) {
      return i;
    }
  }

  return 0;
}

// Value of a breaker or RCD from its stored circuit or its own value (independent of the shown wall).
function storedRating(symbol) {
  var circuit = getCircuit(symbol.circuitId);
  var key = symbol.type === 'rcd' ? 'rcd' : 'breaker';

  if (circuit) {
    return circuit[key] || '';
  }

  return symbol.rating || (symbol.type === 'rcd' ? '30 mA' : 'B16');
}

function totalsFor(walls) {
  var result = { sum: 0, byType: {}, symbols: {}, ratings: {}, ratingOrder: [] };

  for (var t = 0; t < state.cableTypes.length; t++) {
    result.byType[state.cableTypes[t].id] = 0;
  }

  for (var w = 0; w < walls.length; w++) {
    for (var s = 0; s < walls[w].symbols.length; s++) {
      var symbolType = walls[w].symbols[s].type;
      result.symbols[symbolType] = (result.symbols[symbolType] || 0) + 1;

      if (symbolType === 'breaker' || symbolType === 'rcd') {
        var ratingKey = TEXTS[symbolType === 'rcd' ? 'toolRcd' : 'toolBreaker'] + ' ' + storedRating(walls[w].symbols[s]);

        if (!result.ratings[ratingKey]) {
          result.ratings[ratingKey] = 0;
          result.ratingOrder.push(ratingKey);
        }

        result.ratings[ratingKey] = result.ratings[ratingKey] + 1;
      }
    }

    for (var c = 0; c < walls[w].cables.length; c++) {
      var cable = walls[w].cables[c];
      var length = cableLength(cable);
      result.sum = result.sum + length;
      result.byType[cable.typeId] = (result.byType[cable.typeId] || 0) + length;
    }
  }

  return result;
}

function formatMeters(cm) {
  return (cm / 100).toFixed(2).replace('.', ',') + ' m';
}

function addTotalsSection(box, title, totals) {
  box.appendChild(createElement('h3', 'side-title', title));

  for (var t = 0; t < state.cableTypes.length; t++) {
    if (!totals.byType[state.cableTypes[t].id]) {
      continue;
    }

    var row = createElement('div', 'totals-row');
    row.appendChild(createElement('span', '', state.cableTypes[t].name));
    row.appendChild(createElement('span', '', formatMeters(totals.byType[state.cableTypes[t].id])));
    box.appendChild(row);
  }

  var usedTypes = 0;

  for (var u = 0; u < state.cableTypes.length; u++) {
    if (totals.byType[state.cableTypes[u].id]) {
      usedTypes = usedTypes + 1;
    }
  }

  // The sum is shown only when it adds up several cable types.
  if (usedTypes > 1) {
    var sumRow = createElement('div', 'totals-row total');
    sumRow.appendChild(createElement('span', '', TEXTS.totalSum));
    sumRow.appendChild(createElement('span', '', formatMeters(totals.sum)));
    box.appendChild(sumRow);
  }

  for (var s = 0; s < SYMBOL_TYPES.length; s++) {
    var count = totals.symbols[SYMBOL_TYPES[s].id];

    if (!count || SYMBOL_TYPES[s].id === 'breaker' || SYMBOL_TYPES[s].id === 'rcd') {
      continue;
    }

    var symbolRow = createElement('div', 'totals-row');
    symbolRow.appendChild(createElement('span', '', TEXTS[SYMBOL_TYPES[s].textKey]));
    symbolRow.appendChild(createElement('span', '', count + ' ' + TEXTS.unitPieces));
    box.appendChild(symbolRow);
  }

  for (var r = 0; r < totals.ratingOrder.length; r++) {
    var ratingRow = createElement('div', 'totals-row');
    ratingRow.appendChild(createElement('span', '', totals.ratingOrder[r]));
    ratingRow.appendChild(createElement('span', '', totals.ratings[totals.ratingOrder[r]] + ' ' + TEXTS.unitPieces));
    box.appendChild(ratingRow);
  }
}

function updateTotals() {
  var box = elements.totals;
  box.textContent = '';

  if (ui.mode === 'wall' && getActiveWall()) {
    addTotalsSection(box, TEXTS.totalsWall, totalsFor(getActiveWall().back ? [getActiveWall(), getActiveWall().back] : [getActiveWall()]));
  }

  if (ui.mode === 'ceiling') {
    addTotalsSection(box, TEXTS.totalsCeiling, totalsFor([state.ceiling]));
  }

  addCircuitTotals(box);
  addTotalsSection(box, TEXTS.totalsAll, totalsFor(getAllSurfaces()));
}

function refreshAll() {
  ui.multi = [];
  buildToolbar();
  renderSidebar();
  resizeCanvas();
}
